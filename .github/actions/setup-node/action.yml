name: "Setup Node.js Environment"
description: "Sets up Node.js and an optional npm version for release workflows"

inputs:
  node-version:
    description: "Node.js version to install"
    required: false
    default: "22"
  npm-version:
    description: "npm version to install; leave empty to use the Node.js bundled version"
    required: false
    default: ""

outputs:
  node-version:
    description: "The Node.js version that was installed"
    value: ${{ steps.setup-node.outputs.node-version }}

runs:
  using: "composite"
  steps:
    - name: Set up Node.js
      id: setup-node
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        registry-url: "https://registry.npmjs.org"
        scope: "@compozy"

    - name: Install pinned npm
      if: inputs.npm-version != ''
      shell: bash
      env:
        NPM_VERSION: ${{ inputs.npm-version }}
      run: npm install --global "npm@${NPM_VERSION}"
