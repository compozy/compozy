name: "Setup Go Environment"
description: "Sets up Go with caching and only the pinned tools requested by the caller"

inputs:
  go-version:
    description: "Go version to install"
    required: false
    default: "1.26.4"
  install-gotestsum:
    description: "Install the pinned gotestsum test runner"
    required: false
    default: "false"
  install-golangci-lint:
    description: "Install the pinned golangci-lint binary"
    required: false
    default: "false"
  cache:
    description: "Cache Go modules and build outputs"
    required: false
    default: "true"
  cache-key-suffix:
    description: "Job-specific cache-key suffix, including a leading dash when set"
    required: false
    default: ""
  save-build-cache:
    description: "Save the Go build cache at job end; keep false outside main so pull requests stay restore-only"
    required: false
    default: "false"
  verify-modules:
    description: "Download and verify all modules eagerly"
    required: false
    default: "false"

outputs:
  go-version:
    description: "The Go version that was installed"
    value: ${{ steps.setup-go.outputs.go-version }}

runs:
  using: "composite"
  steps:
    - name: Set up Go
      id: setup-go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        cache: "false"

    - name: Resolve Go cache paths
      if: inputs.cache == 'true'
      id: go-cache-paths
      shell: bash
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

    - name: Cache Go modules
      if: inputs.cache == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.go-cache-paths.outputs.modules }}
        key: ${{ runner.os }}-${{ runner.arch }}-gomod-${{ hashFiles('go.sum', 'sdk/go/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-gomod-

    - name: Restore Go build cache
      if: inputs.cache == 'true' && inputs.save-build-cache != 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.go-cache-paths.outputs.build }}
        key: ${{ runner.os }}-${{ runner.arch }}-gobuild-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}${{ inputs.cache-key-suffix }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-gobuild-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}${{ inputs.cache-key-suffix }}-
          ${{ runner.os }}-${{ runner.arch }}-gobuild-${{ steps.setup-go.outputs.go-version }}-

    - name: Restore and save Go build cache
      if: inputs.cache == 'true' && inputs.save-build-cache == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.go-cache-paths.outputs.build }}
        key: ${{ runner.os }}-${{ runner.arch }}-gobuild-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}${{ inputs.cache-key-suffix }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-gobuild-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}${{ inputs.cache-key-suffix }}-
          ${{ runner.os }}-${{ runner.arch }}-gobuild-${{ steps.setup-go.outputs.go-version }}-

    - name: Download Go modules
      if: inputs.verify-modules == 'true'
      shell: bash
      run: |
        echo "Downloading Go modules..."
        go mod download
        go mod verify

    - name: Install gotestsum
      if: inputs.install-gotestsum == 'true'
      shell: bash
      env:
        GOTESTSUM_VERSION: "1.13.0"
        GOTESTSUM_SHA256_LINUX_AMD64: "11ccddeaf708ef228889f9fe2f68291a75b27013ddfc3b18156e094f5f40e8ee"
      run: |
        set -euo pipefail
        if [[ "$(uname -s)" == "Linux" && "$(uname -m)" == "x86_64" ]]; then
          archive="$(mktemp -t gotestsum.XXXXXX.tar.gz)"
          curl -sSfL --retry 3 -o "$archive" \
            "https://github.com/gotestyourself/gotestsum/releases/download/v${GOTESTSUM_VERSION}/gotestsum_${GOTESTSUM_VERSION}_linux_amd64.tar.gz"
          echo "${GOTESTSUM_SHA256_LINUX_AMD64}  ${archive}" | sha256sum -c -
          install_dir="$(go env GOPATH)/bin"
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gotestsum
          rm -f "$archive"
        else
          go install "gotest.tools/gotestsum@v${GOTESTSUM_VERSION}"
        fi
        gotestsum --version

    - name: Install golangci-lint
      if: inputs.install-golangci-lint == 'true'
      shell: bash
      run: |
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.13.1
