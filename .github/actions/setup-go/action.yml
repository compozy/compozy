name: "Setup Go Environment"
description: "Sets up Go with caching and only the pinned tools requested by the caller"

inputs:
  go-version:
    description: "Go version to install"
    required: false
    default: "1.26.4"
  install-gotestsum:
    description: "Install the pinned gotestsum test runner"
    required: false
    default: "false"
  install-golangci-lint:
    description: "Install the pinned golangci-lint binary"
    required: false
    default: "false"
  cache:
    description: "Cache Go modules and build outputs with a moving CI key"
    required: false
    default: "true"
  cache-key-suffix:
    description: "Job-specific cache-key suffix, including a leading dash when set"
    required: false
    default: ""
  verify-modules:
    description: "Download and verify all modules eagerly"
    required: false
    default: "false"

outputs:
  go-version:
    description: "The Go version that was installed"
    value: ${{ steps.setup-go.outputs.go-version }}

runs:
  using: "composite"
  steps:
    - name: Set up Go
      id: setup-go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ inputs.go-version }}
        cache: "false"

    - name: Resolve Go cache paths
      if: inputs.cache == 'true'
      id: go-cache-paths
      shell: bash
      run: |
        echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"

    - name: Restore moving Go cache
      if: inputs.cache == 'true'
      uses: actions/cache@v6
      with:
        path: |
          ${{ steps.go-cache-paths.outputs.build }}
          ${{ steps.go-cache-paths.outputs.modules }}
        key: ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}${{ inputs.cache-key-suffix }}-${{ github.ref_name }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}${{ inputs.cache-key-suffix }}-${{ github.ref_name }}-
          ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}${{ inputs.cache-key-suffix }}-
          ${{ runner.os }}-${{ runner.arch }}-go-${{ steps.setup-go.outputs.go-version }}-

    - name: Download Go modules
      if: inputs.verify-modules == 'true'
      shell: bash
      run: |
        echo "Downloading Go modules..."
        go mod download
        go mod verify

    - name: Install gotestsum
      if: inputs.install-gotestsum == 'true'
      shell: bash
      run: go install gotest.tools/gotestsum@v1.13.0

    - name: Install golangci-lint
      if: inputs.install-golangci-lint == 'true'
      shell: bash
      run: |
        curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
