name: Windows signing and permission diagnostics

on:
  push:
    branches: [ci/windows-signing-metadata]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-metadata:
    name: Read existing signing certificate metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Prepare the official Azure SDK client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing-metadata"
          cd "$RUNNER_TEMP/signing-metadata"
          dotnet new console --framework net8.0 --no-restore
          dotnet add package Azure.CodeSigning.Sdk --version 0.1.164
          dotnet add package Azure.Identity --version 1.21.0
          cat > Program.cs <<'CS'
          using Azure;
          using Azure.Core;
          using Azure.CodeSigning;
          using Azure.Identity;
          using System.Net.Http.Headers;
          using System.Security.Cryptography.X509Certificates;
          using System.Text.Json;
          using System.Text.RegularExpressions;

          static string Required(string name) =>
              Environment.GetEnvironmentVariable(name) is { Length: > 0 } value
                  ? value.Trim() : throw new InvalidOperationException($"Missing {name}");

          try
          {
              var endpoint = new Uri("https://wus2.codesigning.azure.net/");
              var credential = new ClientSecretCredential(
                  Required("AZURE_TENANT_ID"), Required("AZURE_CLIENT_ID"),
                  Required("AZURE_CLIENT_SECRET"));
              using var deadline = new CancellationTokenSource(TimeSpan.FromSeconds(90));
              var armToken = await credential.GetTokenAsync(
                  new TokenRequestContext(new[] { "https://management.azure.com/.default" }), deadline.Token);
              Console.WriteLine("Existing build credential authentication succeeded.");
              using var http = new HttpClient();
              http.DefaultRequestHeaders.Authorization = new AuthenticationHeaderValue("Bearer", armToken.Token);
              using var subscriptionResponse = await http.GetAsync(
                  "https://management.azure.com/subscriptions?api-version=2022-12-01", deadline.Token);
              Console.WriteLine($"Subscription discovery HTTP {(int)subscriptionResponse.StatusCode}.");
              if (subscriptionResponse.IsSuccessStatusCode)
              {
                  using var subscriptions = JsonDocument.Parse(await subscriptionResponse.Content.ReadAsStringAsync(deadline.Token));
                  Console.WriteLine($"Visible subscriptions: {subscriptions.RootElement.GetProperty("value").GetArrayLength()}.");
                  foreach (var subscription in subscriptions.RootElement.GetProperty("value").EnumerateArray())
                  {
                      var subscriptionId = subscription.GetProperty("subscriptionId").GetString();
                      using var accountResponse = await http.GetAsync(
                          $"https://management.azure.com/subscriptions/{subscriptionId}/providers/Microsoft.CodeSigning/codeSigningAccounts?api-version=2025-10-13", deadline.Token);
                      Console.WriteLine($"Signing account discovery HTTP {(int)accountResponse.StatusCode}.");
                      if (!accountResponse.IsSuccessStatusCode) continue;
                      using var accounts = JsonDocument.Parse(await accountResponse.Content.ReadAsStringAsync(deadline.Token));
                      foreach (var account in accounts.RootElement.GetProperty("value").EnumerateArray())
                      {
                          if (!String.Equals(account.GetProperty("name").GetString(),
                              Required("AZURE_CODE_SIGNING_ACCOUNT"), StringComparison.OrdinalIgnoreCase)) continue;
                          var accountUri = new Uri(account.GetProperty("properties").GetProperty("accountUri").GetString()!);
                          if (accountUri.Scheme != "https" || !accountUri.Host.EndsWith(".codesigning.azure.net", StringComparison.OrdinalIgnoreCase))
                              throw new InvalidOperationException("Unexpected signing service host");
                          endpoint = new Uri(accountUri.GetLeftPart(UriPartial.Authority) + "/");
                          Console.WriteLine("Existing signing account found; endpoint: " + endpoint.AbsoluteUri);
                      }
                  }
              }
              var found = false;
              foreach (var region in new[] { "wus2", "eus", "neu", "weu", "wcus", "wus", "wus3", "cus", "ncus", "scus", "brs", "jpe", "krc", "plc", "swn" })
              {
                  endpoint = new Uri($"https://{region}.codesigning.azure.net/");
                  try
                  {
                      var options = new CertificateProfileClientOptions();
                      options.Retry.MaxRetries = 0;
                      options.Retry.NetworkTimeout = TimeSpan.FromSeconds(8);
                      var client = new CertificateProfileClient(credential, endpoint, options);
                      var response = await client.GetSignCertificateChainAsync(
                          Required("AZURE_CODE_SIGNING_ACCOUNT"),
                          Required("AZURE_CERTIFICATE_PROFILE"), cancellationToken: deadline.Token);
                      using var stream = response.Value;
                      using var bytes = new MemoryStream();
                      await stream.CopyToAsync(bytes, deadline.Token);
                      var certificates = new X509Certificate2Collection();
                      certificates.Import(bytes.ToArray());
                      try
                      {
                          var leaf = certificates.Cast<X509Certificate2>().Single(cert =>
                              cert.Extensions.OfType<X509EnhancedKeyUsageExtension>().Any(extension =>
                                  extension.EnhancedKeyUsages.Cast<System.Security.Cryptography.Oid>()
                                      .Any(oid => oid.Value == "1.3.6.1.5.5.7.3.3")) &&
                              !cert.Extensions.OfType<X509BasicConstraintsExtension>()
                                  .Any(extension => extension.CertificateAuthority));
                          if (DateTime.UtcNow < leaf.NotBefore.ToUniversalTime() ||
                              DateTime.UtcNow > leaf.NotAfter.ToUniversalTime())
                              throw new InvalidOperationException("Signing certificate is not currently valid");
                          var metadata = JsonSerializer.Serialize(new
                          {
                              endpoint = endpoint.AbsoluteUri,
                              publisherName = leaf.GetNameInfo(X509NameType.SimpleName, false),
                              validFrom = leaf.NotBefore.ToUniversalTime(),
                              validTo = leaf.NotAfter.ToUniversalTime(),
                          });
                          Console.WriteLine(metadata);
                          await File.AppendAllTextAsync(Required("GITHUB_STEP_SUMMARY"),
                              "Public signing certificate metadata:\n\n```json\n" + metadata + "\n```\n");
                      }
                      finally
                      {
                          foreach (var certificate in certificates) certificate.Dispose();
                      }
                      found = true;
                      break;
                  }
                  catch (RequestFailedException failure)
                  {
                      var code = Regex.IsMatch(failure.ErrorCode ?? "", @"^[A-Za-z0-9_.-]{1,80}$") ? failure.ErrorCode : "";
                      Console.WriteLine($"Certificate discovery {region}: HTTP {failure.Status}; {code}");
                  }
              }
              if (!found) throw new InvalidOperationException("No certificate returned by the documented regional endpoints");
          }
          catch (Exception error)
          {
              // Never print SDK messages, request URLs, tokens, or credential values.
              var aadCode = Regex.Match(error.ToString(), @"AADSTS\d+").Value;
              var status = error is RequestFailedException request ? request.Status : 0;
              var serviceCode = error is RequestFailedException service &&
                  Regex.IsMatch(service.ErrorCode ?? "", @"^[A-Za-z0-9_.-]{1,80}$") ? service.ErrorCode : "";
              Console.Error.WriteLine($"Signing metadata lookup failed: {error.GetType().Name}; HTTP {status}; {serviceCode}; {aadCode}");
              Environment.ExitCode = 1;
          }
          CS
          dotnet build --configuration Release --no-restore
      - name: Query the certificate without signing or publishing an artifact
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
        run: dotnet run --project "$RUNNER_TEMP/signing-metadata" --configuration Release --no-build

  permission-process:
    name: Compare the Windows control suite environment
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 02d0ac1db22930f3f6809c431384a9e588c34f53
      - uses: ./.github/actions/setup-bun
        with:
          install-playwright: "false"
      - name: Instrument only process startup and system environment presence
        shell: bash
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          test = Path("desktop/src/control/__tests__/control-server.test.ts")
          source = test.read_text()
          source = source.replace("interface WireResponse {", """
          console.log("control runtime", JSON.stringify({
            node: process.versions.node, bun: process.versions.bun,
            environment: Object.keys(process.env).filter(key => /^(SystemRoot|SystemDrive|WINDIR|ComSpec|USERPROFILE|USERNAME|USERDOMAIN|PSModulePath|PATH|PATHEXT|APPDATA|LOCALAPPDATA)$/i.test(key)).sort(),
          }));
          interface WireResponse {
          """)
          test.write_text(source)
          permission = Path("desktop/src/files/windows-permissions.ts")
          source = permission.read_text().replace('  const command = execute(', '  const started = Date.now();\n  console.log("security process starting", Object.keys(environment));\n  const command = execute(')
          source = source.replace('["-NoProfile", "-NonInteractive", "-Command", script]', '["-NoProfile", "-NonInteractive", "-Command", "[Console]::Error.WriteLine(\'security script started\'); " + script]')
          source = source.replace('  command.child.stdin?.end();', '  command.child.stderr?.on("data", data => console.log("security phase", String(data)));\n  command.child.on("close", (code, signal) => console.log("security closed", {code, signal, ms: Date.now() - started}));\n  command.child.stdin?.end();')
          permission.write_text(source)
          PYTHON
      - name: Run the existing control suite through strict Turbo
        shell: bash
        run: bunx turbo run test --filter=@compozy/desktop --only --force -- --coverage.enabled=false src/control/__tests__/control-server.test.ts
      - name: Compare the same suite with the inherited environment
        if: always()
        shell: bash
        run: bunx turbo run test --filter=@compozy/desktop --only --force --env-mode=loose -- --coverage.enabled=false src/control/__tests__/control-server.test.ts
