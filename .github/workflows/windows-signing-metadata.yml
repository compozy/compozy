name: Windows signing and permission diagnostics

on:
  push:
    branches: [ci/windows-signing-metadata]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-metadata:
    name: Read existing signing certificate metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Prepare the official Azure SDK client
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing-metadata"
          cd "$RUNNER_TEMP/signing-metadata"
          dotnet new console --framework net8.0 --no-restore
          dotnet add package Azure.CodeSigning.Sdk --version 0.1.164
          dotnet add package Azure.Identity --version 1.21.0
          cat > Program.cs <<'CS'
          using Azure;
          using Azure.CodeSigning;
          using Azure.Identity;
          using System.Security.Cryptography.X509Certificates;
          using System.Text.Json;
          using System.Text.RegularExpressions;

          static string Required(string name) =>
              Environment.GetEnvironmentVariable(name) is { Length: > 0 } value
                  ? value : throw new InvalidOperationException($"Missing {name}");

          try
          {
              var endpoint = new Uri("https://wus2.codesigning.azure.net/");
              var credential = new ClientSecretCredential(
                  Required("AZURE_TENANT_ID"), Required("AZURE_CLIENT_ID"),
                  Required("AZURE_CLIENT_SECRET"));
              var client = new CertificateProfileClient(credential, endpoint);
              using var deadline = new CancellationTokenSource(TimeSpan.FromSeconds(45));
              var response = await client.GetSignCertificateChainAsync(
                  Required("AZURE_CODE_SIGNING_ACCOUNT"),
                  Required("AZURE_CERTIFICATE_PROFILE"), cancellationToken: deadline.Token);
              using var stream = response.Value;
              using var bytes = new MemoryStream();
              await stream.CopyToAsync(bytes, deadline.Token);
              var certificates = new X509Certificate2Collection();
              certificates.Import(bytes.ToArray());
              try
              {
                  var leaf = certificates.Cast<X509Certificate2>().Single(cert =>
                      cert.Extensions.OfType<X509EnhancedKeyUsageExtension>().Any(extension =>
                          extension.EnhancedKeyUsages.Cast<System.Security.Cryptography.Oid>()
                              .Any(oid => oid.Value == "1.3.6.1.5.5.7.3.3")) &&
                      !cert.Extensions.OfType<X509BasicConstraintsExtension>()
                          .Any(extension => extension.CertificateAuthority));
                  if (DateTime.UtcNow < leaf.NotBefore.ToUniversalTime() ||
                      DateTime.UtcNow > leaf.NotAfter.ToUniversalTime())
                      throw new InvalidOperationException("Signing certificate is not currently valid");
                  var metadata = JsonSerializer.Serialize(new
                  {
                      endpoint = endpoint.AbsoluteUri,
                      publisherName = leaf.GetNameInfo(X509NameType.SimpleName, false),
                      validFrom = leaf.NotBefore.ToUniversalTime(),
                      validTo = leaf.NotAfter.ToUniversalTime(),
                  });
                  Console.WriteLine(metadata);
                  await File.AppendAllTextAsync(Required("GITHUB_STEP_SUMMARY"),
                      "Public signing certificate metadata:\n\n```json\n" + metadata + "\n```\n");
              }
              finally
              {
                  foreach (var certificate in certificates) certificate.Dispose();
              }
          }
          catch (Exception error)
          {
              // Never print SDK messages, request URLs, tokens, or credential values.
              var aadCode = Regex.Match(error.ToString(), @"AADSTS\d+").Value;
              var status = error is RequestFailedException request ? request.Status : 0;
              Console.Error.WriteLine($"Signing metadata lookup failed: {error.GetType().Name}; HTTP {status}; {aadCode}");
              Environment.ExitCode = 1;
          }
          CS
          dotnet build --configuration Release --no-restore
      - name: Query the certificate without signing or publishing an artifact
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
          AZURE_CERTIFICATE_PROFILE: ${{ secrets.AZURE_CERTIFICATE_PROFILE }}
        run: dotnet run --project "$RUNNER_TEMP/signing-metadata" --configuration Release --no-build

  permission-process:
    name: Isolate the native Windows permission process
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 02d0ac1db22930f3f6809c431384a9e588c34f53
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Compare PowerShell startup and the production directory boundary
        shell: bash
        run: |
          node --experimental-strip-types --input-type=module <<'JS'
          import { execFile, spawn } from "node:child_process";
          import { mkdtemp, rm } from "node:fs/promises";
          import { tmpdir } from "node:os";
          import { join } from "node:path";
          import { promisify } from "node:util";
          import { protectWindowsDirectory } from "./desktop/src/files/windows-permissions.ts";

          const exe = join(process.env.SystemRoot, "System32", "WindowsPowerShell", "v1.0", "powershell.exe");
          const run = promisify(execFile);
          const basic = "[Console]::Out.WriteLine('PowerShell started')";
          for (const windowsHide of [true, false]) {
            const started = Date.now();
            const command = run(exe, ["-NoProfile", "-NonInteractive", "-Command", basic], {
              windowsHide, timeout: 10000, maxBuffer: 65536,
            });
            command.child.stdin?.end();
            try {
              const { stdout, stderr } = await command;
              console.log(JSON.stringify({ check: "startup", windowsHide, ms: Date.now() - started, stdout, stderr }));
            } catch (error) {
              console.log(JSON.stringify({ check: "startup", windowsHide, ms: Date.now() - started,
                code: error.code, signal: error.signal, killed: error.killed, stdout: error.stdout, stderr: error.stderr }));
            }
          }
          const home = await mkdtemp(join(tmpdir(), "compozy-acl-probe-"));
          try {
            const started = Date.now();
            try {
              await protectWindowsDirectory(home, true);
              console.log(JSON.stringify({ check: "production-directory", ms: Date.now() - started, result: "passed" }));
            } catch (error) {
              console.log(JSON.stringify({ check: "production-directory", ms: Date.now() - started,
                code: error.code, signal: error.signal, killed: error.killed, stdout: error.stdout, stderr: error.stderr }));
              process.exitCode = 1;
            }
            const script = [
              "$ErrorActionPreference = 'Stop'",
              "[Console]::Out.WriteLine('started')",
              "$user = [System.Security.Principal.WindowsIdentity]::GetCurrent().User",
              "[Console]::Out.WriteLine('identity ready')",
              "$acl = [System.Security.AccessControl.DirectorySecurity]::new()",
              "$acl.SetOwner($user)",
              "$acl.SetAccessRuleProtection($true, $false)",
              "$rule = [System.Security.AccessControl.FileSystemAccessRule]::new($user, 'FullControl', 'ContainerInherit, ObjectInherit', 'None', 'Allow')",
              "$acl.AddAccessRule($rule)",
              "[Console]::Out.WriteLine('ACL ready')",
              "Set-Acl -LiteralPath $env:COMPOZY_PRIVATE_DIRECTORY -AclObject $acl",
              "[Console]::Out.WriteLine('ACL applied')",
            ].join("; ");
            await new Promise(resolve => {
              const child = spawn(exe, ["-NoProfile", "-NonInteractive", "-Command", script], {
                stdio: ["ignore", "pipe", "pipe"], windowsHide: true, timeout: 15000,
                env: { ...process.env, COMPOZY_PRIVATE_DIRECTORY: home },
              });
              child.stdout.on("data", data => process.stdout.write(data));
              child.stderr.on("data", data => process.stderr.write(data));
              child.on("error", error => console.log(JSON.stringify({ check: "no-input", code: error.code })));
              child.on("close", (code, signal) => { console.log(JSON.stringify({ check: "no-input", code, signal })); resolve(); });
            });
          } finally {
            await rm(home, { recursive: true, force: true });
          }
          JS
