name: Peer convergence diagnostic

on:
  push:
    branches: [fix/issue-941-e2e023-peer-convergence]

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: 0
      CI: "true"
      COMPOZY_TEST_DAEMON_BIN: /tmp/compozy-peer-diagnostic
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 20
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-bun
        with:
          install-playwright: "true"
      - name: Prepare baseline on the same runner
        run: |
          cp web/src/systems/os/hooks/use-os-window-member.ts /tmp/candidate-member.ts
          git show 271a49aac:web/src/systems/os/hooks/use-os-window-member.ts > web/src/systems/os/hooks/use-os-window-member.ts
          bunx turbo run build --filter=./web
          go build -o /tmp/compozy-peer-diagnostic ./cmd/compozy
      - name: Baseline must reproduce the retained surface regression
        run: |
          if bunx turbo run test --filter=./web -- src/systems/os/hooks/__tests__/os-interaction-hooks.test.tsx -t useOsWindowMember; then
            echo "Expected the baseline to fail the geometry render invariant"
            exit 1
          fi
      - name: Baseline ten repetitions
        continue-on-error: true
        working-directory: web
        run: bunx playwright test os-shell.spec.ts --grep E2E-023 --repeat-each 10
      - name: Preserve baseline report
        if: always()
        run: cp -R .tmp/playwright /tmp/baseline-peer-report
      - name: Build candidate on the same runner
        run: |
          cp /tmp/candidate-member.ts web/src/systems/os/hooks/use-os-window-member.ts
          bunx turbo run build --filter=./web
      - name: Candidate retained surface regression
        run: bunx turbo run test --filter=./web -- src/systems/os/hooks/__tests__/os-interaction-hooks.test.tsx -t useOsWindowMember
      - name: Candidate twenty repetitions
        working-directory: web
        run: bunx playwright test os-shell.spec.ts --grep E2E-023 --repeat-each 20
      - name: Upload measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: peer-convergence-comparison
          path: |
            .tmp/playwright
            /tmp/baseline-peer-report
          retention-days: 7
