name: Peer convergence diagnostic
on:
  push:
    branches: [fix/issue-941-residual-peer-work]
permissions:
  contents: read
jobs:
  stages:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CGO_ENABLED: 0
      CI: "true"
      COMPOZY_PEER_PROFILE: "1"
      COMPOZY_TEST_DAEMON_BIN: /tmp/compozy-peer-diagnostic
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-bun
        with:
          install-playwright: "true"
      - id: build
        run: |
          bunx turbo run build --filter=./web
          go build -o /tmp/compozy-peer-diagnostic ./cmd/compozy
      - name: Check window component behavior
        run: bunx turbo run test --filter=./web -- src/systems/os/components/__tests__/os-window.test.tsx
      - name: Attribute residual convergence work
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: web
        run: bunx playwright test os-shell.spec.ts --grep E2E-023 --repeat-each 10
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: residual-peer-profile
          path: |
            .tmp/playwright
            web/dist
          retention-days: 7
