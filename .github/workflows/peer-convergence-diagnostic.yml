name: Peer convergence diagnostic
on:
  push:
    branches: [fix/issue-941-e2e023-peer-convergence]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-bun
      - run: bunx turbo run build --filter=./web
      - name: Resolve attributed script offsets
        run: |
          python3 - <<'PYCODE'
          import pathlib
          for pattern,offset in [('_app-*.js',395023),('query-*.js',1646)]:
              for path in pathlib.Path('web/dist/assets').glob(pattern):
                  source=path.read_text()
                  print('ATTRIBUTED_SOURCE',path.name,source[max(0,offset-1500):offset+2500])
                  if pattern.startswith('_app'):
                      for marker in ['os-window-overlays','os-window-frame-']:
                          at=source.find(marker)
                          print('COMPILED_MEMBER',marker,source[max(0,at-4000):at+1500])
          PYCODE
