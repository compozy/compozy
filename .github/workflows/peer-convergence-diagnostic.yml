name: Peer convergence diagnostic
on:
  push:
    branches: [fix/issue-941-residual-2]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CGO_ENABLED: 0
      CI: "true"
      COMPOZY_TEST_DAEMON_BIN: /tmp/compozy-peer-diagnostic
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-go
      - uses: ./.github/actions/setup-bun
        with:
          install-playwright: "true"
      - name: Prepare uninstrumented baseline
        run: |
          cp web/src/systems/os/hooks/use-cmd-palette-context.ts /tmp/candidate-hook.ts
          git show 4eb4968fead6a2b72e626980924dd4d6291a37d9:web/src/systems/os/hooks/use-cmd-palette-context.ts > web/src/systems/os/hooks/use-cmd-palette-context.ts
          git show 4eb4968fead6a2b72e626980924dd4d6291a37d9:web/e2e/__tests__/os-shell.spec.ts > web/e2e/__tests__/os-shell.spec.ts
          bunx turbo run build --filter=./web
          go build -o /tmp/compozy-peer-diagnostic ./cmd/compozy
      - name: Baseline ten repetitions
        continue-on-error: true
        working-directory: web
        run: bunx playwright test os-shell.spec.ts --grep E2E-023 --repeat-each 10
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: baseline-peer-envelope
          path: .tmp/playwright
          retention-days: 7
      - name: Build candidate and test owning suites
        run: |
          cp /tmp/candidate-hook.ts web/src/systems/os/hooks/use-cmd-palette-context.ts
          bunx turbo run test --filter=./web -- src/systems/os/hooks/__tests__/os-interaction-hooks.test.tsx src/systems/os/hooks/__tests__/use-cmd-palette-context.test.tsx
          bunx turbo run build --filter=./web
      - name: Candidate thirty repetitions
        working-directory: web
        run: bunx playwright test os-shell.spec.ts --grep E2E-023 --repeat-each 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: candidate-peer-envelope
          path: .tmp/playwright
          retention-days: 7
