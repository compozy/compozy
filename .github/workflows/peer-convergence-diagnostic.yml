name: Peer convergence diagnostic
on:
  push:
    branches: [fix/issue-941-e2e023-peer-convergence]
permissions:
  contents: read
  actions: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: 40050522287
          name: peer-frame-attribution
          path: traces
      - name: Resolve attributed script offsets
        run: |
          python3 - <<'PYCODE'
          import pathlib,zipfile,json
          seen=set()
          for path in pathlib.Path('traces').rglob('*.zip'):
              try:
                  archive=zipfile.ZipFile(path)
              except zipfile.BadZipFile:
                  continue
              for name in archive.namelist():
                  if not name.endswith('.network'): continue
                  for line in archive.read(name).decode().splitlines():
                      record=json.loads(line).get('snapshot',{})
                      url=record.get('request',{}).get('url','')
                      offsets={'_app-CVy3F0iC.js':395023,'query-DNwCG9-X.js':1646}
                      asset=next((asset for asset in offsets if asset in url),None)
                      if not asset or asset in seen: continue
                      content=record.get('response',{}).get('content',{})
                      key=content.get('_sha1')
                      if not key or 'resources/'+key not in archive.namelist(): continue
                      source=archive.read('resources/'+key).decode()
                      offset=offsets[asset]
                      print('ATTRIBUTED_SOURCE',asset,source[max(0,offset-1200):offset+2500])
                      seen.add(asset)
          print('FOUND',sorted(seen))
          PYCODE
