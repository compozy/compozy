name: Proto 0.3.0 migration
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  proto:
    name: Proto gallery (check, build, serve)
    if: github.head_ref == 'build/protohq-cli-0.3.0'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - name: Check prototypes, flows and story roots
        working-directory: web
        run: |
          bunx --no-install proto --version
          if ! bunx --no-install proto check --json > "$RUNNER_TEMP/proto-check.json"; then
            cat "$RUNNER_TEMP/proto-check.json"
            exit 1
          fi
          jq -e '{problems: (.problems | length), warnings: (.warnings | length)} | select(.problems == 0)' "$RUNNER_TEMP/proto-check.json"
          bunx --no-install proto stories list --json | jq -e '[.roots[].id] | select(sort == ["ui", "web"])'
      - name: Build the static gallery
        working-directory: web
        run: bunx --no-install proto build
      - name: Serve and stop the project gallery
        working-directory: web
        run: |
          node --input-type=module <<'JS'
          import assert from "node:assert/strict";
          import { spawn, spawnSync } from "node:child_process";
          import { once } from "node:events";
          import { createInterface } from "node:readline";

          const dev = spawn("bunx", ["--no-install", "proto", "dev", "--json"], {
            stdio: ["ignore", "pipe", "inherit"],
          });
          const stdout = createInterface({ input: dev.stdout });
          const signal = AbortSignal.timeout(90_000);
          try {
            const [line] = await Promise.race([
              once(stdout, "line", { signal }),
              once(dev, "exit", { signal }).then(([code]) => {
                throw new Error(`proto dev exited before publishing a URL (${code})`);
              }),
            ]);
            const { url } = JSON.parse(line);
            assert.match(url, /^http:\/\/127\.0\.0\.1:4400\/p\/[^/]+\/$/u);
            for (const path of ["", "?components"]) {
              const response = await fetch(new URL(path, url), { signal });
              assert.equal(response.status, 200);
              assert.match(response.headers.get("content-type"), /text\/html/u);
              await response.text();
              console.log(`HTTP 200 ${response.url}`);
            }
            const preview = spawnSync("bunx", ["--no-install", "proto", "url", "agent-avatar", "--bare"], {
              encoding: "utf8",
              timeout: 20_000,
            });
            assert.equal(preview.status, 0, preview.stderr);
            const response = await fetch(preview.stdout.trim(), { signal });
            assert.equal(response.status, 200);
            assert.match(response.headers.get("content-type"), /text\/html/u);
            await response.text();
            console.log(`HTTP 200 ${response.url}`);
          } finally {
            const stopped = spawnSync("bunx", ["--no-install", "proto", "stop", "--json"], {
              stdio: "inherit",
              timeout: 20_000,
            });
            stdout.close();
            dev.kill();
            assert.equal(stopped.status, 0);
          }
          JS
