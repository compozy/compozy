name: Go test census refresh

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  refresh:
    name: Fold shard timings into the census
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: "1.27.3"

      - name: Download latest shard timing artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/gotest-json
          run_id=""
          while read -r candidate; do
            if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/artifacts?per_page=100" \
              --jq '.artifacts[].name' | grep -q '^gotest-json-shard-'; then
              run_id="$candidate"
              break
            fi
          done < <(gh run list --workflow CI --branch main --event push --status success --limit 40 --json databaseId --jq '.[].databaseId')
          if [[ -z "$run_id" ]]; then
            echo "No successful CI run with gotest-json artifacts in the last 40; nothing to refresh."
          else
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --pattern 'gotest-json-shard-*' --dir /tmp/gotest-json
            find /tmp/gotest-json -mindepth 2 -name '*.json' -exec mv {} /tmp/gotest-json/ \;
          fi
          echo "CENSUS_RUN_ID=${run_id}" >> "$GITHUB_ENV"

      - name: Fold timing data into the census
        if: env.CENSUS_RUN_ID != ''
        run: go run github.com/magefile/mage@v1.17.2 testCensusUpdate /tmp/gotest-json

      - name: Download completed integration shard receipts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/integration-json
          run_id=""
          # A failed run or an incomplete matrix still contains useful completed
          # tests. Same-repository PRs (ci:full and release included) are eligible;
          # foreign fork artifacts never enter the committed timing census.
          for workflow in ci.yml release.yml; do
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?status=completed&per_page=40" \
              > "/tmp/census-${workflow}.json"
          done
          while read -r candidate; do
            names=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${candidate}/artifacts?per_page=100" --jq '.artifacts[] | select(.expired == false) | .name')
            if grep -q '^integration-artifacts-' <<<"$names"; then
              run_id="$candidate"
              break
            fi
          done < <(jq -s -r --arg repo "$GITHUB_REPOSITORY" '
            [.[].workflow_runs[] | select(.head_repository.full_name == $repo)] |
            sort_by(.created_at) | reverse | .[].id' /tmp/census-*.yml.json)
          if [[ -z "$run_id" ]]; then
            echo "::notice::No unexpired integration shard receipts in recent completed CI/Release runs."
          else
            gh run download "$run_id" --pattern 'integration-artifacts-*' --dir /tmp/integration-json
            mkdir -p /tmp/integration-census
            # Keep artifact directories so per-group shard filenames cannot collide.
            find /tmp/integration-json -name 'gotest-shard*.json' | while read -r receipt; do
              relative="${receipt#/tmp/integration-json/}"
              mkdir -p "/tmp/integration-census/$(dirname "$relative")"
              cp "$receipt" "/tmp/integration-census/$relative"
            done
            if find /tmp/integration-census -name '*.json' -print -quit | grep -q .; then
              echo "INTEGRATION_CENSUS_RUN_ID=$run_id" >> "$GITHUB_ENV"
            else
              echo "::notice::Run $run_id uploaded no timing JSON; preserving the integration census."
            fi
          fi

      - name: Fold integration timing data
        if: env.INTEGRATION_CENSUS_RUN_ID != ''
        env:
          COMPOZY_CENSUS_LANE: integration
          CENSUS_RUN_ID: ${{ env.INTEGRATION_CENSUS_RUN_ID }}
        run: go run github.com/magefile/mage@v1.17.2 testCensusUpdate /tmp/integration-census

      - name: Publish the refresh branch when the census changed
        if: env.CENSUS_RUN_ID != '' || env.INTEGRATION_CENSUS_RUN_ID != ''
        env:
          # The enterprise policy blocks GITHUB_TOKEN from creating pull
          # requests. With an optional CENSUS_PR_TOKEN (fine-grained PAT with
          # contents + pull-requests write) the PR opens automatically;
          # otherwise the branch is pushed and the summary links the one-click
          # PR creation page.
          GH_TOKEN: ${{ secrets.CENSUS_PR_TOKEN || github.token }}
          HAS_PR_TOKEN: ${{ secrets.CENSUS_PR_TOKEN != '' }}
        run: |
          set -euo pipefail
          if git diff --quiet -- magefiles/gotest_census.json; then
            echo "Census unchanged; no refresh needed."
            exit 0
          fi
          branch="ci/gotest-census-refresh"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add magefiles/gotest_census.json
          git commit -m "ci: refresh go test shard census"
          git push --force origin "$branch"
          if gh pr view "$branch" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Refresh PR already open for $branch."
            exit 0
          fi
          if [[ "$HAS_PR_TOKEN" == "true" ]]; then
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$branch" \
              --title "ci: refresh go test shard census" \
              --body "Automated weekly refresh of magefiles/gotest_census.json from completed same-repository shard timing artifacts. Unit CI run: ${CENSUS_RUN_ID:-none}. Integration CI/Release run: ${INTEGRATION_CENSUS_RUN_ID:-none}."
            exit 0
          fi
          compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          {
            echo "## Census refresh pushed"
            echo
            echo "Enterprise policy prevents GITHUB_TOKEN from opening pull requests."
            echo "Open the refresh PR manually: ${compare_url}"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=Census refresh pushed::Open the PR manually: ${compare_url}"
