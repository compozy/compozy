name: Go checkptr audit

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Go race test with full checkptr (${{ matrix.shard_index }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      COMPOZY_GO_FULL_CHECKPTR: "1"
      COMPOZY_GO_TEST_UNCACHED: "1"
      COMPOZY_GO_TEST_P: "1"
      COMPOZY_GO_TEST_SHARD_INDEX: ${{ matrix.shard_index }}
      COMPOZY_GO_TEST_SHARD_TOTAL: "8"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: "1.26.4"
          install-gotestsum: "true"

      - name: Set up Bun for codegen contract tests
        uses: ./.github/actions/setup-bun
        with:
          install-playwright: "false"

      - name: Run uncached race suite with full pointer checks
        run: make test
