name: Go checkptr audit

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Go race test with full checkptr
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COMPOZY_GO_FULL_CHECKPTR: "1"
      COMPOZY_GO_TEST_UNCACHED: "1"
      COMPOZY_GO_TEST_P: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: "1.26.4"
          install-gotestsum: "true"

      - name: Run uncached race suite with full pointer checks
        run: make test
