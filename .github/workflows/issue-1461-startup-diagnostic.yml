name: Issue 1461 startup comparison
on:
  push:
    branches: [fix/issue-1461-loop-goal-startup]
    paths: [.github/workflows/issue-1461-startup-diagnostic.yml]
permissions:
  contents: read
jobs:
  compare:
    name: Startup comparison (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - label: before-1458
            ref: c4cb37ec9b379272b8f1c14cd1c03b42b6691ce7
          - label: reported-merge
            ref: 0b740cff417767c7296c547b1bb8d93810b4ed14
          - label: candidate
            ref: head
    env:
      CGO_ENABLED: "1"
      GOMAXPROCS: "2"
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.ref == 'head' && github.sha || matrix.ref }}
      - uses: ./.github/actions/setup-go
        with:
          go-version: "1.27.3"
      - name: Repeat the unchanged managed cancellation scenario
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD | tee startup-comparison.log
          env -u COMPOZY_INTERNAL_RESTART_OPERATION_ID go test -tags=integration ./internal/daemon \
            -run '^TestLoopGoalManagedRuntimeIntegration$/^Should_converge_Cancel_after_session_materialization_and_before_binding_activation$' \
            -count=30 -timeout=5m -v 2>&1 | tee -a startup-comparison.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: issue-1461-${{ matrix.label }}
          path: startup-comparison.log
          retention-days: 7
