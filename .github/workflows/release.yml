name: Release

on:
  push:
    branches:
      - main

  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main
      - "release/v*"

  workflow_dispatch:
    inputs:
      release_ref:
        description: Git ref or revision that must resolve to the checked-out HEAD
        required: true
        type: string
      release_version:
        description: Strict unprefixed SemVer, for example 0.3.0-beta.1
        required: true
        type: string
      release_channel:
        description: Publication policy
        required: true
        type: choice
        options:
          - beta
          - stable
          - legacy

# Merges of release PRs (head commit "release:"/"ci(release):") land in their
# own non-cancellable "-publish" group so a routine push to main can never
# cancel an in-flight auto-beta publication.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}${{ (github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'release:') || startsWith(github.event.head_commit.message, 'ci(release):'))) && '-publish' || '' }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'release:') || startsWith(github.event.head_commit.message, 'ci(release):'))) }}

env:
  CGO_ENABLED: 0
  GO_VERSION: "1.26.4"
  NODE_VERSION: "22"
  INITIAL_VERSION: "v0.0.2"
  PR_RELEASE_MODULE: github.com/compozy/releasepr@v0.0.25
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

permissions:
  contents: write
  packages: write
  pull-requests: write
  issues: write
  id-token: write
  attestations: write

jobs:
  # Job 1: Create or update Release PR
  release-pr:
    name: Create/Update Release PR
    if: |
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       !startsWith(github.event.head_commit.message, 'release:') &&
       !startsWith(github.event.head_commit.message, 'ci(release):') &&
       !startsWith(github.event.head_commit.message, 'Merge pull request') &&
       github.event.head_commit.author.name != 'github-actions[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          # Persist the PAT in git credentials so pr-release branch updates
          # push as the token owner, not github-actions[bot] — bot-triggered
          # PR runs sit in "action_required" and never gate the release PR.
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Prepare Go temporary directory
        env:
          GOTMPDIR: ${{ runner.temp }}/go-tmp
        run: mkdir -p "$GOTMPDIR"

      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: ./.github/actions/setup-bun
        with:
          install-playwright: "false"

      - uses: ./.github/actions/setup-git-cliff

      - name: Run PR Release Orchestrator
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          COMPOZY_WEB_ASSETS_TOKEN: ${{ secrets.COMPOZY_WEB_ASSETS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          INITIAL_VERSION: ${{ env.INITIAL_VERSION }}
          GOTMPDIR: ${{ runner.temp }}/go-tmp
        run: |
          go run "${{ env.PR_RELEASE_MODULE }}" pr-release --force --enable-rollback --ci-output

  # Job 2: GoReleaser dry-run on every Release PR.
  dry-run:
    name: Dry-Run Build Validation
    if: |
      github.event_name == 'pull_request' &&
      (startsWith(github.event.pull_request.title, 'ci(release): Release ') ||
       startsWith(github.event.pull_request.title, 'release: Release ') ||
       startsWith(github.base_ref, 'release/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Stage the workflow-version release tools outside the checkout. The
      # production job reuses this exact step, including for older release refs.
      - &load-release-workflow-tools
        name: Load release workflow tools
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          workflow_tools=(
            release-publication-state.sh
            release-preflight.sh
          )
          for workflow_tool in "${workflow_tools[@]}"; do
            target="${RUNNER_TEMP}/${workflow_tool}"
            gh api \
              -H "Accept: application/vnd.github.raw+json" \
              "repos/${GITHUB_REPOSITORY}/contents/scripts/${workflow_tool}?ref=${WORKFLOW_COMMIT}" \
              >"${target}"
            bash -n "${target}"
          done

      - name: Prepare Go temporary directory
        env:
          GOTMPDIR: ${{ runner.temp }}/go-tmp
        run: mkdir -p "$GOTMPDIR"

      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: ./.github/actions/setup-bun
        with:
          install-playwright: "false"

      - name: Verify explicit release plan contract
        run: scripts/release-plan-contract.sh "${{ env.PR_RELEASE_MODULE }}"

      - name: Verify npm publish authentication
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::error::NPM_TOKEN is required to publish @compozy/cli and @compozy/extension-sdk"
            exit 1
          fi
          npm whoami --registry=https://registry.npmjs.org

      - name: Validate TypeScript extension SDK package
        run: scripts/publish-extension-sdk.sh --dry-run 0.0.0-beta.0 beta

      - name: Setup Release Tools
        uses: ./.github/actions/setup-release
        with:
          goreleaser-distribution: goreleaser-pro
          goreleaser-version: v2.17.1
          setup-docker: false
          setup-docker-login: false
          setup-qemu: false

      - &run-release-preflight
        name: Run release preflight
        run: bash "${RUNNER_TEMP}/release-preflight.sh"

      - name: Run pr-release Dry-Run (goreleaser build validation)
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_PRERELEASE: "true"
          GITHUB_MAKE_LATEST: "false"
          NPM_TAG: beta
          HOMEBREW_SKIP_UPLOAD: "true"
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GOTMPDIR: ${{ runner.temp }}/go-tmp
        run: go run "${{ env.PR_RELEASE_MODULE }}" dry-run --ci-output

  # Job 3: Credentialed nightly E2E gate on a fresh runner.
  e2e-nightly:
    name: E2E Nightly Lane
    if: |
      github.event_name == 'pull_request' &&
      (startsWith(github.event.pull_request.title, 'ci(release): Release ') ||
       startsWith(github.event.pull_request.title, 'release: Release ') ||
       startsWith(github.base_ref, 'release/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare Go temporary directory
        env:
          GOTMPDIR: ${{ runner.temp }}/go-tmp
        run: mkdir -p "$GOTMPDIR"

      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          install-mage: "true"
          install-gotestsum: "true"

      - uses: ./.github/actions/setup-bun
        with:
          install-playwright: "true"

      - name: Run E2E nightly lane (credentialed)
        env:
          CI: "true"
          CGO_ENABLED: 0
          GOTMPDIR: ${{ runner.temp }}/go-tmp
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          DAYTONA_API_URL: ${{ secrets.DAYTONA_API_URL }}
          DAYTONA_ORGANIZATION_ID: ${{ secrets.DAYTONA_ORGANIZATION_ID }}
          DAYTONA_SNAPSHOT: ${{ secrets.DAYTONA_SNAPSHOT }}
          DAYTONA_IMAGE: ${{ secrets.DAYTONA_IMAGE }}
          DAYTONA_SSH_HOST: ${{ secrets.DAYTONA_SSH_HOST }}
        run: make test-e2e-nightly

      - name: Upload E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-nightly-artifacts
          path: |
            .tmp/playwright
            /tmp/compozy-e2e-*
          if-no-files-found: ignore
          retention-days: 14

  # Job 4: Full integration suite on a fresh runner.
  integration:
    name: Full Integration Suite
    if: |
      github.event_name == 'pull_request' &&
      (startsWith(github.event.pull_request.title, 'ci(release): Release ') ||
       startsWith(github.event.pull_request.title, 'release: Release ') ||
       startsWith(github.base_ref, 'release/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Prepare Go temporary directory
        env:
          GOTMPDIR: ${{ runner.temp }}/go-tmp
        run: mkdir -p "$GOTMPDIR"

      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          install-mage: "true"
          install-gotestsum: "true"

      - uses: ./.github/actions/setup-bun
        with:
          install-playwright: "false"

      - name: Run full integration suite
        env:
          CI: "true"
          CGO_ENABLED: 0
          GOTMPDIR: ${{ runner.temp }}/go-tmp
        run: make test-integration

      - name: Upload integration artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-artifacts
          path: |
            coverage.out
            test-results.xml
            /tmp/compozy-e2e-*
          if-no-files-found: ignore
          retention-days: 14

  # Job 5: Resolve the explicit release identity exactly once.
  release-plan:
    name: Explicit Release Plan
    # Auto-beta triggers ONLY on release PR merge subjects. Two real-world
    # shapes exist: the PR title ("release: Release vX.Y.Z") and the branch
    # commit subject GitHub uses for single-commit squashes ("release:
    # prepare release vX.Y.Z" — how v0.3.0 merged as 7cf16a49). Other
    # Other bot-generated subjects — e.g. the site changelog receipt the
    # release job pushes — must stay inert or publishing loops.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main' &&
       (startsWith(github.event.head_commit.message, 'release: Release ') ||
        startsWith(github.event.head_commit.message, 'release: prepare release ')) &&
       vars.RELEASE_AUTO_CHANNEL == 'beta')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_ref: ${{ steps.plan.outputs.release_ref }}
      release_commit: ${{ steps.plan.outputs.release_commit }}
      release_version: ${{ steps.plan.outputs.release_version }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
      release_previous_tag: ${{ steps.plan.outputs.release_previous_tag }}
      release_git_range: ${{ steps.plan.outputs.release_git_range }}
      release_initial: ${{ steps.plan.outputs.release_initial }}
      release_channel: ${{ steps.plan.outputs.release_channel }}
      github_prerelease: ${{ steps.plan.outputs.github_prerelease }}
      github_make_latest: ${{ steps.plan.outputs.github_make_latest }}
      npm_tag: ${{ steps.plan.outputs.npm_tag }}
      homebrew_skip_upload: ${{ steps.plan.outputs.homebrew_skip_upload }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve release identity
        id: identity
        env:
          RELEASE_REF_INPUT: ${{ inputs.release_ref }}
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
          RELEASE_CHANNEL_INPUT: ${{ inputs.release_channel }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            {
              echo "ref=${RELEASE_REF_INPUT}"
              echo "version=${RELEASE_VERSION_INPUT}"
              echo "channel=${RELEASE_CHANNEL_INPUT}"
            } >>"${GITHUB_OUTPUT}"
            exit 0
          fi
          # Auto-beta consumes the stable base committed by the release PR.
          # Existing prerelease tags select the next beta.N, and `pr-release
          # plan` below remains the identity authority for HEAD, tag absence,
          # channel policy, and version shape.
          base="$(node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("package.json", "utf8"));
            if (typeof manifest.version !== "string") {
              throw new Error("package.json version must be a string");
            }
            process.stdout.write(manifest.version);
          ')"
          if [[ ! "${base}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::release PR package version '${base}' is not plain SemVer; cannot derive the beta version"
            exit 1
          fi
          last=0
          for tag in $(git tag --list "v${base}-beta.*"); do
            n="${tag#v"${base}"-beta.}"
            if [[ "${n}" =~ ^[0-9]+$ ]] && (( n > last )); then
              last="${n}"
            fi
          done
          {
            echo "ref=${GITHUB_SHA}"
            echo "version=${base}-beta.$((last + 1))"
            echo "channel=beta"
          } >>"${GITHUB_OUTPUT}"

      - name: Plan explicit release
        id: plan
        env:
          RELEASE_REF_INPUT: ${{ steps.identity.outputs.ref }}
          RELEASE_VERSION_INPUT: ${{ steps.identity.outputs.version }}
          RELEASE_CHANNEL_INPUT: ${{ steps.identity.outputs.channel }}
          PR_RELEASE_LOG_LEVEL: error
        run: |
          set -euo pipefail
          plan_output="${RUNNER_TEMP}/release-plan-output"
          go run "${PR_RELEASE_MODULE}" plan \
            --ref "${RELEASE_REF_INPUT}" \
            --version "${RELEASE_VERSION_INPUT}" \
            --channel "${RELEASE_CHANNEL_INPUT}" \
            --format github >"${plan_output}"

          expected_keys=(
            release_ref release_commit release_version release_tag release_previous_tag
            release_git_range release_initial release_channel
            github_prerelease github_make_latest npm_tag homebrew_skip_upload
          )
          for key in "${expected_keys[@]}"; do
            if [[ "$(grep -c "^${key}=" "${plan_output}")" != "1" ]]; then
              echo "::error::Planner output must contain exactly one ${key} entry"
              exit 1
            fi
          done
          if [[ "$(wc -l <"${plan_output}" | tr -d ' ')" != "12" ]]; then
            echo "::error::Planner output must contain exactly twelve authoritative entries"
            exit 1
          fi
          cat "${plan_output}" >>"${GITHUB_OUTPUT}"

  # Job 6: Publish only from an explicit, validated plan.
  release:
    name: Production Release
    needs: release-plan
    if: needs.release-plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-plan.outputs.release_ref }}
          fetch-depth: 0
          fetch-tags: true
          # PAT so the site-changelog receipt push bypasses the main branch
          # PR-only rule; its bot author and non-release subject stay inert.
          token: ${{ secrets.RELEASE_TOKEN }}

      # A release may target an older ref whose recovery logic predates the
      # current workflow. Reuse the exact staging step defined by dry-run.
      - *load-release-workflow-tools

      - name: Prepare Go temporary directory
        env:
          GOTMPDIR: ${{ runner.temp }}/go-tmp
        run: mkdir -p "$GOTMPDIR"

      - name: Set up Go with caching
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: ./.github/actions/setup-node
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: ./.github/actions/setup-bun
        with:
          install-playwright: "false"

      - uses: ./.github/actions/setup-git-cliff

      - name: Resolve publication state
        id: publication
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_COMMIT: ${{ needs.release-plan.outputs.release_commit }}
          RELEASE_TAG: ${{ needs.release-plan.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.release_version }}
        run: bash "${RUNNER_TEMP}/release-publication-state.sh"

      - name: Setup Release Tools
        if: steps.publication.outputs.already_published != 'true'
        uses: ./.github/actions/setup-release
        with:
          goreleaser-distribution: goreleaser-pro
          goreleaser-version: v2.17.1
          setup-docker: false
          setup-docker-login: false
          setup-qemu: false
          cosign-version: "v2.2.4"

      - *run-release-preflight

      - name: Render canonical release body
        if: steps.publication.outputs.already_published != 'true'
        env:
          RELEASE_TAG: ${{ needs.release-plan.outputs.release_tag }}
          RELEASE_GIT_RANGE: ${{ needs.release-plan.outputs.release_git_range }}
          RELEASE_INITIAL: ${{ needs.release-plan.outputs.release_initial }}
          PR_RELEASE_LOG_LEVEL: error
        run: |
          set -euo pipefail
          release_body_args=(release-body --tag "${RELEASE_TAG}")
          case "${RELEASE_INITIAL}" in
            true)
              if [[ -n "${RELEASE_GIT_RANGE}" ]]; then
                echo "::error::Initial release plan cannot include a Git range"
                exit 1
              fi
              release_body_args+=(--initial)
              ;;
            false)
              if [[ -z "${RELEASE_GIT_RANGE}" ]]; then
                echo "::error::Non-initial release plan must include a Git range"
                exit 1
              fi
              release_body_args+=(--range "${RELEASE_GIT_RANGE}")
              ;;
            *)
              echo "::error::Release plan emitted invalid initial-release intent"
              exit 1
              ;;
          esac
          go run "${PR_RELEASE_MODULE}" "${release_body_args[@]}" >"${RUNNER_TEMP}/RELEASE_BODY.md"
          test -s "${RUNNER_TEMP}/RELEASE_BODY.md"
          head -1 "${RUNNER_TEMP}/RELEASE_BODY.md"

      - name: Validate extension SDK release assets
        if: steps.publication.outputs.already_published != 'true'
        run: |
          if ! grep -q '"name": "@compozy/extension-sdk"' sdk/typescript/package.json; then
            echo "::error::Missing @compozy/extension-sdk package metadata"
            exit 1
          fi
          if ! grep -q '"license": "MIT"' sdk/typescript/package.json; then
            echo "::error::@compozy/extension-sdk must ship under the MIT license"
            exit 1
          fi
          go run ./cmd/compozy-manifest-check --version "${{ needs.release-plan.outputs.release_version }}"
          scripts/publish-extension-sdk.sh --dry-run "${{ needs.release-plan.outputs.release_version }}" "${{ needs.release-plan.outputs.npm_tag }}"

      - name: Create and push annotated release tag
        env:
          RELEASE_COMMIT: ${{ needs.release-plan.outputs.release_commit }}
          RELEASE_TAG: ${{ needs.release-plan.outputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "${RELEASE_COMMIT}" ]]; then
            echo "::error::Authoritative release ref moved after planning"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ensure_annotated_tag() {
            local tag="$1"
            local existing_commit
            existing_commit="$(git rev-list -n 1 "${tag}" 2>/dev/null || true)"
            if [[ -z "${existing_commit}" ]]; then
              git tag -a "${tag}" -m "Release ${tag}"
              return
            fi
            if [[ "$(git cat-file -t "${tag}")" != "tag" ]]; then
              echo "::error::Release tag ${tag} is not annotated"
              exit 1
            fi
            if [[ "${existing_commit}" != "${RELEASE_COMMIT}" ]]; then
              echo "::error::Release tag ${tag} points to ${existing_commit}, want ${RELEASE_COMMIT}"
              exit 1
            fi
            echo "reusing annotated release tag ${tag} at ${RELEASE_COMMIT}"
          }
          sdk_go_tag="sdk/go/${RELEASE_TAG}"
          git check-ref-format "refs/tags/${sdk_go_tag}" >/dev/null
          ensure_annotated_tag "${RELEASE_TAG}"
          ensure_annotated_tag "${sdk_go_tag}"
          git push origin "refs/tags/${RELEASE_TAG}" "refs/tags/${sdk_go_tag}"

      - uses: goreleaser/goreleaser-action@v6
        if: steps.publication.outputs.already_published != 'true'
        with:
          distribution: goreleaser-pro
          version: v2.17.1
          args: >-
            release --clean
            --release-notes=${{ runner.temp }}/RELEASE_BODY.md
            --release-header-tmpl=.goreleaser.release-header.md.tmpl
            --release-footer-tmpl=.goreleaser.release-footer.md.tmpl
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          COSIGN_EXPERIMENTAL: 1
          GORELEASER_KEY: ${{ secrets.GORELEASER_KEY }}
          GOTMPDIR: ${{ runner.temp }}/go-tmp
          GORELEASER_CURRENT_TAG: ${{ needs.release-plan.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.release_version }}
          RELEASE_CHANNEL: ${{ needs.release-plan.outputs.release_channel }}
          GITHUB_MAKE_LATEST: ${{ needs.release-plan.outputs.github_make_latest }}
          NPM_TAG: ${{ needs.release-plan.outputs.npm_tag }}
          HOMEBREW_SKIP_UPLOAD: ${{ needs.release-plan.outputs.homebrew_skip_upload }}

      - name: Publish TypeScript extension SDK
        env:
          RELEASE_VERSION: ${{ needs.release-plan.outputs.release_version }}
          NPM_TAG: ${{ needs.release-plan.outputs.npm_tag }}
        run: scripts/publish-extension-sdk.sh "${RELEASE_VERSION}" "${NPM_TAG}"

      - name: Checkout canonical formula renderer
        if: needs.release-plan.outputs.homebrew_skip_upload == 'false'
        uses: actions/checkout@v4
        with:
          ref: main
          path: .release-tools
          sparse-checkout: scripts/render-homebrew-formula.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Checkout Homebrew tap
        if: needs.release-plan.outputs.homebrew_skip_upload == 'false'
        uses: actions/checkout@v4
        with:
          repository: compozy/homebrew-compozy
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}
          path: .release-homebrew

      - name: Publish Homebrew formula
        if: needs.release-plan.outputs.homebrew_skip_upload == 'false'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.release-plan.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.release_version }}
        run: |
          set -euo pipefail
          checksum_dir="${RUNNER_TEMP}/homebrew-release"
          mkdir -p "${checksum_dir}"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern checksums.txt \
            --dir "${checksum_dir}"
          .release-tools/scripts/render-homebrew-formula.sh \
            --release-repo "${GITHUB_REPOSITORY}" \
            --release-version "${RELEASE_VERSION}" \
            --release-tag "${RELEASE_TAG}" \
            --checksums "${checksum_dir}/checksums.txt" \
            --output .release-homebrew/Formula/compozy.rb

          git -C .release-homebrew config user.name "github-actions[bot]"
          git -C .release-homebrew config user.email "github-actions[bot]@users.noreply.github.com"
          git -C .release-homebrew add Formula/compozy.rb
          if git -C .release-homebrew diff --cached --quiet; then
            echo "Homebrew formula already matches ${RELEASE_TAG}"
            exit 0
          fi
          git -C .release-homebrew commit -m "compozy ${RELEASE_TAG}"
          git -C .release-homebrew push origin HEAD:main

      - name: Apply published GitHub channel policy
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PUBLICATION_RELEASE_ID: ${{ steps.publication.outputs.release_id }}
          RELEASE_TAG: ${{ needs.release-plan.outputs.release_tag }}
          GITHUB_PRERELEASE: ${{ needs.release-plan.outputs.github_prerelease }}
          GITHUB_MAKE_LATEST: ${{ needs.release-plan.outputs.github_make_latest }}
        run: |
          set -euo pipefail
          release_id="${PUBLICATION_RELEASE_ID}"
          if [[ -z "${release_id}" ]]; then
            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id')"
          fi
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false \
            -F prerelease="${GITHUB_PRERELEASE}" \
            -f make_latest="${GITHUB_MAKE_LATEST}" >/dev/null

      - name: Verify published channel policy
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PUBLICATION_RELEASE_ID: ${{ steps.publication.outputs.release_id }}
          RELEASE_COMMIT: ${{ needs.release-plan.outputs.release_commit }}
          RELEASE_TAG: ${{ needs.release-plan.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.release_version }}
          RELEASE_CHANNEL: ${{ needs.release-plan.outputs.release_channel }}
          GITHUB_PRERELEASE: ${{ needs.release-plan.outputs.github_prerelease }}
          GITHUB_MAKE_LATEST: ${{ needs.release-plan.outputs.github_make_latest }}
          NPM_TAG: ${{ needs.release-plan.outputs.npm_tag }}
        run: |
          set -euo pipefail
          echo "Verifying ${RELEASE_CHANNEL} policy for ${RELEASE_TAG}"
          release_id="${PUBLICATION_RELEASE_ID}"
          if [[ -z "${release_id}" ]]; then
            release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id')"
          fi
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
          if [[ "$(jq -r '.draft' <<<"${release_json}")" != "false" ]]; then
            echo "::error::GitHub Release is still a draft"
            exit 1
          fi
          if [[ "$(jq -r '.tag_name' <<<"${release_json}")" != "${RELEASE_TAG}" ]]; then
            echo "::error::GitHub Release tag does not match the authoritative release plan"
            exit 1
          fi
          if [[ "$(jq -r '.target_commitish' <<<"${release_json}")" != "${RELEASE_COMMIT}" ]]; then
            echo "::error::GitHub Release target does not match the authoritative release plan"
            exit 1
          fi
          release_prerelease="$(jq -r '.prerelease' <<<"${release_json}")"
          if [[ "${release_prerelease}" != "${GITHUB_PRERELEASE}" ]]; then
            echo "::error::GitHub prerelease state does not match the authoritative release plan"
            exit 1
          fi
          public_release_id="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.id')"
          if [[ "${public_release_id}" != "${release_id}" ]]; then
            echo "::error::Public GitHub Release identity does not match the validated release"
            exit 1
          fi

          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ "${GITHUB_MAKE_LATEST}" == "true" && "${latest_tag}" != "${RELEASE_TAG}" ]]; then
            echo "::error::GitHub latest release does not match the authoritative release plan"
            exit 1
          fi
          if [[ "${GITHUB_MAKE_LATEST}" == "false" && "${latest_tag}" == "${RELEASE_TAG}" ]]; then
            echo "::error::Prerelease unexpectedly became the latest GitHub release"
            exit 1
          fi

          for package_name in @compozy/cli @compozy/extension-sdk; do
            dist_tags="$(npm view "${package_name}" dist-tags --json --registry=https://registry.npmjs.org)"
            PACKAGE_NAME="${package_name}" DIST_TAGS_JSON="${dist_tags}" node <<'NODE'
          const tags = JSON.parse(process.env.DIST_TAGS_JSON || "{}");
          const expectedTag = process.env.NPM_TAG;
          const version = process.env.RELEASE_VERSION;
          if (tags[expectedTag] !== version) {
            throw new Error(`${process.env.PACKAGE_NAME} ${expectedTag} points to ${tags[expectedTag]}, want ${version}`);
          }
          if (expectedTag === "beta" && tags.latest === version) {
            throw new Error(`${process.env.PACKAGE_NAME} latest moved during a beta release`);
          }
          NODE
          done

      # The receipt is generated from the REAL published tag (never the release
      # PR's base version) so the site changelog only ever advertises releases
      # that exist, with valid compare links. Legacy-line releases publish no
      # receipt on the CompozyOS site.
      - name: Publish site changelog receipt
        if: needs.release-plan.outputs.release_channel != 'legacy'
        env:
          RELEASE_TAG: ${{ needs.release-plan.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.release-plan.outputs.release_version }}
          PR_RELEASE_PREVIOUS_TAG: ${{ needs.release-plan.outputs.release_previous_tag }}
          PR_RELEASE_GIT_RANGE: ${{ needs.release-plan.outputs.release_git_range }}
          PR_RELEASE_INITIAL: ${{ needs.release-plan.outputs.release_initial }}
        run: |
          set -euo pipefail
          export PR_RELEASE_VERSION="${RELEASE_VERSION}"
          bun run release:site-changelog
          git add packages/site/content/blog/changelog
          if git diff --cached --quiet; then
            echo "site changelog receipt already present for ${RELEASE_TAG}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "build: publish site changelog receipt ${RELEASE_TAG}"
          for _ in 1 2 3; do
            if git push origin "HEAD:refs/heads/main"; then
              exit 0
            fi
            git fetch origin main
            git rebase FETCH_HEAD
          done
          echo "::error::could not push the site changelog receipt for ${RELEASE_TAG}"
          exit 1
