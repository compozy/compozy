name: SQLite contention acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/sqlite-contention.yml"
      - "scripts/sqlite-contention/**"
      - "internal/store/**"
      - "internal/session/**"
      - "internal/sessionprocess/**"
      - "internal/profile/**"
      - "internal/observe/**"
      - "internal/daemon/**"
      - "internal/testutil/e2e/runtime_harness_contention_test.go"
      - "docs/qa/reports/2026-11-03-sqlite-contention.md"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sqlite-contention-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: 0
  GOMAXPROCS: 2
  BASELINE_SHA: d35c63c9a9f70806583d8595f0279f78c5dff84f

jobs:
  paired-load:
    name: SQLite paired load and 1 GB upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Verify acceptance decisions
        run: python3 -m unittest discover -s scripts/sqlite-contention -p '*_test.py' -v
      - name: Install syscall tracer
        run: |
          apt_sources=(-o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${apt_sources[@]}" update
          sudo apt-get "${apt_sources[@]}" install --yes strace
      - name: Check out the fixed baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: baseline
          persist-credentials: false
      - name: Build identical workload against both implementations
        run: |
          mkdir -p baseline/scripts/sqlite-contention
          cp scripts/sqlite-contention/*.go baseline/scripts/sqlite-contention/
          go build -p 2 -o "$RUNNER_TEMP/contention-head" ./scripts/sqlite-contention
          cd baseline
          go build -p 2 -o "$RUNNER_TEMP/contention-baseline" ./scripts/sqlite-contention
      - name: Measure on the same runner, sequentially
        env:
          EXPERIMENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 scripts/sqlite-contention/run.py \
            --baseline "$RUNNER_TEMP/contention-baseline" \
            --head "$RUNNER_TEMP/contention-head" \
            --baseline-sha "$BASELINE_SHA" --head-sha "$EXPERIMENT_HEAD" \
            --output "$RUNNER_TEMP/sqlite-contention"
      - name: Publish experiment summary
        if: always()
        run: |
          report="$RUNNER_TEMP/sqlite-contention/report.md"
          if test -f "$report"; then
            # Keep the full artifact; reserve room below GitHub's 1 MiB summary limit.
            head -c 900000 "$report" >> "$GITHUB_STEP_SUMMARY"
            if test "$(wc -c < "$report")" -gt 900000; then
              printf '\n\nSummary truncated. Download the SQLite contention artifact for the complete report.md and warning decisions.\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sqlite-contention-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/sqlite-contention/*.json
            ${{ runner.temp }}/sqlite-contention/*.log
            ${{ runner.temp }}/sqlite-contention/*.md
            ${{ runner.temp }}/sqlite-contention/*.strace
            ${{ runner.temp }}/sqlite-contention/*.trace
          retention-days: 14
          if-no-files-found: error

  daemon-load:
    name: SQLite real daemon thirty-session exercise
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Build daemon and scripted ACP transport
        run: |
          mkdir -p "$RUNNER_TEMP/sqlite-bin"
          go build -p 2 -o "$RUNNER_TEMP/sqlite-bin/compozy" ./cmd/compozy
          go build -p 2 -o "$RUNNER_TEMP/sqlite-bin/acpmock-driver" ./internal/testutil/acpmock/cmd/acpmock-driver
      - name: Exercise the isolated public surfaces and clean restart
        run: |
          python3 scripts/sqlite-contention/qa.py \
            --binary "$RUNNER_TEMP/sqlite-bin/compozy" \
            --driver "$RUNNER_TEMP/sqlite-bin/acpmock-driver" \
            --output "$RUNNER_TEMP/sqlite-daemon-qa"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sqlite-daemon-qa-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/sqlite-daemon-qa/*.json
            ${{ runner.temp }}/sqlite-daemon-qa/*.log
            ${{ runner.temp }}/sqlite-daemon-qa/manifest-path.txt
            ${{ runner.temp }}/sqlite-daemon-qa/labs/**/qa-artifacts/**
          retention-days: 14
          if-no-files-found: error
