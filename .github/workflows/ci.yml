name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: 0
  GO_VERSION: "1.26.4"
  # Turborepo remote cache (Vercel): jobs exchange the GitHub OIDC token for a
  # short-lived Turborepo token (revoked at job end). Pull requests read the
  # shared cache; push and workflow_dispatch lanes upload. Fork PRs skip the
  # exchange and stay local-only.
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  TURBO_CACHE: ${{ github.event_name == 'pull_request' && 'local:rw,remote:r' || 'local:rw,remote:rw' }}

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            docs
            test
            build
            ci
          requireScope: false
          disallowScopes: |
            .*
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.
            Title format: <type>: <description> — e.g. "fix: drop stale session sockets on daemon restart"

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      relevant: ${{ steps.filter.outputs.backend == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.desktop == 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Filter paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          backend=false
          web=false
          desktop=false
          zero_sha='0000000000000000000000000000000000000000'

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            backend=true
            web=true
            desktop=true
          else
            if [[ "$EVENT_NAME" == "pull_request" && -n "$PR_BASE_SHA" && -n "$PR_HEAD_SHA" ]]; then
              changed_files=$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA")
            elif [[ -n "${PUSH_BEFORE_SHA:-}" && "$PUSH_BEFORE_SHA" != "$zero_sha" ]]; then
              if git cat-file -e "${PUSH_BEFORE_SHA}^{commit}" 2>/dev/null; then
                changed_files=$(git diff --name-only "$PUSH_BEFORE_SHA" "$CURRENT_SHA")
              else
                echo "Base push SHA $PUSH_BEFORE_SHA is unavailable; treating current tree as changed."
                changed_files=$(git ls-tree -r --name-only "$CURRENT_SHA")
              fi
            else
              changed_files=$(git ls-tree -r --name-only "$CURRENT_SHA")
            fi

            while IFS= read -r file; do
              [[ -z "$file" ]] && continue

              case "$file" in
                *.go|go.mod|go.sum|Makefile|.golangci.yml|.goreleaser.yml|.pr-release|cliff.toml|RELEASE_BODY.md|RELEASE_NOTES.md)
                  backend=true
                  ;;
              esac

              case "$file" in
                .agents/*|.github/*|.release-notes/*|cmd/*|extensions/*|internal/*|magefiles/*|openapi/*|skills/*|CLAUDE.md|AGENTS.md|config.toml)
                  backend=true
                  ;;
              esac

              case "$file" in
                .bun-version|.oxfmtrc.json|.oxlintrc.json|bun.lock|package.json|tsconfig.json|tsconfig.base.json|turbo.json|vitest.config.ts)
                  web=true
                  ;;
              esac

              case "$file" in
                web/*|packages/*|scripts/*|sdk/*)
                  web=true
                  ;;
              esac

              case "$file" in
                desktop/*|Makefile|.github/workflows/ci.yml)
                  desktop=true
                  ;;
              esac
            done <<< "$changed_files"
          fi

          relevant=false
          if [[ "$backend" == "true" || "$web" == "true" || "$desktop" == "true" ]]; then
            relevant=true
          fi

          {
            echo "backend=$backend"
            echo "web=$web"
            echo "desktop=$desktop"
            echo "relevant=$relevant"
          } >> "$GITHUB_OUTPUT"

  preflight:
    name: Preflight (codegen, installer, product language)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          rg --version

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          verify-modules: "true"
          save-build-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install-playwright: "false"

      - name: Restore Daytona sidecar proof
        uses: actions/cache@v6
        with:
          path: ~/.cache/compozy-dev/daytona-check.stamp
          key: ${{ runner.os }}-daytona-proof-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-daytona-proof-

      - name: Verify generated artifacts
        run: make codegen-check

      - name: Verify installer artifacts
        run: make installer-check

      - name: Verify product language
        run: make product-language-check

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go for scaffold tests
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install-playwright: "false"

      - name: Restore Turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Set up Turborepo remote cache (OIDC)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Run frontend verification
        env:
          COMPOZY_CODEGEN_CHECKED: "1"
        run: |
          bun run lint
          bunx turbo run typecheck test --filter='!@compozy/desktop'
          bunx turbo run build --filter=./web

      - name: Upload frontend artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-verify-artifacts
          path: web/dist
          if-no-files-found: ignore
          retention-days: 7

      - name: Save Turbo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-${{ github.run_id }}

  go-static:
    name: Go (format, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          install-golangci-lint: "true"
          save-build-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Restore golangci-lint cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/compozy-dev/golangci-lint
          key: ${{ runner.os }}-golangci-v2.13.1-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-golangci-v2.13.1-${{ hashFiles('go.sum', '.golangci.yml') }}-
            ${{ runner.os }}-golangci-v2.13.1-

      - name: Run Go static verification
        run: |
          make fmt-check
          make source-size
          make go-lint

      - name: Save golangci-lint cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/compozy-dev/golangci-lint
          key: ${{ runner.os }}-golangci-v2.13.1-${{ hashFiles('go.sum', '.golangci.yml') }}-${{ github.run_id }}

  go-test:
    name: Go (race test shard ${{ matrix.shard_label }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: "0"
            shard_label: "1/8"
          - shard_index: "1"
            shard_label: "2/8"
          - shard_index: "2"
            shard_label: "3/8"
          - shard_index: "3"
            shard_label: "4/8"
          - shard_index: "4"
            shard_label: "5/8"
          - shard_index: "5"
            shard_label: "6/8"
          - shard_index: "6"
            shard_label: "7/8"
          - shard_index: "7"
            shard_label: "8/8"
    env:
      COMPOZY_GO_TEST_P: "1"
      COMPOZY_GO_TEST_SHARD_INDEX: ${{ matrix.shard_index }}
      COMPOZY_GO_TEST_SHARD_TOTAL: "8"
      COMPOZY_GO_TEST_JSONFILE_DIR: /tmp/gotest-json
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          install-gotestsum: "true"
          cache-key-suffix: -${{ matrix.shard_index }}
          save-build-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Set up Bun for codegen contract tests
        uses: ./.github/actions/setup-bun
        with:
          install-playwright: "false"

      - name: Run Go runtime verification
        run: make test

      - name: Upload gotestsum timing data
        uses: actions/upload-artifact@v7
        with:
          name: gotest-json-shard-${{ matrix.shard_index }}
          path: /tmp/gotest-json
          if-no-files-found: error
          retention-days: 7

  sdk-go-test:
    name: Go SDK (race test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Go SDK verification once
        run: go -C sdk/go test -race -parallel=4 ./...
        env:
          CGO_ENABLED: 1

  go-build:
    name: Go (build, boundaries)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          save-build-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Run Go build and boundary verification
        run: |
          make build-go
          make boundaries

  go-peer-darwin:
    name: Go (Darwin peer identity without CGO)
    runs-on: macos-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          save-build-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Verify Darwin hosted MCP peer identity
        run: go test ./internal/mcp -run '^TestPeerInfoFromUnixConnIdentifiesLocalPeer$' -count=1
        env:
          CGO_ENABLED: 0

  go-terminal-windows:
    name: Go (Windows terminal runtime)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: [changes, preflight]
    if: needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify Windows terminal runtime
        run: >-
          go test ./internal/procutil ./internal/terminal/pty ./internal/terminal
          -run '^(TestWindowsProcessHandleTermination|TestWindowsPTYHardening|TestWindowsPipeRuntime|TestWindowsDefaultShellResolution|TestResolveCapabilities)$'
          -count=1
        env:
          CGO_ENABLED: 0

  desktop:
    name: Desktop (format, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          save-build-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install-playwright: "false"

      - name: Restore Turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Set up Turborepo remote cache (OIDC)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Run desktop verification
        run: |
          make desktop-lint
          make desktop-test
          make desktop-build

      - name: Save Turbo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-${{ github.run_id }}

  verify:
    name: Verify (fmt, lint, unit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        changes,
        preflight,
        frontend,
        go-static,
        go-test,
        sdk-go-test,
        go-build,
        go-peer-darwin,
        go-terminal-windows,
        desktop,
      ]
    if: always() && needs.changes.outputs.relevant == 'true'
    steps:
      - name: Require every verification lane
        env:
          PREFLIGHT_RESULT: ${{ needs.preflight.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          GO_STATIC_RESULT: ${{ needs.go-static.result }}
          GO_TEST_RESULT: ${{ needs.go-test.result }}
          SDK_GO_TEST_RESULT: ${{ needs.sdk-go-test.result }}
          GO_BUILD_RESULT: ${{ needs.go-build.result }}
          GO_PEER_DARWIN_RESULT: ${{ needs.go-peer-darwin.result }}
          GO_TERMINAL_WINDOWS_RESULT: ${{ needs.go-terminal-windows.result }}
          DESKTOP_RESULT: ${{ needs.desktop.result }}
        run: |
          set -euo pipefail
          for result in "$PREFLIGHT_RESULT" "$FRONTEND_RESULT" "$GO_STATIC_RESULT" "$GO_TEST_RESULT" "$SDK_GO_TEST_RESULT" "$GO_BUILD_RESULT" "$GO_PEER_DARWIN_RESULT" "$GO_TERMINAL_WINDOWS_RESULT" "$DESKTOP_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "Verification lane finished with result: $result"
              exit 1
            fi
          done

  e2e-runtime:
    name: E2E runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          install-gotestsum: "true"

      - name: Set up Bun (runtime build dependencies)
        uses: ./.github/actions/setup-bun
        with:
          install-playwright: "false"

      - name: Restore Turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Set up Turborepo remote cache (OIDC)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Run runtime E2E lane
        run: make test-e2e-runtime
        env:
          CGO_ENABLED: 0
          CI: "true"

      - name: Upload runtime E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-runtime-artifacts
          path: /tmp/compozy-e2e-*
          if-no-files-found: ignore
          retention-days: 7

  e2e-web:
    name: E2E web (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up Bun (web deps + Playwright)
        uses: ./.github/actions/setup-bun
        with:
          install-playwright: "true"

      - name: Restore Turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Set up Turborepo remote cache (OIDC)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Run web E2E lane shard
        run: make test-e2e-web
        env:
          CGO_ENABLED: 0
          CI: "true"
          COMPOZY_E2E_WEB_SHARD: ${{ matrix.shard }}/4

      - name: Upload web E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-web-artifacts-shard-${{ matrix.shard }}
          path: |
            .tmp/playwright
            /tmp/compozy-e2e-*
          if-no-files-found: ignore
          retention-days: 7

  e2e-desktop:
    name: E2E desktop
    runs-on: ubuntu-latest
    timeout-minutes: 75
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Preserve Go caches across isolated desktop homes
        run: |
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_ENV"

      - name: Set up Bun (desktop deps + Playwright)
        uses: ./.github/actions/setup-bun
        with:
          install-playwright: "true"

      - name: Allow the Chromium user namespace sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes openbox

      - name: Restore Turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Set up Turborepo remote cache (OIDC)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Run desktop E2E lane
        run: make test-e2e-desktop
        env:
          CGO_ENABLED: 0
          CI: "true"

      - name: Upload desktop E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-desktop-artifacts
          path: |
            .tmp/playwright
            /tmp/compozy-e2e-*
          if-no-files-found: ignore
          retention-days: 7

  e2e-combined:
    name: E2E (combined lane)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, e2e-runtime, e2e-web, e2e-desktop]
    if: always() && needs.changes.outputs.relevant == 'true'
    steps:
      - name: Require every E2E lane
        env:
          RUNTIME_RESULT: ${{ needs.e2e-runtime.result }}
          WEB_RESULT: ${{ needs.e2e-web.result }}
          DESKTOP_RESULT: ${{ needs.e2e-desktop.result }}
        run: |
          set -euo pipefail
          for result in "$RUNTIME_RESULT" "$WEB_RESULT" "$DESKTOP_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "E2E lane finished with result: $result"
              exit 1
            fi
          done
