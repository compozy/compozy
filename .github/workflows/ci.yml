name: CI

# Lanes:
# - Fast lane (preflight, lint, typecheck, unit, build) gates every pull request
#   through `Verify (fmt, lint, unit, build)`, limited to the changed areas.
# - Heavy lane (Go integration contracts, Windows, runtime/web/desktop E2E) gates
#   through `E2E (combined lane)`. With the repository variable CI_MERGE_QUEUE
#   set to `true`, pull requests defer it to the merge queue (`merge_group`)
#   unless they carry the `ci:full` label or change the CI pipeline itself.
# - The nightly schedule runs every lane on main.
on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  # Pull requests keep only their newest run; every main, merge-queue and
  # scheduled commit finishes, so main stays verified and seeds the caches.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CGO_ENABLED: 0
  GO_VERSION: "1.27.3"
  # Turborepo remote cache (Vercel): jobs exchange the GitHub OIDC token for a
  # short-lived Turborepo token (revoked at job end). Pull requests read the
  # shared cache; push and workflow_dispatch lanes upload. Fork PRs skip the
  # exchange and stay local-only.
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  TURBO_CACHE: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'local:rw,remote:r' || 'local:rw,remote:rw' }}
  # Only main saves GitHub caches; pull requests and merge groups restore them.
  SAVE_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            docs
            test
            build
            ci
          requireScope: false
          disallowScopes: |
            .*
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.
            Title format: <type>: <description> — e.g. "fix: drop stale session sockets on daemon restart"

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify change classification
        run: scripts/ci-changes.sh --self-test

      - name: Filter paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_QUEUE: ${{ vars.CI_MERGE_QUEUE == 'true' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          zero_sha='0000000000000000000000000000000000000000'
          base_sha=""
          head_sha=""
          case "$EVENT_NAME" in
            pull_request) base_sha="$PR_BASE_SHA"; head_sha="$PR_HEAD_SHA" ;;
            merge_group) base_sha="$GROUP_BASE_SHA"; head_sha="$GROUP_HEAD_SHA" ;;
            push) base_sha="$PUSH_BEFORE_SHA"; head_sha="$CURRENT_SHA" ;;
          esac

          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            areas=$'backend=true\nweb=true\ndesktop=true\nci_infra=false'
          elif [[ -n "$base_sha" && "$base_sha" != "$zero_sha" && -n "$head_sha" ]] &&
            git fetch --no-tags --depth=1 origin "$base_sha" "$head_sha"; then
            areas=$(git diff --name-only "$base_sha" "$head_sha" | scripts/ci-changes.sh)
          else
            echo "Base commit $base_sha is unavailable; treating every area as changed."
            areas=$'backend=true\nweb=true\ndesktop=true\nci_infra=false'
          fi

          # The heavy lane runs everywhere except pull requests in merge-queue
          # mode, where the merge group runs it once before main. A pull request
          # opts back in with the `ci:full` label (read live, so a re-run sees a
          # label added after the push) or by changing the CI pipeline itself.
          heavy=true
          if [[ "$MERGE_QUEUE" == "true" ]]; then
            case "$EVENT_NAME" in
              pull_request)
                heavy=false
                if grep -qx 'ci_infra=true' <<<"$areas"; then
                  heavy=true
                elif gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name' | grep -qx 'ci:full'; then
                  heavy=true
                fi
                ;;
              push) heavy=false ;;
            esac
          fi

          {
            grep -E '^(backend|web|desktop)=' <<<"$areas"
            echo "heavy=$heavy"
          } | tee -a "$GITHUB_OUTPUT"

  preflight:
    name: Preflight (codegen, installer, product language)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    steps:
      - uses: actions/checkout@v7

      - name: Install ripgrep
        run: |
          # Only Ubuntu supplies this dependency; unrelated runner repositories
          # must not block preflight when their indexes are inconsistent.
          test -f /etc/apt/sources.list.d/ubuntu.sources
          apt_sources=(-o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${apt_sources[@]}" update
          sudo apt-get "${apt_sources[@]}" install --yes ripgrep
          rg --version

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          verify-modules: "true"
          save-cache: ${{ env.SAVE_CACHE }}

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install-playwright: "false"

      - name: Verify generated artifacts
        run: make codegen-check

      - name: Verify installer artifacts
        run: make installer-check

      - name: Verify product language
        run: make product-language-check

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go for scaffold tests
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          build-cache: "false"

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install-playwright: "false"

      - name: Restore Turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Set up Turborepo remote cache (OIDC)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Run frontend verification
        env:
          COMPOZY_CODEGEN_CHECKED: "1"
        run: |
          bun run lint
          bunx turbo run typecheck test --filter='!@compozy/desktop' --log-order=stream
          bunx turbo run build --filter=./web
          bunx turbo run test:package --filter=@compozy/client

      - name: Verify app SDK documentation and package preparation
        run: |
          bunx turbo run build --filter=@compozy/site
          scripts/publish-sdk-package.sh --dry-run sdk/typescript 0.0.0-beta.0 beta
          scripts/publish-sdk-package.sh --dry-run sdk/client 0.0.0-beta.0 beta

      - name: Verify bounded transcript retention
        run: >-
          bun scripts/bench-session-retention.mjs
          web/src/systems/session/lib/session-thread-repository.ts 4000 1 16777216

      - name: Upload frontend artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-verify-artifacts
          path: web/dist
          if-no-files-found: ignore
          retention-days: 7

      - name: Save Turbo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-${{ github.run_id }}

  go-static:
    name: Go (format, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          install-golangci-lint: "true"
          save-cache: ${{ env.SAVE_CACHE }}

      - name: Restore golangci-lint cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/compozy-dev/golangci-lint
          key: ${{ runner.os }}-golangci-v2.15.0-${{ hashFiles('**/go.sum', '**/go.mod', '.golangci.yml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-golangci-v2.15.0-${{ hashFiles('**/go.sum', '**/go.mod', '.golangci.yml') }}-
            ${{ runner.os }}-golangci-v2.15.0-

      - name: Run Go static verification
        run: |
          make fmt-check
          make source-size
          make go-lint

      - name: Save golangci-lint cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/compozy-dev/golangci-lint
          key: ${{ runner.os }}-golangci-v2.15.0-${{ hashFiles('**/go.sum', '**/go.mod', '.golangci.yml') }}-${{ github.run_id }}

  go-test:
    name: Go (race test shard ${{ matrix.shard_label }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: "0"
            shard_label: "1/8"
          - shard_index: "1"
            shard_label: "2/8"
          - shard_index: "2"
            shard_label: "3/8"
          - shard_index: "3"
            shard_label: "4/8"
          - shard_index: "4"
            shard_label: "5/8"
          - shard_index: "5"
            shard_label: "6/8"
          - shard_index: "6"
            shard_label: "7/8"
          - shard_index: "7"
            shard_label: "8/8"
    env:
      COMPOZY_GO_TEST_P: "1"
      COMPOZY_GO_TEST_SHARD_INDEX: ${{ matrix.shard_index }}
      COMPOZY_GO_TEST_SHARD_TOTAL: "8"
      COMPOZY_GO_TEST_JSONFILE_DIR: /tmp/gotest-json
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          install-gotestsum: "true"
          cache-key-suffix: -${{ matrix.shard_index }}
          save-cache: ${{ env.SAVE_CACHE }}

      - name: Build ACP mock fixture driver
        timeout-minutes: 5
        env:
          CGO_ENABLED: "1"
          COMPOZY_TEST_ACPMOCK_DRIVER_BIN: ${{ runner.temp }}/acpmock-driver
        run: |
          go build -o "$COMPOZY_TEST_ACPMOCK_DRIVER_BIN" ./internal/testutil/acpmock/cmd/acpmock-driver
          printf 'COMPOZY_TEST_ACPMOCK_DRIVER_BIN=%s\n' "$COMPOZY_TEST_ACPMOCK_DRIVER_BIN" >> "$GITHUB_ENV"

      - name: Set up Bun for codegen contract tests
        uses: ./.github/actions/setup-bun
        with:
          install-playwright: "false"

      - &install-terminal-scenario-shell
        name: Install zsh for terminal contracts
        run: |
          test -f /etc/apt/sources.list.d/ubuntu.sources
          apt_sources=(-o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${apt_sources[@]}" update
          sudo apt-get "${apt_sources[@]}" install --no-install-recommends --yes zsh
          # Runner-provided completion directories can be group/world writable.
          # Repair their permissions so global compinit can pass its security audit.
          mapfile -t insecure_paths < <(zsh -fc 'autoload -Uz compaudit; compaudit' 2>/dev/null)
          if (( ${#insecure_paths[@]} > 0 )); then
            sudo chmod go-w -- "${insecure_paths[@]}"
          fi
          zsh -fc 'autoload -Uz compaudit; compaudit'
          zsh --version

      - name: Run Go runtime verification
        run: make test

      - name: Upload gotestsum timing data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gotest-json-shard-${{ matrix.shard_index }}
          path: /tmp/gotest-json
          if-no-files-found: error
          retention-days: 7

  go-integration:
    # Fixed integration contracts run beside the duration-balanced unit shards
    # instead of stretching the shards they used to ride on.
    name: Go integration contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          save-cache: ${{ env.SAVE_CACHE }}

      - name: Build ACP mock fixture driver
        timeout-minutes: 5
        env:
          CGO_ENABLED: "1"
          COMPOZY_TEST_ACPMOCK_DRIVER_BIN: ${{ runner.temp }}/acpmock-driver
        run: |
          go build -o "$COMPOZY_TEST_ACPMOCK_DRIVER_BIN" ./internal/testutil/acpmock/cmd/acpmock-driver
          printf 'COMPOZY_TEST_ACPMOCK_DRIVER_BIN=%s\n' "$COMPOZY_TEST_ACPMOCK_DRIVER_BIN" >> "$GITHUB_ENV"

      - *install-terminal-scenario-shell

      - name: Verify zsh startup contracts
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout=2m -v ./internal/terminal/pty -run '^TestShellIntegrationContract$'

      - name: Verify background role configuration through CLI HTTP and UDS
        env:
          CGO_ENABLED: "1"
        run: |
          python3 .agents/skills/eng/eng-test-conventions/scripts/check-test-conventions.py internal/daemon/role_status_test.go
          python3 .agents/skills/eng/eng-test-conventions/scripts/check-test-conventions.py internal/daemon/role_resolver_integration_test.go
          go test -race -tags=integration -count=1 -timeout=5m -v ./internal/daemon -run '^TestRoleResolverIntegration$'

      - name: Verify overlay catalog with ACP subprocesses and SQLite
        env:
          CGO_ENABLED: "1"
        run: go test -race -tags=integration -count=1 -timeout=5m ./internal/modelcatalog

      - name: Verify Marketplace publication and acquisition with real SQLite
        env:
          CGO_ENABLED: "1"
        run: >-
          go test -race -tags=integration -count=1 -timeout=5m
          ./internal/daemon ./internal/extension
          -run '^(TestHookBindingResourceReconcileFiresToolHookThroughSessionNotifier|TestAgentSkillPublicationAndBootRebuild|TestToolMCPStaticPublicationAndBootRebuild|TestPluginCatalogInstallability|TestClientPluginManagedInstall|TestPluginMarketplaceAcquisitionLifecycle|TestManagedAgentPluginDataLifecycle|TestManagerDevelopmentLifecycle|TestVerifyDevGeneration)$'

      - name: Verify Goal cancellation and stopped-session deletion with real SQLite
        env:
          CGO_ENABLED: "1"
        run: |
          python3 .agents/skills/eng/eng-test-conventions/scripts/check-test-conventions.py internal/store/globaldb/global_db_goal_turn_runtime_integration_test.go
          python3 .agents/skills/eng/eng-test-conventions/scripts/check-test-conventions.py internal/daemon/loop_goal_managed_runtime_integration_test.go
          go test -race -tags=integration -count=1 -timeout=5m \
            ./internal/store/globaldb ./internal/daemon \
            -run '^(TestGoalTurnRuntimeLifecycleIntegration|TestGoalSessionOutboxIntegration|TestLoopGoalManagedRuntimeIntegration)$'

      - name: Verify managed delivery recovery with real Git and forge HTTP
        env:
          CGO_ENABLED: "1"
        run: >-
          go test -race -tags=integration -count=1 -timeout=5m -v
          ./internal/worktree
          -run '^(TestWorktreeLifecycleIntegration|TestWorktreeManagedDeliveryIntegration)$'

      - name: Verify disposable frozen executor recovery
        env:
          CGO_ENABLED: "1"
        run: go test -race -tags=integration -count=1 -timeout=5m -v ./internal/session -run '^TestManagerIntegrationSupervisedWorkRecovery$'

  sdk-go-test:
    name: Go SDK (race test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          save-cache: ${{ env.SAVE_CACHE }}

      - name: Run Go SDK verification once
        run: |
          go -C sdk/go build ./...
          go -C sdk/go vet ./...
          go -C sdk/go test -race -parallel=4 ./...
        env:
          CGO_ENABLED: 1

  go-build:
    name: Go (build, boundaries)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          save-cache: ${{ env.SAVE_CACHE }}

      - name: Run Go build and boundary verification
        run: |
          make build-go
          make boundaries

  go-peer-darwin:
    name: Go (Darwin peer identity without CGO)
    runs-on: macos-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          save-cache: ${{ env.SAVE_CACHE }}

      - name: Verify Darwin hosted MCP peer identity
        run: go test ./internal/mcp -run '^TestPeerInfoFromUnixConnIdentifiesLocalPeer$' -count=1
        env:
          CGO_ENABLED: 0

  go-terminal-windows:
    name: Go (Windows terminal runtime)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: [changes, preflight]
    if: needs.changes.outputs.heavy == 'true' && needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Inspect changed Go test conventions
        shell: pwsh
        run: |
          $testFiles = @(
            'internal/cli/gateway_credentials_test.go',
            'internal/cli/gateway_profile_transaction_test.go',
            'internal/cli/gateway_permissions_windows_integration_test.go',
            'internal/fileutil/nofollow_windows_test.go',
            'internal/mcp/peer_test.go',
            'internal/mcp/peer_windows_test.go'
          )
          foreach ($testFile in $testFiles) {
            python .agents/skills/eng/eng-test-conventions/scripts/check-test-conventions.py $testFile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          save-cache: ${{ env.SAVE_CACHE }}

      - name: Verify Windows hosted MCP peer identity
        run: >-
          go test ./internal/mcp
          -run '^(TestPeerInfo|TestWindowsPeerIdentity)'
          -count=1
        env:
          CGO_ENABLED: 0

      - name: Verify Windows terminal runtime
        run: >-
          go test ./internal/procutil ./internal/terminal/pty ./internal/terminal
          -run '^(TestWindowsProcessHandleTermination|TestWindowsPTYHardening|TestWindowsPipeRuntime|TestWindowsDefaultShellResolution|TestResolveCapabilities)$'
          -count=1
        env:
          CGO_ENABLED: 0

      - name: Verify read-only config and retirement migration on Windows
        run: >-
          go test ./internal/config
          -run '^(TestPersistedOverlayWindowsReadPermissions|TestLoadConfigArchivesRetiredSkillAcquisition)$'
          -count=1
        env:
          CGO_ENABLED: 0

      - name: Verify Windows private files and Gateway recovery
        run: >-
          go test ./internal/fileutil ./internal/cli
          -run '^(TestAtomicRemoveFileRemovesFileAndRejectsUnsafeTargets|TestWindowsPrivateFiles|TestGatewayCredentialStore|TestGatewayProfileTransactionLock|TestGatewayProfileTransactionJournal|TestGatewayProfileTransactionRecovery|TestGatewayProfileTransactionJournalPath)$'
          -count=1
        env:
          CGO_ENABLED: 0

      - name: Verify Windows startup, rooted writes, and session deletion
        run: >-
          go test ./internal/daemon ./internal/fileutil ./internal/session ./internal/profile
          -run '^(TestUpdateLock|TestWindowsDirectoryMoveNoReplaceContract|TestWindowsDirectoryCreationThroughReadOnlyAncestor|TestManagerQueriesUseWorkspaceRegistration|TestNormalizeIdentitySymbols|TestManagerDelete)/(Should_remove_the_committed_bound_tree_without_a_private_directory_leak|Should_reject_a_concurrent_runtime_mutation|Should_replace_a_stale_owner_with_the_caller_identity|Should_create_descendants_without_requesting_write_access_to_an_existing_ancestor|Should_list_and_inspect_stopped_sessions_without_resolving_runtime_resources|Should_recognize_the_entire_catalog_with_either_LF_or_CRLF_line_endings|Should_remove_a_stopped_user_session_from_durable_counts|Should_wait_for_active_stored_readers_before_committing_deletion|Should_restore_the_staged_directory_when_catalog_deletion_fails|Should_recover_an_interrupted_staged_tombstone_from_every_catalog_state)$'
          -count=1
        env:
          CGO_ENABLED: 0

      - name: Verify Windows skill cache and detached log rotation
        run: >-
          go test ./internal/filesnap ./internal/skillscan ./internal/cli
          -run '^(TestFromInfo|TestDirectoryResultUnchanged|TestSpawnDetachedDaemonProcess|TestSpawnDetachedDaemonProcessInjectsMirrorOverrideEnv)$'
          -count=1
        env:
          CGO_ENABLED: 0

      - name: Build native Windows CLI
        run: go build -o "${{ runner.temp }}/compozy-gateway-test.exe" ./cmd/compozy
        env:
          CGO_ENABLED: 0

      - name: Exercise repeated native Windows CLI and OS keyring recovery
        run: go test -tags integration ./internal/cli -run '^TestWindowsGatewayCLI$' -count=1 -v
        env:
          CGO_ENABLED: 0
          COMPOZY_TEST_BINARY: ${{ runner.temp }}/compozy-gateway-test.exe

  desktop:
    name: Desktop (format, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          save-cache: ${{ env.SAVE_CACHE }}

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install-playwright: "false"

      - name: Restore Turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Set up Turborepo remote cache (OIDC)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Run desktop verification
        run: |
          make desktop-lint
          make desktop-test
          make desktop-build

      - name: Save Turbo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-${{ github.run_id }}

  verify:
    name: Verify (fmt, lint, unit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        changes,
        preflight,
        frontend,
        go-static,
        go-test,
        sdk-go-test,
        go-build,
        go-peer-darwin,
        desktop,
      ]
    if: always()
    steps:
      - name: Require every fast lane the change needs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: &require-lanes |
          set -euo pipefail
          # Detect changes and preflight always run. A lane may skip only
          # because its area or the heavy lane was not selected; failed and
          # cancelled lanes fail the gate.
          jq -e '.changes.result == "success"' <<<"$RESULTS" >/dev/null || {
            echo "Detect changes did not succeed"; exit 1; }
          failed=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<<"$RESULTS")
          if [[ -n "$failed" ]]; then
            echo "Lanes did not succeed:"; echo "$failed"; exit 1
          fi
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$RESULTS"

  e2e-runtime:
    name: E2E runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true')
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          install-gotestsum: "true"
          build-cache-job: go-build

      - name: Set up Bun (runtime build dependencies)
        uses: ./.github/actions/setup-bun
        with:
          install-playwright: "false"

      - name: Restore Turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Set up Turborepo remote cache (OIDC)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Build public app SDK for runtime E2E
        run: bunx turbo run build --filter=@compozy/client

      - name: Run runtime E2E lane
        run: make test-e2e-runtime
        env:
          CGO_ENABLED: 0
          CI: "true"

      - name: Upload runtime E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-runtime-artifacts
          path: /tmp/compozy-e2e-artifacts-*/_artifacts
          if-no-files-found: ignore
          retention-days: 7

  e2e-web:
    name: E2E web (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true')
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          build-cache-job: go-build

      - name: Set up Bun (web deps + Playwright)
        uses: ./.github/actions/setup-bun
        with:
          install-playwright: "true"

      - *install-terminal-scenario-shell

      - name: Restore Turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Set up Turborepo remote cache (OIDC)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Run web E2E lane shard
        run: make test-e2e-web
        env:
          CGO_ENABLED: 0
          CI: "true"
          COMPOZY_E2E_WEB_SHARD: ${{ matrix.shard }}/6

      - name: Upload session lifecycle QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: session-lifecycle-evidence-shard-${{ matrix.shard }}
          path: .tmp/playwright/test-results/*session-harden*/compozy-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Marketplace recovery and production CSP evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marketplace-recovery-evidence-shard-${{ matrix.shard }}
          path: .tmp/playwright/test-results/*marketplace*/compozy-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Unicode terminal prompt QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: terminal-unicode-evidence-shard-${{ matrix.shard }}
          path: .tmp/playwright/test-results/*E2E-020*/compozy-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload bulk session deletion QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: session-bulk-delete-evidence-shard-${{ matrix.shard }}
          path: .tmp/playwright/test-results/*session-bulk-act*/compozy-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload worktree cleanup UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worktree-cleanup-evidence-shard-${{ matrix.shard }}
          path: .tmp/playwright/test-results/*worktrees*/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload web E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-web-artifacts-shard-${{ matrix.shard }}
          path: |
            .tmp/playwright
            /tmp/compozy-e2e-*
          if-no-files-found: ignore
          retention-days: 7

  e2e-desktop:
    name: E2E desktop
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.desktop == 'true')
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          build-cache-job: go-build

      - name: Preserve Go caches across isolated desktop homes
        run: |
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_ENV"

      - name: Set up Bun (desktop deps + Playwright)
        uses: ./.github/actions/setup-bun
        with:
          install-playwright: "true"

      - name: Allow the Chromium user namespace sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes openbox

      - name: Restore Turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Set up Turborepo remote cache (OIDC)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Run desktop E2E lane
        run: make test-e2e-desktop
        env:
          CGO_ENABLED: 0
          CI: "true"

      - name: Upload desktop E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-desktop-artifacts
          path: |
            .tmp/playwright
            /tmp/compozy-e2e-*
          if-no-files-found: ignore
          retention-days: 7

  e2e-combined:
    # Gates the heavy lane. It succeeds without running heavy jobs when the
    # pull request defers them to the merge queue.
    name: E2E (combined lane)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [changes, preflight, go-integration, go-terminal-windows, e2e-runtime, e2e-web, e2e-desktop]
    if: always()
    steps:
      - name: Require every heavy lane the change needs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: *require-lanes

      - name: Note a deferred heavy lane
        if: needs.changes.outputs.heavy != 'true'
        run: echo "::notice title=Heavy lane deferred::Integration, Windows and E2E lanes run in the merge queue. Add the ci:full label and re-run to run them here."
