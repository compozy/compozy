name: CI

# Lanes:
# - Fast lane (preflight, lint, typecheck, unit, build) gates every pull request
#   through `Verify (fmt, lint, unit, build)`, limited to the changed areas.
# - Heavy lane (full Go integration, Windows, runtime/web/desktop E2E) gates
#   through `E2E (combined lane)` in merge groups, on main pushes and nightly.
#   CI_MERGE_QUEUE=true defers PR heavy checks to the queue; `ci:full`, release
#   PRs and CI changes opt in early. Explicit false enables the backend fallback;
#   an absent variable preserves the existing PR opt-in policy.
# - The nightly schedule runs every lane on main.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    types: [checks_requested]
    branches: [main]
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  # PRs and replacement groups for the same queue ref keep only their newest
  # run. Every main/scheduled commit finishes and seeds the caches.
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}

env:
  CGO_ENABLED: 0
  GO_VERSION: "1.27.3"
  COMPOZY_GO_TEST_JSONFILE_DIR: /tmp/gotest-json
  # Turborepo remote cache (Vercel): jobs exchange the GitHub OIDC token for a
  # short-lived Turborepo token (revoked at job end). Pull requests read the
  # shared cache; push and workflow_dispatch lanes upload. Fork PRs skip the
  # exchange and stay local-only.
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
  TURBO_CACHE: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'local:rw,remote:r' || 'local:rw,remote:rw' }}
  # Only main saves GitHub caches; pull requests and merge groups restore them.
  SAVE_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: read
  id-token: write

jobs:
  pr-title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            perf
            docs
            test
            build
            ci
          requireScope: false
          disallowScopes: |
            .*
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" must start with a lowercase letter.
            Title format: <type>: <description> — e.g. "fix: drop stale session sockets on daemon restart"

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      cloud: ${{ steps.filter.outputs.cloud }}
      web: ${{ steps.filter.outputs.web }}
      desktop: ${{ steps.filter.outputs.desktop }}
      heavy: ${{ steps.filter.outputs.heavy }}
      release_pr: ${{ steps.filter.outputs.release_pr }}
      workspaces: ${{ steps.filter.outputs.workspaces }}
      frontend_lanes: ${{ steps.filter.outputs.frontend_lanes }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify change classification
        run: scripts/ci-changes.sh --self-test

      - name: Filter paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_QUEUE: ${{ vars.CI_MERGE_QUEUE }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          workspaces='["*"]'
          zero_sha='0000000000000000000000000000000000000000'
          base_sha=""
          head_sha=""
          case "$EVENT_NAME" in
            pull_request) base_sha="$PR_BASE_SHA"; head_sha="$PR_HEAD_SHA" ;;
            push) base_sha="$PUSH_BEFORE_SHA"; head_sha="$CURRENT_SHA" ;;
          esac

          # Merge groups verify the complete combined tree, including release
          # PRs whose earlier integration run belonged to Release. Never defer
          # a merge-group dependency to a pull_request-only workflow.
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            areas=$'backend=true\nweb=true\ndesktop=true\nci_infra=true'
          elif [[ -n "$base_sha" && "$base_sha" != "$zero_sha" && -n "$head_sha" ]] &&
            git fetch --no-tags --depth=1 origin "$base_sha" "$head_sha"; then
            if git diff --name-only --no-renames -z "$base_sha" "$head_sha" > /tmp/ci-paths; then
              areas=$(tr '\0' '\n' < /tmp/ci-paths | scripts/ci-changes.sh)
              workspaces=$(python3 scripts/ci-workspaces.py < /tmp/ci-paths)
              if [[ "$workspaces" != '[]' ]]; then
                areas=${areas//web=false/web=true}
              fi
            else
              areas=$'backend=true\nweb=true\ndesktop=true\nci_infra=true'
            fi
          else
            echo "Base commit $base_sha is unavailable; treating every area as changed."
            areas=$'backend=true\nweb=true\ndesktop=true\nci_infra=true'
          fi

          cloud=false
          if [[ "$EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            if [[ "$base_sha" == "$zero_sha" ]]; then
              base_sha=$(git hash-object -t tree -w --stdin </dev/null)
            else
              git fetch --no-tags --depth=1 origin "$base_sha"
            fi
            cloud_paths=$(git diff --name-only "$base_sha" "$head_sha" -- \
              cmd/compozy-cloud internal/cloud internal/remoteproto infra/cloud-edge Dockerfile \
              .github/workflows/cloud-deploy.yml .github/scripts/cloud-deploy.sh \
              .github/scripts/cloud-deploy-target.sh .github/scripts/cloud-smoke.ts)
            if [[ -n "$cloud_paths" ]]; then cloud=true; fi
          fi

          # Non-PR events always run heavy lanes. The variable is a staged
          # rollout/rollback switch: explicit false enables backend PR fallback;
          # an unset variable keeps today's opt-in behavior until activation.
          release_pr=false
          if [[ "$EVENT_NAME" == "pull_request" ]] &&
             [[ "$PR_BASE_REF" == main || "$PR_BASE_REF" == release/v* ]] &&
             [[ "$PR_TITLE" == 'build: release '* || "$PR_BASE_REF" == release/v* ]]; then
            release_pr=true
          fi
          heavy=true
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            heavy=false
            if [[ "$release_pr" == true || "$PR_TITLE" == 'build: release '* ]] ||
               grep -qx 'ci_infra=true' <<<"$areas" ||
               { [[ "$MERGE_QUEUE" == false ]] && grep -qx 'backend=true' <<<"$areas"; }; then
              heavy=true
            else
              labels=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" --jq '.[].name')
              if grep -qx 'ci:full' <<<"$labels"; then heavy=true; fi
            fi
          fi

          {
            grep -E '^(backend|web|desktop)=' <<<"$areas"
            echo "cloud=$cloud"
            echo "heavy=$heavy"
            echo "release_pr=$release_pr"
            echo "workspaces=$workspaces"
            echo "frontend_lanes=$(python3 scripts/ci-workspaces.py --lanes <<<"$workspaces")"
          } | tee -a "$GITHUB_OUTPUT"

  preflight:
    name: Preflight (codegen, installer, product language)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    steps:
      - uses: actions/checkout@v7

      - name: Install ripgrep
        run: |
          # Only Ubuntu supplies this dependency; unrelated runner repositories
          # must not block preflight when their indexes are inconsistent.
          test -f /etc/apt/sources.list.d/ubuntu.sources
          apt_sources=(-o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          bash .github/scripts/apt-mirror-fallback.sh
          sudo apt-get "${apt_sources[@]}" update
          sudo apt-get "${apt_sources[@]}" install --yes ripgrep
          rg --version

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          verify-modules: "true"
          save-cache: ${{ env.SAVE_CACHE }}

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install-playwright: "false"

      - name: Verify cloud source SPDX headers
        run: bash .github/scripts/cloud-license.sh

      - name: Verify the cloud image build context
        run: bash .github/scripts/cloud-build-context.sh

      - name: Verify generated artifacts
        run: make codegen-check

      - name: Verify installer artifacts
        run: make installer-check

      - name: Verify product language
        run: make product-language-check

  frontend-tasks:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.frontend_lanes) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.web == 'true'
    env:
      CI_WEB_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go for scaffold tests
        if: matrix.lane != 'lint' && matrix.lane != 'web-tests'
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          build-cache: "false"

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install-playwright: "false"

      - name: Restore Turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-${{ matrix.lane }}-${{ matrix.shard || 'all' }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-${{ matrix.lane }}-${{ matrix.shard || 'all' }}-
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Set up Turborepo remote cache (OIDC)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Run frontend verification
        env:
          COMPOZY_CODEGEN_CHECKED: "1"
          CI_WORKSPACES: ${{ needs.changes.outputs.workspaces }}
        run: python3 scripts/ci-frontend.py '${{ matrix.lane }}'

      - name: Report Turbo receipts and audit a cached test
        if: matrix.lane != 'lint'
        env:
          COMPOZY_CODEGEN_CHECKED: "1"
        run: python3 scripts/ci-turbo-report.py

      - name: Upload Turbo timing receipts
        if: always() && matrix.lane != 'lint'
        uses: actions/upload-artifact@v7
        with:
          name: turbo-receipts-${{ matrix.lane }}-${{ strategy.job-index }}
          path: .turbo/runs/*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload frontend artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-verify-artifacts-${{ matrix.lane }}-${{ strategy.job-index }}
          path: |
            web/dist
            web/.turbo/turbo-test.log
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true

      - name: Save Turbo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-${{ matrix.lane }}-${{ matrix.shard || 'all' }}-${{ github.run_id }}

  # Preserve the canonical check and needs ID consumed by the fast-lane gate.
  # always() prevents a failed/canceled shard from skipping this aggregate.
  frontend:
    name: Frontend (web)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, frontend-tasks]
    if: always() && needs.changes.outputs.web == 'true'
    steps:
      - name: Require every selected frontend task
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tasks.result }}
        run: test "$CHANGES_RESULT" = success && test "$FRONTEND_RESULT" = success

  go-static:
    name: Go (format, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          install-gotestsum: "true"
          go-version: ${{ env.GO_VERSION }}
          install-golangci-lint: "true"
          save-cache: ${{ env.SAVE_CACHE }}

      - name: Restore golangci-lint cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/compozy-dev/golangci-lint
          key: ${{ runner.os }}-golangci-v2.15.0-${{ hashFiles('**/go.sum', '**/go.mod', '.golangci.yml') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-golangci-v2.15.0-${{ hashFiles('**/go.sum', '**/go.mod', '.golangci.yml') }}-
            ${{ runner.os }}-golangci-v2.15.0-

      - name: Run Go static verification
        run: |
          make fmt-check
          make source-size
          make go-lint

      - name: Prepare contract test receipts
        run: mkdir -p /tmp/gotest-json

      - name: Verify boundary, integration selection and census contracts
        env:
          CGO_ENABLED: "1"
        run: >-
          gotestsum --rerun-fails=1 --rerun-fails-max-failures=5
          --jsonfile /tmp/gotest-json/gotest-mage.json --packages ./magefiles -- -race -tags=mage
          -run '^Test(DependencyClosureBoundaries|Integration|GlobalDBIntegration|GoTest|LoadGoTestCensus|Census|Partition|MissingPackage|Flake|Perf)'
          -count=1 -timeout=5m

      - uses: ./.github/actions/report-flakes
        if: always()
        with:
          job: go-static

      - name: Save golangci-lint cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/compozy-dev/golangci-lint
          key: ${{ runner.os }}-golangci-v2.15.0-${{ hashFiles('**/go.sum', '**/go.mod', '.golangci.yml') }}-${{ github.run_id }}

  go-test:
    name: Go (race test shard ${{ matrix.shard_label }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_index: "0"
            shard_label: "1/8"
          - shard_index: "1"
            shard_label: "2/8"
          - shard_index: "2"
            shard_label: "3/8"
          - shard_index: "3"
            shard_label: "4/8"
          - shard_index: "4"
            shard_label: "5/8"
          - shard_index: "5"
            shard_label: "6/8"
          - shard_index: "6"
            shard_label: "7/8"
          - shard_index: "7"
            shard_label: "8/8"
    env:
      COMPOZY_GO_TEST_P: "1"
      COMPOZY_GO_TEST_SHARD_INDEX: ${{ matrix.shard_index }}
      COMPOZY_GO_TEST_SHARD_TOTAL: "8"
      COMPOZY_GO_TEST_JSONFILE_DIR: /tmp/gotest-json
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          install-gotestsum: "true"
          cache-key-suffix: -${{ matrix.shard_index }}
          save-cache: ${{ env.SAVE_CACHE }}

      - name: Build ACP mock fixture driver
        timeout-minutes: 5
        env:
          CGO_ENABLED: "1"
          COMPOZY_TEST_ACPMOCK_DRIVER_BIN: ${{ runner.temp }}/acpmock-driver
        run: |
          go build -o "$COMPOZY_TEST_ACPMOCK_DRIVER_BIN" ./internal/testutil/acpmock/cmd/acpmock-driver
          printf 'COMPOZY_TEST_ACPMOCK_DRIVER_BIN=%s\n' "$COMPOZY_TEST_ACPMOCK_DRIVER_BIN" >> "$GITHUB_ENV"

      - name: Set up Bun for codegen contract tests
        uses: ./.github/actions/setup-bun
        with:
          install-playwright: "false"

      - &install-terminal-scenario-shell
        name: Install zsh for terminal contracts
        run: |
          test -f /etc/apt/sources.list.d/ubuntu.sources
          apt_sources=(-o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          bash .github/scripts/apt-mirror-fallback.sh
          sudo apt-get "${apt_sources[@]}" update
          sudo apt-get "${apt_sources[@]}" install --no-install-recommends --yes zsh
          # Runner-provided completion directories can be group/world writable.
          # Repair their permissions so global compinit can pass its security audit.
          mapfile -t insecure_paths < <(zsh -fc 'autoload -Uz compaudit; compaudit' 2>/dev/null)
          if (( ${#insecure_paths[@]} > 0 )); then
            sudo chmod go-w -- "${insecure_paths[@]}"
          fi
          zsh -fc 'autoload -Uz compaudit; compaudit'
          zsh --version

      - name: Run Go runtime verification
        run: make test

      - uses: ./.github/actions/report-flakes
        if: always()
        with:
          job: go-test-${{ matrix.shard_index }}

      - name: Upload gotestsum timing data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gotest-json-shard-${{ matrix.shard_index }}
          path: /tmp/gotest-json
          if-no-files-found: error
          retention-days: 7

  # Main, merge groups, nightly and ci:full PRs own full integration here.
  # Release PRs call the same reusable workflow from Release, gating dry-run.
  go-integration:
    name: Go integration
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && needs.changes.outputs.backend == 'true' && needs.changes.outputs.release_pr != 'true'
    uses: ./.github/workflows/go-integration.yml
    with:
      save-cache: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  cloud-staging:
    name: Deploy cloud to staging
    needs:
      [
        changes,
        preflight,
        go-static,
        go-test,
        go-build,
        go-integration,
        sdk-go-test,
        go-peer-darwin,
        go-terminal-windows,
      ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.cloud == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/cloud-deploy.yml
    with:
      target: staging
    secrets: inherit

  sdk-go-test:
    name: Go SDK (race test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          install-gotestsum: "true"
          go-version: ${{ env.GO_VERSION }}
          save-cache: ${{ env.SAVE_CACHE }}

      - name: Run Go SDK verification once
        run: |
          go -C sdk/go build ./...
          go -C sdk/go vet ./...
          go run github.com/magefile/mage@v1.17.2 testSDKGo
        env:
          CGO_ENABLED: 1

      - uses: ./.github/actions/report-flakes
        if: always()
        with:
          job: sdk-go-test

  go-build:
    name: Go (build, boundaries)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          save-cache: ${{ env.SAVE_CACHE }}

      - name: Run Go build and boundary verification
        run: |
          make build-go
          make boundaries

  go-peer-darwin:
    name: Go (Darwin peer identity without CGO)
    runs-on: macos-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          install-gotestsum: "true"
          go-version: ${{ env.GO_VERSION }}
          save-cache: ${{ env.SAVE_CACHE }}

      - name: Verify Darwin hosted MCP peer identity
        run: |
          mkdir -p /tmp/gotest-json
          gotestsum --rerun-fails=1 --rerun-fails-max-failures=5 \
            --jsonfile /tmp/gotest-json/gotest-darwin.json --packages ./internal/mcp -- \
            -run '^TestPeerInfoFromUnixConnIdentifiesLocalPeer$' -count=1
        env:
          CGO_ENABLED: 0

      - uses: ./.github/actions/report-flakes
        if: always()
        with:
          job: go-peer-darwin

  go-terminal-windows:
    name: Go (Windows terminal runtime)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: [changes, preflight]
    if: needs.changes.outputs.heavy == 'true' && needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Inspect changed Go test conventions
        shell: pwsh
        run: |
          $testFiles = @(
            'internal/fileutil/nofollow_windows_test.go',
            'internal/mcp/peer_test.go',
            'internal/mcp/peer_windows_test.go'
          )
          foreach ($testFile in $testFiles) {
            python .agents/skills/eng/eng-test-conventions/scripts/check-test-conventions.py $testFile
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          install-gotestsum: "true"
          go-version: ${{ env.GO_VERSION }}
          save-cache: ${{ env.SAVE_CACHE }}

      - name: Prepare Windows test receipts
        shell: bash
        run: mkdir -p .tmp/gotest-json

      - name: Verify Windows hosted MCP peer identity
        run: >-
          gotestsum --rerun-fails=1 --rerun-fails-max-failures=5 --jsonfile .tmp/gotest-json/gotest-windows-1.json --packages "./internal/mcp" --
          -run '^(TestPeerInfo|TestWindowsPeerIdentity)'
          -count=1
        env:
          CGO_ENABLED: 0

      - name: Verify Windows terminal runtime
        run: >-
          gotestsum --rerun-fails=1 --rerun-fails-max-failures=5 --jsonfile .tmp/gotest-json/gotest-windows-2.json --packages "./internal/procutil ./internal/terminal/pty ./internal/terminal" --
          -run '^(TestWindowsProcessHandleTermination|TestWindowsPTYHardening|TestWindowsPipeRuntime|TestWindowsDefaultShellResolution|TestResolveCapabilities)$'
          -count=1
        env:
          CGO_ENABLED: 0

      - name: Verify Windows managed stdout lifetime
        run: gotestsum --rerun-fails=1 --rerun-fails-max-failures=5 --jsonfile .tmp/gotest-json/gotest-windows-3.json --packages "./internal/subprocess" -- -run '^TestProcessStdoutLifetime$' -count=1
        env:
          CGO_ENABLED: 0

      - name: Verify read-only config and retirement migration on Windows
        run: >-
          gotestsum --rerun-fails=1 --rerun-fails-max-failures=5 --jsonfile .tmp/gotest-json/gotest-windows-4.json --packages "./internal/config" --
          -run '^(TestPersistedOverlayWindowsReadPermissions|TestLoadConfigArchivesRetiredSkillAcquisition)$'
          -count=1
        env:
          CGO_ENABLED: 0

      - name: Verify Windows private files
        run: >-
          gotestsum --rerun-fails=1 --rerun-fails-max-failures=5 --jsonfile .tmp/gotest-json/gotest-windows-5.json --packages "./internal/fileutil" --
          -run '^(TestAtomicRemoveFileRemovesFileAndRejectsUnsafeTargets|TestWindowsPrivateFiles)$'
          -count=1
        env:
          CGO_ENABLED: 0

      - name: Verify Windows startup, rooted writes, and session deletion
        run: >-
          gotestsum --rerun-fails=1 --rerun-fails-max-failures=5 --jsonfile .tmp/gotest-json/gotest-windows-6.json --packages "./internal/daemon ./internal/fileutil ./internal/session ./internal/profile" --
          -run '^(TestUpdateLock|TestWindowsDirectoryMoveNoReplaceContract|TestWindowsDirectoryCreationThroughReadOnlyAncestor|TestManagerQueriesUseWorkspaceRegistration|TestNormalizeIdentitySymbols|TestManagerDelete)/(Should_remove_the_committed_bound_tree_without_a_private_directory_leak|Should_reject_a_concurrent_runtime_mutation|Should_replace_a_stale_owner_with_the_caller_identity|Should_create_descendants_without_requesting_write_access_to_an_existing_ancestor|Should_list_and_inspect_stopped_sessions_without_resolving_runtime_resources|Should_recognize_the_entire_catalog_with_either_LF_or_CRLF_line_endings|Should_remove_a_stopped_user_session_from_durable_counts|Should_wait_for_active_stored_readers_before_committing_deletion|Should_restore_the_staged_directory_when_catalog_deletion_fails|Should_recover_an_interrupted_staged_tombstone_from_every_catalog_state)$'
          -count=1
        env:
          CGO_ENABLED: 0

      - name: Verify Windows skill cache and detached log rotation
        run: >-
          gotestsum --rerun-fails=1 --rerun-fails-max-failures=5 --jsonfile .tmp/gotest-json/gotest-windows-7.json --packages "./internal/filesnap ./internal/skillscan ./internal/cli" --
          -run '^(TestFromInfo|TestDirectoryResultUnchanged|TestSpawnDetachedDaemonProcess|TestSpawnDetachedDaemonProcessInjectsMirrorOverrideEnv)$'
          -count=1
        env:
          CGO_ENABLED: 0

      - uses: ./.github/actions/report-flakes
        if: always()
        env:
          COMPOZY_GO_TEST_JSONFILE_DIR: .tmp/gotest-json
        with:
          job: go-windows

  desktop:
    name: Desktop (format, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: changes
    if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.web == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          save-cache: ${{ env.SAVE_CACHE }}

      - name: Set up Bun
        uses: ./.github/actions/setup-bun
        with:
          install-playwright: "false"

      - name: Restore Turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Set up Turborepo remote cache (OIDC)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Run desktop verification
        run: |
          make desktop-lint
          make desktop-test
          make desktop-build

      - name: Save Turbo cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-${{ github.run_id }}

  verify:
    name: Verify (fmt, lint, unit, build)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [
        changes,
        preflight,
        frontend,
        go-static,
        go-test,
        sdk-go-test,
        go-build,
        go-peer-darwin,
        desktop,
      ]
    if: always()
    steps:
      - uses: actions/checkout@v7
      - name: Require every fast lane the change needs
        env:
          RESULTS: ${{ toJSON(needs) }}
          GATE_KIND: fast
        run: &require-lanes |
          scripts/ci-changes.sh --require-lanes "$GATE_KIND" <<<"$RESULTS"

  e2e-runtime:
    name: E2E runtime
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true')
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          install-gotestsum: "true"
          build-cache-job: go-build

      - name: Set up Bun (runtime build dependencies)
        uses: ./.github/actions/setup-bun
        with:
          install-playwright: "false"

      - name: Restore Turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Set up Turborepo remote cache (OIDC)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Build public app SDK for runtime E2E
        run: bunx turbo run build --filter=@compozy/client

      - name: Run runtime E2E lane
        run: make test-e2e-runtime
        env:
          CGO_ENABLED: 0
          CI: "true"

      - uses: ./.github/actions/report-flakes
        if: always()
        with:
          job: e2e-runtime

      - name: Upload runtime E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-runtime-artifacts
          path: /tmp/compozy-e2e-artifacts-*/_artifacts
          if-no-files-found: ignore
          retention-days: 7

  e2e-web:
    name: E2E web (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true')
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: cloud_test
          POSTGRES_DB: cloud_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cloud_test -d cloud_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          build-cache-job: go-build

      - name: Set up Bun (web deps + Playwright)
        uses: ./.github/actions/setup-bun
        with:
          install-playwright: "true"

      - *install-terminal-scenario-shell

      - name: Restore Turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Set up Turborepo remote cache (OIDC)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Run web E2E lane shard
        run: make test-e2e-web
        env:
          CGO_ENABLED: 0
          CI: "true"
          COMPOZY_E2E_WEB_SHARD: ${{ matrix.shard }}/6
          COMPOZY_CLOUD_TEST_POSTGRES: postgresql://cloud_test@127.0.0.1:5432/cloud_test?sslmode=disable

      - uses: ./.github/actions/report-flakes
        if: always()
        with:
          job: e2e-web-${{ matrix.shard }}

      - name: Upload session lifecycle QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: session-lifecycle-evidence-shard-${{ matrix.shard }}
          path: .tmp/playwright/test-results/*session-harden*/compozy-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Sessions dock QA screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sessions-dock-evidence-shard-${{ matrix.shard }}
          path: .tmp/playwright/test-results/*E2E-136*/compozy-artifacts/browser_screenshots/final.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Marketplace recovery and production CSP evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: marketplace-recovery-evidence-shard-${{ matrix.shard }}
          path: .tmp/playwright/test-results/*marketplace*/compozy-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Unicode terminal prompt QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: terminal-unicode-evidence-shard-${{ matrix.shard }}
          path: .tmp/playwright/test-results/*E2E-020*/compozy-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload bulk session deletion QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: session-bulk-delete-evidence-shard-${{ matrix.shard }}
          path: .tmp/playwright/test-results/*session-bulk-act*/compozy-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload subagent drawer QA evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: subagent-drawer-evidence-shard-${{ matrix.shard }}
          path: .tmp/playwright/test-results/*session-subagent*/compozy-artifacts
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload worktree cleanup UI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: worktree-cleanup-evidence-shard-${{ matrix.shard }}
          path: .tmp/playwright/test-results/*worktrees*/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload web E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-web-artifacts-shard-${{ matrix.shard }}
          path: |
            .tmp/playwright
            /tmp/compozy-e2e-*
          if-no-files-found: ignore
          retention-days: 7

  e2e-desktop:
    name: E2E desktop
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: changes
    if: needs.changes.outputs.heavy == 'true' && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.desktop == 'true')
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          build-cache-job: go-build

      - name: Preserve Go caches across isolated desktop homes
        run: |
          echo "GOCACHE=$(go env GOCACHE)" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_ENV"

      - name: Set up Bun (desktop deps + Playwright)
        uses: ./.github/actions/setup-bun
        with:
          install-playwright: "true"

      - name: Allow the Chromium user namespace sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bash .github/scripts/apt-mirror-fallback.sh
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes openbox

      - name: Restore Turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ github.job }}-
            ${{ runner.os }}-turbo-${{ hashFiles('bun.lock', 'turbo.json') }}-
            ${{ runner.os }}-turbo-

      - name: Set up Turborepo remote cache (OIDC)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
        continue-on-error: true
        uses: vercel/setup-turborepo-remote-cache-action@135046f5efcadb17337d9b29b8d5b4035ae64b10 # v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - name: Run desktop E2E lane
        run: make test-e2e-desktop
        env:
          CGO_ENABLED: 0
          CI: "true"

      - uses: ./.github/actions/report-flakes
        if: always()
        with:
          job: e2e-desktop

      - name: Upload desktop E2E artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-desktop-artifacts
          path: |
            .tmp/playwright
            /tmp/compozy-e2e-*
          if-no-files-found: ignore
          retention-days: 7

  e2e-combined:
    # Gates the heavy lane. It succeeds without running heavy jobs when the
    # pull request defers them to the queue. Both aggregates always report
    # the same names on pull_request and merge_group; require only those names.
    name: E2E (combined lane)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      [changes, preflight, go-integration, go-terminal-windows, e2e-runtime, e2e-web, e2e-desktop]
    if: always()
    steps:
      - uses: actions/checkout@v7
      - name: Require every heavy lane the change needs
        env:
          RESULTS: ${{ toJSON(needs) }}
          GATE_KIND: heavy
        run: *require-lanes

      - name: Note an unselected heavy lane
        if: needs.changes.outputs.heavy != 'true'
        run: echo "::notice title=Heavy lane deferred::Integration, Windows and E2E lanes run in merge groups, on main pushes and nightly. Add the ci:full label to run them here."

  e2e-perf:
    name: Nightly E2E-023 performance census
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    # Informational on explicitly opted-in PRs; deliberately outside both merge
    # aggregators and Release publication dependencies. Never retry a failed census.
    if: github.event_name == 'schedule' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full'))
    outputs:
      rejected: ${{ steps.judge.outcome == 'failure' }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          build-cache-job: go-build
      - uses: ./.github/actions/setup-bun
        with:
          install-playwright: "true"
      - *install-terminal-scenario-shell
      - name: Collect five complete performance samples without retries
        id: samples
        run: make test-e2e-web
        env:
          CI: "true"
          COMPOZY_E2E_PERF: "1"
      - name: Judge the median against the unchanged 50 ms budget
        id: judge
        # Provisioning/build failures produce no report and belong to their own
        # failing step. A successful collection must produce a judgeable report;
        # incomplete or functionally failed reports still get judged.
        if: always() && (steps.samples.outcome == 'success' || hashFiles('.tmp/playwright/playwright-web.json') != '')
        shell: bash
        run: |
          mkdir -p .tmp/playwright
          go run github.com/magefile/mage@v1.17.2 testPerfCensus .tmp/playwright/playwright-web.json 2>&1 | tee .tmp/playwright/perf-judgment.txt
      - name: Retain every performance sample
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-perf-census
          path: .tmp/playwright
          if-no-files-found: error
          retention-days: 14

  e2e-perf-issue:
    name: Update performance census tracking issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: e2e-perf
    if: always() && !cancelled() && needs.e2e-perf.outputs.rejected == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # Serialize the small issue update only; every independent census can run.
    concurrency:
      group: e2e-perf-tracking-issue
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: e2e-perf-census
          path: .tmp/playwright
      - name: Update the performance tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          COMPOZY_FLAKE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/perf-census-issue.sh .tmp/playwright/perf-judgment.txt

  flake-census:
    name: Collect recovered test flakes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      [
        go-static,
        go-test,
        sdk-go-test,
        go-integration,
        go-peer-darwin,
        go-terminal-windows,
        e2e-runtime,
        e2e-web,
        e2e-desktop,
      ]
    if: always() && !cancelled()
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/collect-flakes
