name: SQLite retained trace analysis

on:
  workflow_dispatch:
    inputs:
      trace_run_id:
        description: "Analyze retained traces and decisions from this workflow run"
        type: number
        required: true

permissions:
  contents: read

concurrency:
  group: sqlite-trace-analysis-${{ github.ref }}-${{ inputs.trace_run_id }}
  cancel-in-progress: false

env:
  GOMAXPROCS: 2

jobs:
  trace-analysis:
    name: SQLite retained trace analysis (not acceptance)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Download retained experiment
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.trace_run_id }}
        run: |
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" \
            --pattern 'sqlite-contention-*' --dir "$RUNNER_TEMP/retained-traces"
      - name: Reevaluate retained decisions without rerunning the workload
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts/sqlite-contention
          TRACE_ROOT: ${{ runner.temp }}/retained-traces
          ANALYSIS_ROOT: ${{ runner.temp }}/trace-analysis
        run: |
          mkdir "$RUNNER_TEMP/trace-analysis"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from run import acceptance_failures

          paths = list(Path(os.environ["TRACE_ROOT"]).rglob("results.json"))
          if not paths:
              raise RuntimeError("retained artifact has no complete results.json")
          for path in paths:
              recorded = json.loads(path.read_text())
              before = json.loads((path.parent / "upgrade-before.json").read_text())
              _, regressions, invalid, tails = acceptance_failures(
                  recorded["trials"], before["retention_eligible_rows"])
              receipt = {"source_head": recorded["environment"]["head"],
                         "runtime_trace_trials": recorded.get("runtime_trace_trials", False),
                         "recorded": {key: recorded[key] for key in (
                             "invalid_head_trials", "throughput_regressions", "transcript_tail_comparison")},
                         "reevaluated": {"invalid_head_trials": invalid,
                                         "throughput_regressions": regressions,
                                         "transcript_tail_comparison": tails}}
              target = Path(os.environ["ANALYSIS_ROOT"]) / (path.parent.name + "-decisions.json")
              target.write_text(json.dumps(receipt, indent=2) + "\n")
          PY
      - name: Summarize recorded scheduling and syscalls
        run: |
          status=0
          found=0
          while IFS= read -r -d '' trace; do
            found=1
            name="$(basename "$trace" .trace)"
            for kind in syscall sched sync; do
              profile="$RUNNER_TEMP/trace-analysis/$name-$kind.pprof"
              if ! go tool trace -pprof="$kind" "$trace" > "$profile" 2> "$profile-error.txt"; then
                status=1
                continue
              fi
              if ! go tool pprof -top -nodecount=40 "$profile" > "$profile.txt" 2>> "$profile-error.txt"; then
                status=1
              fi
              if ! go tool pprof -top -cum -nodecount=40 "$profile" > "$profile-cumulative.txt" 2>> "$profile-error.txt"; then
                status=1
              fi
            done
          done < <(find "$RUNNER_TEMP/retained-traces" -name '*.trace' -print0)
          if test "$found" = 0; then
            echo "No retained trace files found" >&2
            status=1
          fi
          exit "$status"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sqlite-trace-analysis-${{ github.run_id }}
          path: ${{ runner.temp }}/trace-analysis/*
          retention-days: 14
          if-no-files-found: error
