name: Catalog validation

on:
  pull_request:
    paths:
      - "catalog/**"
      - "cmd/agh-catalog/**"
      - "internal/marketplace/**"
      - ".github/workflows/catalog.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Validate curated feeds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          go-version: "1.26.4"
          install-tools: "false"

      - name: Validate catalog documents
        run: go run ./cmd/agh-catalog validate ./catalog
