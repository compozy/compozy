name: SQLite paired load

# Manual only. The paired measurement compares the head with a fixed baseline on
# a shared runner, and runner noise failed it on unrelated pull requests (#1433).
on:
  workflow_dispatch:
    inputs:
      runtime_trace_trials:
        description: "Record the original trials for syscall/scheduling diagnosis (not final acceptance evidence)"
        type: boolean
        default: false
      reader_baseline:
        description: "Base commit SHA for the isolated reader probe (#1630). Leave empty to run the original paired load."
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: sqlite-paired-load-${{ github.ref }}-${{ inputs.reader_baseline != '' && 'readers' || inputs.runtime_trace_trials && 'traced' || 'acceptance' }}
  cancel-in-progress: true

env:
  CGO_ENABLED: 0
  GOMAXPROCS: 2
  BASELINE_SHA: d35c63c9a9f70806583d8595f0279f78c5dff84f

jobs:
  paired-load:
    if: inputs.reader_baseline == ''
    name: ${{ inputs.runtime_trace_trials && 'SQLite traced diagnostic (not acceptance)' || 'SQLite paired load and 1 GB upgrade' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Verify acceptance decisions
        run: python3 -m unittest discover -s scripts/sqlite-contention -p '*_test.py' -v
      - name: Install syscall tracer
        run: |
          apt_sources=(-o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          bash .github/scripts/apt-mirror-fallback.sh
          sudo apt-get "${apt_sources[@]}" update
          sudo apt-get "${apt_sources[@]}" install --yes strace
      - name: Check out the fixed baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASELINE_SHA }}
          path: baseline
          persist-credentials: false
      - name: Build identical workload against both implementations
        run: |
          mkdir -p baseline/scripts/sqlite-contention
          cp scripts/sqlite-contention/*.go baseline/scripts/sqlite-contention/
          go build -p 2 -o "$RUNNER_TEMP/contention-head" ./scripts/sqlite-contention
          cd baseline
          go build -p 2 -o "$RUNNER_TEMP/contention-baseline" ./scripts/sqlite-contention
      - name: Measure on the same runner, sequentially
        env:
          EXPERIMENT_HEAD: ${{ github.sha }}
          RUNTIME_TRACE_TRIALS: ${{ inputs.runtime_trace_trials || false }}
        run: |
          diagnostic_args=()
          if test "$RUNTIME_TRACE_TRIALS" = true; then
            diagnostic_args+=(--runtime-trace-trials)
          fi
          python3 scripts/sqlite-contention/run.py \
            --baseline "$RUNNER_TEMP/contention-baseline" \
            --head "$RUNNER_TEMP/contention-head" \
            --baseline-sha "$BASELINE_SHA" --head-sha "$EXPERIMENT_HEAD" \
            --output "$RUNNER_TEMP/sqlite-contention" "${diagnostic_args[@]}"
      - name: Publish experiment summary
        if: always()
        run: |
          report="$RUNNER_TEMP/sqlite-contention/report.md"
          if test -f "$report"; then
            # Keep the full artifact; reserve room below GitHub's 1 MiB summary limit.
            head -c 900000 "$report" >> "$GITHUB_STEP_SUMMARY"
            if test "$(wc -c < "$report")" -gt 900000; then
              printf '\n\nSummary truncated. Download the SQLite contention artifact for the complete report.md and warning decisions.\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sqlite-contention-${{ github.sha }}
          path: |
            ${{ runner.temp }}/sqlite-contention/*.json
            ${{ runner.temp }}/sqlite-contention/*.log
            ${{ runner.temp }}/sqlite-contention/*.md
            ${{ runner.temp }}/sqlite-contention/*.strace
            ${{ runner.temp }}/sqlite-contention/*.trace
          retention-days: 14
          if-no-files-found: error

  reader-contention:
    if: inputs.reader_baseline != ''
    name: SQLite reader contention probe
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GOMAXPROCS: 4
      READER_BASE_SHA: ${{ inputs.reader_baseline }}
      READER_HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Go
        uses: ./.github/actions/setup-go
      - name: Check out the comparison baseline
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.reader_baseline }}
          path: baseline
          persist-credentials: false
      - name: Build identical reader probes against both commits
        run: |
          cp internal/store/sqlite_reader_contention_test.go baseline/internal/store/
          go test -c -p 2 -o "$RUNNER_TEMP/reader-head" ./internal/store
          (
            cd baseline
            go test -c -p 2 -o "$RUNNER_TEMP/reader-base" ./internal/store
          )
      - name: Measure reader latency and driver mutexes
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/sqlite-reader-contention"
          mkdir -p "$out"
          printf 'base=%s\nhead=%s\nlogical_cpus=%s\nGOMAXPROCS=%s\n' \
            "$READER_BASE_SHA" "$READER_HEAD_SHA" "$(nproc)" "$GOMAXPROCS" > "$out/commits.txt"
          for trial in 1 2 3; do
            if (( trial % 2 )); then
              versions=(base head)
              modes=(indexed scan)
            else
              versions=(head base)
              modes=(scan indexed)
            fi
            for version in "${versions[@]}"; do
              for mode in "${modes[@]}"; do
                "$RUNNER_TEMP/reader-$version" -test.v -test.run '^TestSQLiteReaderContention$' \
                  -sqlite-reader-mode="$mode" | tee "$out/$version-$mode-$trial.txt"
              done
            done
          done
          for version in base head; do
            for mode in indexed scan; do
              binary="$RUNNER_TEMP/reader-$version"
              label="$version-$mode"
              prefix="$out/$label"
              "$binary" -test.v -test.run '^TestSQLiteReaderContention$' \
                -sqlite-reader-mode="$mode" -sqlite-reader-profile-prefix="$prefix" | tee "$prefix-profile.txt"
              go tool pprof -top -nodecount=10 "$binary" "$prefix.mutex.pb.gz" > "$prefix-top.txt"
              go tool pprof -top -cum -nodecount=10 -focus='pcache1' -show='pcache1|lib.mutexLeave$' \
                "$binary" "$prefix.mutex.pb.gz" > "$prefix-pcache.txt"
              go tool pprof -top -cum -nodecount=10 -show='modernc.org/libc.X(malloc|free)$' \
                "$binary" "$prefix.mutex.pb.gz" > "$prefix-allocator.txt"
              go tool pprof -top -cum -nodecount=15 -focus='measureReaderProbeOtherFiles' \
                -show='pcache1|libc.X(malloc|free)$' "$binary" "$prefix.block.pb.gz" > "$prefix-other-file-waits.txt"
            done
          done
      - name: Publish reader probe samples
        if: always()
        shell: bash
        run: |
          for report in "$RUNNER_TEMP"/sqlite-reader-contention/*.txt; do
            test -f "$report" || continue
            printf '\n### %s\n\n```text\n' "$(basename "$report")" >> "$GITHUB_STEP_SUMMARY"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sqlite-reader-contention-${{ github.sha }}
          path: ${{ runner.temp }}/sqlite-reader-contention/
          retention-days: 14
          if-no-files-found: error
