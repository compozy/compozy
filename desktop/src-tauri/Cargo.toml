[package]
name = "compozyos-desktop"
version = "0.3.0"
description = "Native CompozyOS desktop shell"
edition = "2024"
rust-version = "1.89"
license = "BSL-1.1"
publish = false

[build-dependencies]
serde_json = "1"
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
atomicwrites = "0.4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
flate2 = "1"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
libc = "0.2"
log = "0.4"
minisign-verify = "0.2.5"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "blocking",
  "json",
  "rustls-tls",
] }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
sysinfo = "0.37"
tar = "0.4"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-deep-link = "=2.4.9"
tauri-plugin-log = "=2.9.0"
tauri-plugin-opener = "=2.5.4"
tauri-plugin-single-instance = { version = "=2.4.3", features = ["deep-link"] }
tauri-plugin-updater = "=2.10.1"
tauri-plugin-window-state = "=2.4.1"
thiserror = "2"
toml = "0.9"
url = { version = "2", features = ["serde"] }
which = "8"
zip = { version = "4", default-features = false, features = ["deflate"] }
tauri-plugin-clipboard-manager = "=2.3.2"
fs2 = "0.4"

[dev-dependencies]
jsonschema = "0.37"
minisign = "0.7"
tauri = { version = "=2.11.5", features = ["test"] }
tempfile = "3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "compozyos-desktop"
path = "src/main.rs"

[[bin]]
name = "compozy-runtime-manifest-check"
path = "src/bin/runtime_manifest_check.rs"
