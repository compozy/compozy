appId: com.compozy.os
productName: CompozyOS
asar: true
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
directories:
  output: .artifacts/builder
  buildResources: build
files:
  - dist/main.cjs
  - dist/main.cjs.map
  - dist/boot-preload.cjs
  - dist/boot-preload.cjs.map
  - package.json
extraResources:
  - from: dist/pages
    to: pages
  - from: .artifacts/runtime
    to: runtime
protocols:
  - name: CompozyOS
    schemes:
      - compozyos
mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  icon: build/icon.icns
  notarize: false
  target:
    - dmg
    - zip
linux:
  category: Development
  executableName: compozyos
  icon: build/icon.png
  syncDesktopName: true
  target:
    - AppImage
    - deb
artifactName: CompozyOS-${version}-${os}-${arch}.${ext}
publish:
  provider: generic
  url: https://raw.githubusercontent.com/compozy/compozy/channel-beta/desktop/
