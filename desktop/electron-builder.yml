appId: com.compozy.os
productName: CompozyOS
asar: true
files:
  - dist/main.cjs
  - dist/main.cjs.map
  - dist/boot-preload.cjs
  - dist/boot-preload.cjs.map
  - package.json
extraResources:
  - from: dist/pages
    to: pages
  - from: .artifacts/runtime
    to: runtime
protocols:
  - name: CompozyOS
    schemes:
      - compozyos
mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  icon: src-tauri/icons/icon.icns
  target:
    - dir
    - zip
linux:
  category: Development
  icon: src-tauri/icons/icon.png
  target:
    - AppImage
artifactName: CompozyOS-${version}-${os}-${arch}.${ext}
publish:
  provider: generic
  url: https://raw.githubusercontent.com/compozy/compozy/channel-beta/desktop/
