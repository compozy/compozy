sidecar: git@github.com:compozy/specs.git
settings:
  guardrails:
    max_files: 10000
    max_bytes: 209715200
  hooks:
    pre_push_timeout: 30s
    allow_skip_env: SKEEPER_SKIP
namespaces:
  - name: agh
    patterns:
      - .compozy/tasks/**/*
      - docs/rfcs/**
      - docs/_refacs/**
      - docs/prs/**
      - docs/ideas/**
      - docs/proposals/**
      - .codex/ledger/**
      - .codex/plans/**
      - .codex/loop/**
      - .codex/qa/**
      - .compozy/_archived/**
      - .compozy/_research/**
      - docs/qa/evidence/**
      - docs/tweets/**
