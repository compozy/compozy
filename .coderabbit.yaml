language: "en"
early_access: true

reviews:
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: true
  profile: "chill"
  auto_review:
    base_branches:
      - "stack/.*"
  path_filters:
    - "!docs/design/**/*"
    - "!**/*.md"
    - "!**/*.mdx"
    - "!**/*.yaml"
    - "!**/*.yml"
    - "!**/*.json"
    - "!**/*.toml"
    - "!**/*.xml"
    - "!**/*.mdc"
    - "!**/*.lock"
    - "!**/*.sum"
    - "!.cursor/**"
    - "!.git/**"
    - "!.claude/**"
    - "!.codex/**"
    - "!.compozy/**"
    - "!.vscode/**"
    - "!.agents/**"
    - "!.taskmaster/**"
    - "!**/fixtures/**"
    - "!test/testdata/**"
    # Generated / binary artifacts — gated by `make codegen-check`, not line-reviewable
    - "!**/generated/**"
    - "!**/*.d.ts"
    - "!**/*.gz"
    # Storybook fixtures + Playwright harness — verified by capture/e2e, not code review
    - "!**/*.stories.tsx"
    - "!web/e2e/**"
  path_instructions:
    - path: "**/*.go"
      instructions: |-
        For Go documentation findings, name each affected function with its file,
        line and receiver (for methods), and quote any existing attached Go comment.
        Distinguish production functions, test entry points, benchmarks and helpers.
        Explain why the existing comment is insufficient before suggesting a change.
        When explaining Docstring Coverage, list the analyzed functions and their
        covered/uncovered classification if analyzer evidence is available. Otherwise
        state that the analyzed set is unavailable; label manual estimates separately
        and do not infer an analyzer false positive from the aggregate percentage.
        Prefer concise comments explaining contracts, invariants or lifecycle intent;
        do not add boilerplate that merely restates a function name to raise coverage.
    - path: "**/*_test.go"
      instructions: |-
        # Test Review Requirements

        ## Critical Patterns to ENFORCE:
        - MUST use t.Run("Should...") pattern for ALL test cases
        - MUST test meaningful business logic, not trivial operations
        - MUST have specific error assertions (ErrorContains, ErrorAs)
        - MUST avoid redundant validation tests across packages

        ## Anti-Patterns to REJECT:
        - Constructor tests that only check != nil
        - Getter/setter tests without business logic
        - Tests with 90% mock setup, 10% actual testing
        - Weak assertions like assert.Error(t, err) without message validation
        - Tests that verify Go standard library functionality
        - Duplicate test scenarios across packages

        ## Must Check:
        - Focus on critical paths: workflow execution, state management, error handling
        - Verify tests can fail when business logic changes
        - Check for shared test utilities usage to avoid duplication
        - Ensure tests verify behavior outcomes, not just function calls
