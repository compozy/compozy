[defaults]
ide = 'codex'
model = 'gpt-5.6-sol'
reasoning_effort = 'max'

# Allowed task frontmatter types. Extends the built-in defaults with the QA pair
# phase types required by cy-tasks-tail-qa-pair (used by marketplace + os-shell suites).
[tasks]
types = [
  'frontend',
  'backend',
  'docs',
  'test',
  'infra',
  'refactor',
  'chore',
  'bugfix',
  'qa-report',
  'qa-execution',
]

# Per-type model routing for `compozy tasks run` (ExecutionModePRDTasks).
# The task's frontmatter `type:` selects the rule; unmatched types fall back to [defaults].
# Note: ignored by `compozy exec` (type selector is cleared in non-PRD modes).
[tasks.run]

[[tasks.run.task_runtime_rules]]
type = 'frontend'
ide = 'claude'
model = 'opus'
reasoning_effort = 'max'

[[tasks.run.task_runtime_rules]]
type = 'docs'
ide = 'claude'
model = 'opus'
reasoning_effort = 'xhigh'

[[tasks.run.task_runtime_rules]]
type = 'backend'
ide = 'codex'
model = 'gpt-5.6-sol'
reasoning_effort = 'max'
