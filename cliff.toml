# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""

body = """
{% if version %}
## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}

### {{ group | upper_first }}

{% for commit in commits | filter(attribute="scope") | sort(attribute="scope") -%}
- *({{ commit.scope }})* {{ commit.message | upper_first }}
{% if commit.breaking -%}
  - **BREAKING:** {{ commit.breaking_description }}
{% endif -%}
{% endfor -%}
{% for commit in commits -%}
{% if not commit.scope -%}
- {{ commit.message | upper_first }}
{% if commit.breaking -%}
  - **BREAKING:** {{ commit.breaking_description }}
{% endif -%}
{% endif -%}
{% endfor %}
{% endfor %}
"""

footer = """
{% for release in releases -%}
{% if release.version and release.previous and release.previous.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/compozy/compozy/compare/{{ release.previous.version }}...{{ release.version }}
{% elif release.version -%}
[{{ release.version | trim_start_matches(pat="v") }}]: https://github.com/compozy/compozy/releases/tag/{{ release.version }}
{% elif release.previous and release.previous.version -%}
[unreleased]: https://github.com/compozy/compozy/compare/{{ release.previous.version }}...HEAD
{% endif -%}
{% endfor %}

---

_Generated by [git-cliff](https://git-cliff.org)_
"""

trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false

commit_preprocessors = [{ pattern = '  +', replace = " " }]

commit_parsers = [
  # v0.3 is a hard product-line cut. These commits remain owned by
  # legacy/v0.2 and must not be attributed to CompozyOS releases from main.
  { sha = "00dba6a1c32bc4a032b177961919578b62d62b1f", skip = true },
  { sha = "c202311c8430fc0d4a7442e2dc715cabfbdc68a1", skip = true },
  { sha = "f2f2cf8c2f4b526f726878fcbb732de5ce955ee9", skip = true },

  # Release notes describe product behavior, not repository maintenance.
  { message = "^docs(?:\\([^)]*\\))?!?:", skip = true },
  { message = "^build(?:\\([^)]*\\))?!?:", skip = true },
  { message = "^ci(?:\\([^)]*\\))?!?:", skip = true },

  { message = "^feat", group = "🎉 Features" },
  { message = "^feature", group = "🎉 Features" },

  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^bugfix", group = "🐛 Bug Fixes" },

  { message = "^perf", group = "⚡ Performance Improvements" },

  { message = "^security", group = "🔒 Security" },

  { message = "^refactor", group = "♻️ Refactoring" },

  { message = "^test", group = "🧪 Testing" },

  { message = "^deps", group = "📦 Dependencies" },
  { message = "^chore\\(deps\\)", group = "📦 Dependencies" },

  { message = "^style", group = "💅 Style" },

  { message = "^release:", skip = true },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore", group = "🔧 Miscellaneous Tasks" },

  { message = "^revert", group = "⏪ Reverts" },

  { message = "^Merge branch", skip = true },
  { message = "^Merge pull request", skip = true },
  { message = "^Merge remote-tracking branch", skip = true },
  { message = "^wip", skip = true },
  { message = "^WIP", skip = true },

  { message = ".*", group = "Other Changes" },
]

protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
# Prerelease tags are snapshots of the in-flight line: keep them out of
# changelog sections and version bumping (the next stable owns their commits).
ignore_tags = "v[0-9].*-(alpha|beta|rc)"
sort_commits = "oldest"

[bump]
# Alpha convention: features bump patch on 0.x.x
features_always_bump_minor = false
# Alpha convention: breaking changes bump minor on 0.x.x
breaking_always_bump_major = false

initial_tag = "v0.0.2"

custom_major_increment_regex = "MAJOR|BREAKING[- ]CHANGE"
custom_minor_increment_regex = "feat|feature|MINOR"
