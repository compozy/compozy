version: "2"

run:
  build-tags:
    - ""
  issues-exit-code: 1
  tests: true
  timeout: 10m

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - forbidigo
    - copyloopvar
    - dogsled
    - errcheck
    - funlen
    - gochecknoinits
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - modernize
    - nakedret
    - noctx
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    depguard:
      rules:
        modern-go-root:
          files:
            - "${config-path}/**/*.go"
            - "!${config-path}/sdk/**/*.go"
            - "!${config-path}/internal/extension/testdata/**/*.go"
          deny:
            - pkg: github.com/google/uuid
              desc: Use stdlib uuid.NewV4().String() (stdlib_uuid, Go 1.27).
    forbidigo:
      analyze-types: true
      exclude-godoc-examples: false
      forbid:
        - pattern: '^sort\.(Strings|Ints|Float64s|Slice|SliceStable|Sort|Stable)$'
          pkg: "^sort$"
          msg: Use slices.Sort, SortFunc or SortStableFunc, preserving ordering (slices_sort/slices_sort_func).
        - pattern: '^errors\.As$'
          pkg: "^errors$"
          msg: Use errors.AsType with the same target type (errors_as_type).
    errcheck:
      check-type-assertions: true
      check-blank: true
      # AsType returns a matched error value, not an operation failure.
      exclude-functions:
        - errors.AsType
    funlen:
      lines: 80
      statements: 60
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - performance
        - style
        - experimental
        - diagnostic
      disabled-tags:
        - opinionated
      settings:
        hugeParam:
          sizeThreshold: 512
        rangeValCopy:
          sizeThreshold: 512
    gocyclo:
      min-complexity: 20
    lll:
      line-length: 120
    misspell:
      locale: US
    unparam:
      check-exported: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Declarative tooling/fixture tables keep literal paths and schema keys readable.
      - linters: [goconst]
        path: "(^magefiles/|^internal/extension/testdata/[^/]+-fixture-go/)"
      # Boundary tables and the linear release transaction are deliberately kept together.
      - linters: [funlen]
        path: '^magefiles/(boundaries|web_assets_publish)\.go$'
      - linters: [gocyclo]
        path: '^magefiles/boundaries\.go$'
      # Tooling paths are supplied by the repository/operator, not untrusted runtime input.
      - linters: [gosec]
        path: "^magefiles/"
        text: "G(101|122|306|703):"
      - linters:
          - dupl
          - errcheck
          - funlen
          - gocyclo
          - gosec
          - lll
          - unparam
        path: _test\.go
      - linters:
          - gochecknoinits
          - goconst
        path: _test\.go
      - linters:
          - gocritic
        text: unnecessaryDefer
      - linters:
          - lll
        source: "//\t@"
      - linters:
          - lll
        source: "`.*`"
      - linters:
          - lll
        source: "^// @"
      - linters:
          - errcheck
        path: mock_.*\.go$
    paths:
      - third_party$
      - builtin$
      - \.old_project

formatters:
  enable:
    - gofmt
    - goimports
    - golines
  settings:
    gofmt:
      rewrite-rules:
        - pattern: "interface{}"
          replacement: "any"
    golines:
      max-len: 120

  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - \.old_project

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
