global:
  scrape_interval: 15s

# OTLP push from the collector: keep service.name/instance as labels so dashboards can filter.
otlp:
  promote_resource_attributes:
    - service.name
    - service.namespace
    - service.instance.id
    - service.version
  keep_identifying_resource_attributes: true

storage:
  tsdb:
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: otel-collector
    static_configs: [{ targets: ["collector:8888"] }]
  - job_name: tempo
    static_configs: [{ targets: ["tempo:3200"] }]
  - job_name: loki
    static_configs: [{ targets: ["loki:3100"] }]
