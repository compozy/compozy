<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AGH OS v2 — shell + existing routes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="os-v2.css">
<link rel="stylesheet" href="os-v2-apps.css">
</head>
<body data-wallpaper="ember" data-motion="full">
<div class="os" id="os" data-od-id="agh-os-v2">

  <!-- ============ MENU BAR (net-new shell) ============ -->
  <header class="menubar" data-od-id="menu-bar" aria-label="System bar">
    <div class="mb-side">
      <button class="mb-logo" id="logoBtn" aria-label="AGH" data-od-id="menu-logo">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="13" height="13" rx="4" fill="currentColor"/><circle cx="8" cy="8" r="2.6" class="mb-logo-dot"/></svg>
      </button>
      <button class="ws-trigger" id="wsTrigger" data-od-id="workspace-trigger" aria-haspopup="true" aria-expanded="false">
        <span class="ws-avatar mono" id="wsAvatar">AG</span>
        <span class="ws-name" id="wsName">agh</span>
        <svg class="chevrons" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 6.2 8 3.4l3 2.8M5 9.8l3 2.8 3-2.8" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <nav class="mb-menus" data-od-id="menu-actions" aria-label="Menus">
        <button class="mb-menu" data-menu="session">Session</button>
        <button class="mb-menu" data-menu="view">View</button>
        <button class="mb-menu" data-menu="help">Help</button>
      </nav>
    </div>
    <div class="mb-side mb-right">
      <button class="mb-icon" id="bellBtn" aria-label="Approvals" data-od-id="menu-approvals" aria-haspopup="true">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3.2a4.6 4.6 0 0 0-4.6 4.6c0 3.4-1.2 4.6-1.9 5.2h13c-.7-.6-1.9-1.8-1.9-5.2A4.6 4.6 0 0 0 10 3.2ZM8.3 15.6a1.8 1.8 0 0 0 3.4 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="badge" id="bellBadge">2</span>
      </button>
      <button class="mb-chip mb-cmdk" id="cmdkBtn" data-od-id="menu-command" title="Command palette">
        <span class="mono">⌘K</span>
      </button>
      <button class="mb-icon" id="settingsBtn" aria-label="Settings" data-od-id="menu-settings" title="Settings">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.7 3.2a1.4 1.4 0 0 1 2.6 0l.3.8a1.4 1.4 0 0 0 1.85.84l.8-.32a1.4 1.4 0 0 1 1.83 1.83l-.32.8a1.4 1.4 0 0 0 .84 1.85l.8.3a1.4 1.4 0 0 1 0 2.6l-.8.3a1.4 1.4 0 0 0-.84 1.85l.32.8a1.4 1.4 0 0 1-1.83 1.83l-.8-.32a1.4 1.4 0 0 0-1.85.84l-.3.8a1.4 1.4 0 0 1-2.6 0l-.3-.8a1.4 1.4 0 0 0-1.85-.84l-.8.32a1.4 1.4 0 0 1-1.83-1.83l.32-.8a1.4 1.4 0 0 0-.84-1.85l-.8-.3a1.4 1.4 0 0 1 0-2.6l.8-.3a1.4 1.4 0 0 0 .84-1.85l-.32-.8A1.4 1.4 0 0 1 5.75 4.5l.8.32a1.4 1.4 0 0 0 1.85-.84z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><circle cx="10" cy="10" r="2.5" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
    </div>
  </header>

  <!-- ============ DESKTOP ============ -->
  <main class="desktop" id="desktop" data-od-id="desktop">
    <div class="win-layer" id="winLayer"></div>
    <p class="desk-hint" id="deskHint" hidden data-od-id="desktop-hint"><span class="dh-desktop"><kbd class="mono">⌘K</kbd> to open anything — or pick a surface from the dock</span><span class="dh-mobile">Pick a surface from the tab bar below</span></p>
  </main>

  <!-- ============ DOCK (net-new shell) ============ -->
  <div class="dock-zone" data-od-id="dock-zone">
    <span class="dock-flex dock-flex-l" aria-hidden="true"></span>
    <nav class="dock-seg dock" id="dock" aria-label="Dock" data-od-id="dock"></nav>
    <div class="dock-seg dock-actions">
      <button class="dock-new" id="dockNew" data-od-id="dock-new-session" aria-label="New session" title="New session">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
    </div>
    <span class="dock-flex dock-flex-r" aria-hidden="true"></span>
  </div>

  <!-- ============ POPOVERS ============ -->
  <div class="popover ws-pop" id="wsPop" hidden data-od-id="workspace-popover">
    <p class="pop-eyebrow">Workspaces</p>
    <ul class="ws-list" id="wsList"></ul>
    <div class="pop-sep"></div>
    <button class="pop-item" id="wsAdd">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.5v9M3.5 8h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Add workspace
    </button>
    <button class="pop-item" id="wsSpaces">
      <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="3" width="5.2" height="10" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="8.8" y="3" width="5.2" height="10" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      Spaces overview <kbd class="mono">⇧⌘S</kbd>
    </button>
  </div>

  <div class="popover menu-pop" id="menuPop" hidden></div>

  <div class="popover bell-pop" id="bellPop" hidden data-od-id="approvals-panel">
    <p class="pop-eyebrow">Approvals</p>
    <div class="att" id="bellList"></div>
    <p class="pop-empty" id="bellEmpty" hidden>Nothing waiting on you.</p>
  </div>

  <!-- ============ OVERLAYS ============ -->
  <div class="overlay palette-overlay" id="paletteOverlay" hidden data-od-id="command-palette">
    <div class="palette" role="dialog" aria-label="Command palette">
      <div class="palette-head">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m13 13 3.4 3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input id="paletteInput" placeholder="Search apps, sessions, actions…" aria-label="Command search" autocomplete="off" spellcheck="false">
        <kbd class="mono">esc</kbd>
      </div>
      <div class="palette-results" id="paletteResults"></div>
    </div>
  </div>

  <div class="overlay spaces-overlay" id="spacesOverlay" hidden data-od-id="spaces-overview">
    <h2 class="spaces-title">Spaces</h2>
    <p class="spaces-sub">Each workspace is a space — windows stay where you left them.</p>
    <div class="spaces-row" id="spacesRow"></div>
  </div>

  <div class="toasts" id="toasts" data-od-id="notifications" aria-live="polite"></div>
</div>

<!-- ============ WINDOW CHROME ============
     Unified 44px head (pagehead-redesign): controls, quiet glyph +
     title, drag flex, status + at most 2 actions. Optional 38px
     context strip for filters / search / Rows|Cards. Identity once. -->
<template id="tpl-window">
  <section class="win" role="dialog" tabindex="-1">
    <header class="win-head" data-win-head>
      <div class="win-controls">
        <button class="wc wc-close" aria-label="Close window"></button>
        <button class="wc wc-min" aria-label="Minimize window"></button>
        <button class="wc wc-zoom" aria-label="Zoom window"></button>
      </div>
      <div class="w2-id" data-win-id>
        <span class="w2-glyph" data-win-glyph aria-hidden="true"></span>
        <button class="w2-back" data-win-back aria-label="Back" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m9.5 3.5-4.2 4.5 4.2 4.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="w2-crumb" data-win-crumb hidden></button>
        <span class="w2-sep" data-win-sep hidden>/</span>
        <span class="w2-title" data-win-title></span>
        <span class="w2-count mono" data-win-count hidden></span>
      </div>
      <span class="w2-flex" data-win-drag aria-hidden="true"></span>
      <div class="win-trail" data-win-trail></div>
    </header>
    <div class="win-toolbar" data-win-toolbar hidden></div>
    <div class="win-body"></div>
  </section>
</template>

<!-- ============ APP: DASHBOARD — reuses dashboard route ============ -->
<template id="tpl-app-dashboard">
  <div class="app">
    <div class="kpis">
      <div class="kpi"><span class="kpi__v mono">34</span><span class="kpi__l">runs today</span></div>
      <div class="kpi"><span class="kpi__v mono">92%</span><span class="kpi__l">success</span></div>
      <div class="kpi"><span class="kpi__v mono">$4.12</span><span class="kpi__l">cost today</span></div>
      <div class="kpi"><span class="kpi__v mono">3</span><span class="kpi__l">active sessions</span></div>
    </div>
    <section class="panel">
      <header class="panel-h"><h3>Working now</h3><span class="livebadge"><span class="d d--run d--pulse"></span>live</span></header>
      <div class="runcards" data-runcards></div>
    </section>
    <section class="panel">
      <header class="panel-h"><h3>Outcomes</h3><span class="prov">task runs · last 14 days</span></header>
      <div class="bars" data-bars></div>
    </section>
  </div>
</template>

<!-- ============ APP: SESSIONS — sidebar-sessions-02 as a normal window ============ -->
<template id="tpl-app-sessions">
  <div class="app app-sessions" data-od-id="app-sessions">
    <div class="app-toolbar" data-hoist-toolbar>
      <label class="field field-search session-search__field">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m13 13 3.4 3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input placeholder="Filter sessions…" aria-label="Filter sessions" data-sr-filter autocomplete="off">
      </label>
    </div>
    <div class="sr-track" data-sr-track data-view="recent">
      <div class="sr-pane" data-sr-recent></div>
      <div class="sr-pane" data-sr-all></div>
    </div>
  </div>
</template>

<!-- ============ APP: SESSION (LIVE) — document window; status lives in head ============ -->
<template id="tpl-app-session">
  <div class="app app-session">
    <div class="transcript" data-transcript>
      <div class="msg msg-user">
        <p class="msg-role">Pedro</p>
        <p class="msg-text">Polish the checkout flow — the coupon field is misaligned on mobile and the pay button loses its focus ring.</p>
      </div>
      <div class="msg msg-agent">
        <p class="msg-role">webgen</p>
        <p class="msg-text">Found both. The coupon field ignores the 8px grid below 430px, and the focus ring is clipped by an <code>overflow: hidden</code> on the button row. Fixing the grid first.</p>
      </div>
      <div class="toolcall" data-toolcall>
        <button class="toolcall-head" aria-expanded="false">
          <svg class="tc-caret" viewBox="0 0 12 12" aria-hidden="true"><path d="m4 2.5 4 3.5-4 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="mono tc-name">Edit</span>
          <span class="mono tc-file">web/src/routes/checkout.tsx</span>
          <span class="mono tc-diff"><em class="add">+42</em> <em class="del">−7</em></span>
        </button>
        <pre class="toolcall-body mono" hidden><span class="del">−  gap: 7px;</span>
<span class="add">+  gap: var(--space-2); /* 8px grid */</span>
<span class="ctx">   align-items: stretch;</span></pre>
      </div>
      <div class="msg msg-agent msg-streaming">
        <p class="msg-role">webgen</p>
        <p class="msg-text">Grid aligned at 390 and 430px. Now removing the clipping wrapper so the ring can render — then I'll re-run the visual pass<span class="caret"></span></p>
      </div>
    </div>
    <form class="composer" data-composer>
      <input placeholder="Reply to webgen…" aria-label="Reply to agent">
      <button type="submit" class="btn btn--primary composer-send" aria-label="Send">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 10h12M11 5.5 16.5 10 11 14.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </form>
  </div>
</template>

<!-- ============ APP: TASKS — listing tools hoist into the 38px context strip ============ -->
<template id="tpl-app-tasks">
  <div class="app" data-view="rows">
    <div class="app-toolbar" data-hoist-toolbar>
      <div class="pill-group" role="group" aria-label="Task filter">
        <button class="pill-group__item is-on" data-tfilter="all">All <span class="mono">6</span></button>
        <button class="pill-group__item" data-tfilter="running">Running <span class="mono">2</span></button>
        <button class="pill-group__item" data-tfilter="needs">Needs you <span class="mono">1</span></button>
      </div>
      <span class="w2-flex" aria-hidden="true"></span>
      <div class="pill-group" role="group" aria-label="View mode">
        <button class="pill-group__item is-on" data-tview="rows">Rows</button>
        <button class="pill-group__item" data-tview="cards">Cards</button>
      </div>
    </div>
    <ul class="list" data-task-rows></ul>
    <div class="listing-card-grid" data-task-cards hidden></div>
  </div>
</template>

<!-- ============ APP: AGENTS — reuses agents-list route ============ -->
<template id="tpl-app-agents">
  <div class="app">
    <ul class="list" data-agent-rows></ul>
  </div>
</template>

<!-- ============ APP: MARKETPLACE — kind + search in context strip; scope tabs stay content ============ -->
<template id="tpl-app-marketplace">
  <div class="app">
    <div class="app-toolbar" data-hoist-toolbar>
      <div class="pill-group" role="group" aria-label="Catalog kind">
        <button class="pill-group__item is-on" data-kind="skill">Skills</button>
        <button class="pill-group__item" data-kind="mcp">MCPs</button>
        <button class="pill-group__item" data-kind="extension">Extensions</button>
        <button class="pill-group__item" data-kind="bundle">Bundles</button>
      </div>
      <span class="w2-flex" aria-hidden="true"></span>
      <div class="field field-search">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="5.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m13 13 3.4 3.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <input placeholder="Search catalog…" aria-label="Search catalog" data-mkt-filter>
      </div>
    </div>
    <div class="tabbar" role="tablist" aria-label="Marketplace scope">
      <button class="tab is-on" role="tab" aria-selected="true" data-scope="marketplace">Marketplace</button>
      <button class="tab" role="tab" aria-selected="false" data-scope="installed">Installed <span class="mono" data-installed-count>3</span></button>
    </div>
    <div class="listing-card-grid mkt-grid" data-mkt-grid></div>
  </div>
</template>

<!-- ============ APP: LOOPS — reuses loops route ============ -->
<template id="tpl-app-loops">
  <div class="app">
    <ul class="list" data-loop-rows></ul>
  </div>
</template>

<!-- ============ APP: JOBS — reuses jobs route ============ -->
<template id="tpl-app-jobs">
  <div class="app">
    <ul class="list" data-job-rows></ul>
  </div>
</template>

<!-- ============ APP: TRIGGERS — reuses triggers route ============ -->
<template id="tpl-app-triggers">
  <div class="app">
    <ul class="list" data-trigger-rows></ul>
  </div>
</template>

<!-- ============ APP: BRIDGES — reuses bridges route ============ -->
<template id="tpl-app-bridges">
  <div class="app">
    <p class="app-note">Bridges expose this daemon to external surfaces — editors, chat apps, launchers — over the SDK and UDS.</p>
    <ul class="list" data-bridge-rows></ul>
  </div>
</template>

<!-- ============ APP: KNOWLEDGE — reuses knowledge route ============ -->
<template id="tpl-app-knowledge">
  <div class="app">
    <ul class="list" data-knowledge-rows></ul>
  </div>
</template>

<!-- ============ APP: SANDBOX — Rows|Cards in context strip ============ -->
<template id="tpl-app-sandbox">
  <div class="app" data-view="rows">
    <div class="app-toolbar" data-hoist-toolbar>
      <span class="toolbar-meta mono" data-sb-count>3 profiles</span>
      <span class="w2-flex" aria-hidden="true"></span>
      <div class="pill-group" role="group" aria-label="View mode">
        <button class="pill-group__item is-on" data-sbview="rows">Rows</button>
        <button class="pill-group__item" data-sbview="cards">Cards</button>
      </div>
    </div>
    <ul class="list" data-sb-rows></ul>
    <div class="listing-card-grid" data-sb-cards hidden></div>
  </div>
</template>

<!-- ============ APP: NETWORK — Healthy chip lives in the window head trail ============ -->
<template id="tpl-app-network">
  <div class="app">
    <div class="net-head">
      <div>
        <h3>agh-mesh</h3>
        <p class="prov">4 peers · gossip healthy · last sync 12s ago</p>
      </div>
    </div>
    <ul class="list" data-peer-rows></ul>
    <section class="panel">
      <header class="panel-h"><h3>Network budget</h3><span class="prov mono">$1.9 of $5 · resets Mon</span></header>
      <div class="meter"><span class="meter-fill" style="width:38%"></span></div>
    </section>
  </div>
</template>

<!-- ============ APP: VAULT — reuses vault route ============ -->
<template id="tpl-app-vault">
  <div class="app">
    <p class="app-note">Secrets are encrypted at rest. Agents receive them as bound references — never raw values.</p>
    <ul class="list" data-secret-rows></ul>
  </div>
</template>

<!-- ============ APP: SETTINGS — reuses settings routes ============ -->
<template id="tpl-app-settings">
  <div class="app app-settings">
    <nav class="set-nav" aria-label="Settings sections">
      <button class="set-nav-item is-on" data-pane="general">General</button>
      <button class="set-nav-item" data-pane="appearance">Appearance</button>
      <button class="set-nav-item" data-pane="providers">Providers</button>
    </nav>
    <div class="set-panes">
      <section class="set-pane" data-pane-id="general">
        <div class="set-row">
          <div class="set-copy"><h4>Confirm shell commands</h4><p>Agents ask before running anything outside the sandbox.</p></div>
          <button class="switch is-on" role="switch" aria-checked="true" aria-label="Confirm shell commands"><span class="knob"></span></button>
        </div>
        <div class="set-row">
          <div class="set-copy"><h4>Default agent</h4><p>Used when a new session doesn't specify one.</p></div>
          <span class="value-chip"><span class="agent-chip mono">WG</span>webgen</span>
        </div>
        <div class="set-row">
          <div class="set-copy"><h4>Daemon</h4><p>Local runtime this desktop is attached to.</p></div>
          <span class="value-chip mono">127.0.0.1:2123</span>
        </div>
      </section>
      <section class="set-pane" data-pane-id="appearance" hidden>
        <div class="set-row">
          <div class="set-copy"><h4>Wallpaper</h4><p>Applies to the current space.</p></div>
          <div class="wp-picker" role="group" aria-label="Wallpaper">
            <button class="wp wp-ember" data-wp="ember" aria-label="Ember"></button>
            <button class="wp wp-mesh" data-wp="mesh" aria-label="Mesh"></button>
            <button class="wp wp-carbon" data-wp="carbon" aria-label="Carbon"></button>
          </div>
        </div>
        <div class="set-row">
          <div class="set-copy"><h4>Dock magnification</h4><p>Icons grow as the pointer approaches.</p></div>
          <button class="switch is-on" role="switch" aria-checked="true" data-set="magnify" aria-label="Dock magnification"><span class="knob"></span></button>
        </div>
        <div class="set-row">
          <div class="set-copy"><h4>Reduce motion</h4><p>Disables window and dock animation.</p></div>
          <button class="switch" role="switch" aria-checked="false" data-set="motion" aria-label="Reduce motion"><span class="knob"></span></button>
        </div>
      </section>
      <section class="set-pane" data-pane-id="providers" hidden>
        <div class="set-row">
          <div class="set-copy"><h4>Anthropic</h4><p class="mono">claude-fable-5 · claude-opus-4-8</p></div>
          <span class="status-pill status-ok"><span class="d d--ok"></span>Connected</span>
        </div>
        <div class="set-row">
          <div class="set-copy"><h4>OpenRouter</h4><p class="mono">glm-5.2 · hermes-4</p></div>
          <span class="status-pill status-ok"><span class="d d--ok"></span>Connected</span>
        </div>
        <div class="set-row">
          <div class="set-copy"><h4>fal</h4><p>No key configured for this workspace.</p></div>
          <button class="btn">Add key</button>
        </div>
      </section>
    </div>
  </div>
</template>

<script src="os-v2.js"></script>
</body>
</html>
