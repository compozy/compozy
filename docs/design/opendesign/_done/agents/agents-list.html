<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agents · AGH</title>
<link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    color-scheme: dark;
    --rail:#0c0b0b; --canvas:#131211; --canvas-soft:#1a1918; --canvas-tint:#1c1b1a; --elevated:#232220;
    --fg:#ececef; --fg-strong:#f6f6f8; --muted:#9a9a9f; --subtle:#76767c; --faint:#545458;
    --line:rgba(255,255,255,.055); --line-soft:rgba(255,255,255,.03); --line-strong:rgba(255,255,255,.09);
    --accent:#e8572a; --accent-hover:#d14e25; --accent-strong:#f6874f; --accent-ink:#17110f;
    --accent-tint:rgba(232,87,42,.10); --accent-dim:rgba(232,87,42,.24);
    --success:#5fbf85; --success-tint:rgba(95,191,133,.08);
    --warning:#d6a647; --warning-tint:rgba(214,166,71,.08);
    --danger:#e0635a;  --danger-tint:rgba(224,99,90,.09);
    --info:#8e8eb5;    --info-tint:rgba(142,142,181,.12);
    --neutral:#7a7a80; --neutral-tint:rgba(150,150,155,.06);
    --row-hover:rgba(255,255,255,.022); --row-selected:rgba(255,255,255,.03);
    --input-fill:rgba(255,255,255,.025); --badge-fill:rgba(255,255,255,.05);
    --btn-fill:rgba(255,255,255,.04); --btn-hover:rgba(255,255,255,.07);
    --surface-glaze:rgba(255,255,255,.04);
    --radius-xs:4px; --radius-sm:5px; --radius:6px; --radius-md:8px; --radius-lg:10px; --radius-pill:9999px;
    --font-sans:"Inter Variable","Inter",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    --font-mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;
    --dur:140ms; --ease:cubic-bezier(.2,0,0,1);
    --shadow-overlay:0 24px 48px -12px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.045);
    --highlight:inset 0 1px 0 rgba(255,255,255,.035);
    --focus-ring:0 0 0 1px var(--line-strong);
    --focus-ring-inset:inset 0 0 0 1px var(--line-strong);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--canvas);color:var(--fg);font-family:var(--font-sans);font-feature-settings:"cv01","ss03","cv11";
    font-size:13.5px;line-height:1.5;letter-spacing:-.006em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  a{color:inherit;text-decoration:none}
  button,input{font-family:inherit}
  ::selection{background:var(--accent-tint);color:var(--fg-strong)}
  svg{display:block}
  .hide{display:none!important}
  code,kbd,pre,.topbar__count,.count-chip,.listing-row__meta .k,.mono{
    -webkit-font-smoothing:subpixel-antialiased;-moz-osx-font-smoothing:auto;font-feature-settings:normal}
  :is(.btn,.pill-group__item,.filter-menu__item,.filter-chip__op,.filter-chip__val,.filter-chip__x):focus-visible{
    outline:none;box-shadow:var(--focus-ring)}
  a.listing-row:focus-visible,a.listing-card:focus-visible{outline:none;box-shadow:var(--focus-ring-inset)}

  .shell{height:100vh}
  .main{display:flex;flex-direction:column;min-width:0;height:100vh;overflow:hidden}

  .topbar{display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border-bottom:1px solid var(--line);flex:none;background:var(--canvas);min-width:0;overflow:hidden}
  .topbar__title{display:flex;align-items:center;gap:8px;min-width:0}
  .topbar__icon{display:inline-flex;width:24px;height:24px;flex:none;align-items:center;justify-content:center;border-radius:var(--radius-sm);background:var(--elevated);color:var(--accent)}
  .topbar__icon svg{width:12px;height:12px}
  .topbar__h1{font-size:14px;font-weight:500;letter-spacing:-.014em;color:var(--fg-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar__count{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;padding:0 6px;border-radius:var(--radius-xs);background:var(--canvas-soft);font-family:var(--font-mono);font-size:10.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
  .topbar__trailing{display:flex;align-items:center;gap:8px;margin-left:auto;flex:none}

  .search{display:flex;align-items:center;gap:8px;height:26px;min-width:220px;width:220px;padding:0 8px;border:1px solid var(--line);
    border-radius:var(--radius);background:var(--canvas-soft);color:var(--fg);font-size:13px;flex:none}
  .search svg{width:12px;height:12px;flex:none;color:var(--subtle)}
  .search input{flex:1;min-width:0;border:0;background:transparent;color:var(--fg);font-size:13px;outline:none}
  .search input::placeholder{color:var(--subtle)}
  .search .kbd{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:-.005em;text-transform:uppercase;line-height:1;color:var(--subtle);
    border:1px solid var(--line);border-radius:var(--radius-xs);padding:1px 4px;flex:none;background:var(--canvas-soft)}
  .search:focus-within{border-color:var(--line-strong);box-shadow:var(--focus-ring)}

  .btn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:var(--radius-md);font-size:12px;
    font-weight:500;letter-spacing:-.005em;border:1px solid var(--line);background:var(--btn-fill);color:var(--fg);cursor:pointer;white-space:nowrap;
    transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),color var(--dur) var(--ease)}
  .btn svg{width:14px;height:14px}
  .btn:hover{background:var(--btn-hover);border-color:var(--line-strong);color:var(--fg-strong)}
  .btn:active:not(:disabled){transform:translateY(1px)}
  .btn--primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:var(--highlight)}
  .btn--primary:hover{background:var(--accent-hover);color:var(--accent-ink)}
  .btn--ghost{background:transparent;border-color:transparent;color:var(--fg)}
  .btn--ghost:hover{background:var(--row-hover);color:var(--fg);border-color:transparent}
  .btn--sm{height:22px;padding:0 10px;font-size:11px}
  .btn--sm svg{width:12px;height:12px}
  .btn--icon{width:26px;padding:0;justify-content:center}

  .scroll{flex:1;min-height:0;overflow-y:auto}
  .page{max-width:1320px;margin:0 auto;padding:28px 36px 80px}
  .head{display:flex;align-items:flex-start;gap:16px;margin-bottom:18px}
  .head__main{min-width:0}
  .head__titlerow{display:flex;align-items:center;gap:10px}
  .head__title{font-size:1.4rem;font-weight:600;letter-spacing:-.028em;color:var(--fg-strong)}
  .count-chip{display:inline-flex;align-items:center;min-height:19px;padding:1px 6px;border-radius:var(--radius-xs);
    background:var(--canvas-soft);border:1px solid var(--line-soft);font-family:var(--font-mono);font-size:11px;font-weight:500;
    color:var(--muted);font-variant-numeric:tabular-nums}
  .head__meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:7px;font-size:12px;color:var(--subtle)}
  .dotsep{width:2px;height:2px;border-radius:50%;background:var(--faint);flex:none;display:inline-block}

  .listing-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line-soft)}
  .listing-toolbar__leading{display:flex;flex-wrap:wrap;align-items:center;gap:8px;flex:1;min-width:0}
  .listing-toolbar__trailing{display:flex;align-items:center;gap:10px;margin-left:auto;flex:none}

  /* PillGroup — packages/ui: borderless track, elevated active segment */
  .pill-group{display:inline-flex;align-items:center;gap:1px;padding:2px;background:var(--canvas-soft);border-radius:var(--radius-md)}
  .pill-group__item{display:inline-flex;align-items:center;gap:6px;min-height:24px;padding:0 10px;border-radius:var(--radius-xs);font-size:12px;
    font-weight:500;letter-spacing:-.005em;color:var(--subtle);background:transparent;border:0;cursor:pointer;
    transition:color var(--dur) var(--ease),background var(--dur) var(--ease)}
  .pill-group__item svg{width:12px;height:12px}
  .pill-group__item:hover{color:var(--muted)}
  .pill-group__item[aria-pressed="true"]{color:var(--fg-strong);background:var(--elevated);box-shadow:var(--highlight)}

  .filters{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-width:0;position:relative}
  .filter-add{position:relative}
  .filter-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:30;width:220px;padding:4px;border-radius:var(--radius-md);background:var(--canvas-soft);box-shadow:var(--shadow-overlay)}
  .filter-menu__search{width:100%;height:32px;padding:0 10px;border:0;border-bottom:1px solid var(--line-soft);border-radius:0;background:transparent;color:var(--fg);font-size:12.5px;outline:none;margin-bottom:4px}
  .filter-menu__search::placeholder{color:var(--faint)}
  .filter-menu__item{display:flex;align-items:center;gap:8px;width:100%;height:28px;padding:0 8px;border:0;border-radius:var(--radius);background:transparent;color:var(--fg);font-size:12.5px;cursor:pointer;text-align:left}
  .filter-menu__item:hover,.filter-menu__item:focus{background:var(--row-hover);outline:none}
  .filter-menu__item svg{width:12px;height:12px;color:var(--muted);flex:none}
  .filter-menu__empty{padding:10px 8px;font-size:12px;color:var(--subtle)}
  .filter-menu__sep{height:1px;background:var(--line-soft);margin:4px 0}
  .filter-submenu{position:absolute;top:0;left:calc(100% + 4px);z-index:31;width:220px;max-height:260px;overflow:auto;padding:4px;border-radius:var(--radius-md);background:var(--canvas-soft);box-shadow:var(--shadow-overlay)}
  .filter-chip{display:inline-flex;align-items:stretch;width:fit-content;border-radius:var(--radius);overflow:hidden}
  .filter-chip > *{border:1px solid var(--line);background:var(--canvas);color:var(--fg);font-size:11px;line-height:1;display:inline-flex;align-items:center;height:22px;padding:0 8px;margin:0}
  .filter-chip > * + *{border-left:0;border-top-left-radius:0;border-bottom-left-radius:0}
  .filter-chip > *:first-child{border-radius:var(--radius) 0 0 var(--radius);background:var(--canvas);color:var(--fg);gap:6px}
  .filter-chip > *:last-child{border-radius:0 var(--radius) var(--radius) 0}
  .filter-chip__label{font-weight:500}
  .filter-chip__op{color:var(--muted);background:transparent;cursor:pointer;font-family:inherit}
  .filter-chip__op:hover{color:var(--fg-strong);background:var(--row-hover)}
  .filter-chip__val{background:transparent;cursor:pointer;font-family:inherit;max-width:14rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .filter-chip__val:hover{background:var(--row-hover)}
  .filter-chip__x{width:22px;padding:0;justify-content:center;cursor:pointer;color:var(--muted);background:transparent}
  .filter-chip__x:hover{color:var(--fg-strong);background:var(--row-hover)}
  .filter-chip__x svg{width:12px;height:12px}
  .filter-op-menu{position:absolute;z-index:32;min-width:140px;padding:4px;border-radius:var(--radius-md);background:var(--canvas-soft);box-shadow:var(--shadow-overlay)}

  .notice{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:8px 12px;border-radius:var(--radius-md);
    background:var(--canvas-soft);border:1px solid var(--line-soft);font-size:12px;color:var(--muted)}
  .notice svg{width:14px;height:14px;color:var(--warning);flex:none}

  .list{border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;background:var(--canvas-soft)}
  .listing-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 16px;
    border-bottom:1px solid var(--line-soft);cursor:pointer;transition:background var(--dur) var(--ease);color:inherit}
  .listing-row:last-child{border-bottom:0}
  .listing-row:hover{background:var(--row-hover)}
  .listing-row__leading{width:34px;height:34px;display:grid;place-items:center;flex:none}
  .provider-logo{width:34px;height:34px;border-radius:var(--radius-md);background:var(--elevated);
    display:grid;place-items:center;color:var(--fg);box-shadow:var(--highlight)}
  .provider-logo svg{width:18px;height:18px}
  .provider-logo[data-fill="true"] svg{width:20px;height:20px}
  .listing-row__main{min-width:0}
  .listing-row__name{display:flex;align-items:center;gap:8px;min-width:0}
  .listing-row__name b{font-size:14px;font-weight:500;color:var(--fg-strong);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .listing-row__meta{margin-top:4px;display:flex;align-items:center;gap:0;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;min-width:0}
  .listing-row__meta .k{font-family:var(--font-mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
  .listing-row__meta .sep{margin:0 6px;color:var(--faint);flex:none}
  .listing-row__trail{display:flex;align-items:center;gap:10px;flex:none}
  .row-actions{display:flex;align-items:center;gap:4px}
  .row-actions .btn{height:26px;width:26px;padding:0;justify-content:center;color:var(--muted)}
  .row-actions .btn:hover{color:var(--fg-strong);background:var(--btn-hover);border-color:transparent}

  .pill{display:inline-flex;align-items:center;gap:6px;height:19px;padding:0 8px;border-radius:var(--radius-xs);
    font-size:11px;font-weight:500;letter-spacing:-.005em;line-height:1;width:max-content}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
  .pill--success{background:var(--success-tint);color:var(--success)}
  .pill--neutral{background:var(--neutral-tint);color:var(--muted)}
  .pill--warning{background:var(--warning-tint);color:var(--warning)}

  /* Cards — CatalogCard / LISTING-STANDARD */
  .listing-card-grid{display:grid;grid-template-columns:1fr;gap:10px}
  @media (min-width:720px){.listing-card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (min-width:1100px){.listing-card-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .listing-card{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--radius-lg);
    background:var(--canvas-soft);min-width:0;transition:background var(--dur) var(--ease);color:inherit}
  .listing-card:hover{background:var(--elevated)}
  .listing-card__head{display:flex;align-items:flex-start;gap:10px;min-width:0}
  .listing-card__icon{width:24px;height:24px;border-radius:var(--radius);background:var(--elevated);color:var(--fg);
    display:grid;place-items:center;flex:none;box-shadow:var(--highlight)}
  .listing-card__icon svg{width:14px;height:14px}
  .listing-card__icon[data-fill="true"] svg{width:16px;height:16px}
  .listing-card__title{min-width:0;flex:1}
  .listing-card__title b{display:block;font-family:var(--font-sans);font-size:13px;font-weight:500;color:var(--fg-strong);
    letter-spacing:-.012em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .listing-card__eyebrow{font-size:11px;font-weight:600;letter-spacing:-.005em;text-transform:uppercase;color:var(--subtle);margin-top:4px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .listing-card__eyebrow .mono-slug{font-family:var(--font-mono);font-size:10.5px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--faint)}
  .listing-card__foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px solid var(--line);margin-top:auto}
  .listing-card__foot-meta{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
  .listing-card__foot .row-actions{margin-left:auto;flex:none}

  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:56px 24px;
    border-radius:var(--radius-lg);text-align:center;color:var(--subtle)}
  .empty svg{width:38px;height:38px;padding:11px;border-radius:var(--radius-lg);background:var(--canvas-soft);color:var(--subtle);box-sizing:content-box}
  .empty b{font-size:18px;font-weight:500;color:var(--fg-strong);letter-spacing:-.022em}
  .empty p{font-size:13px;max-width:28rem;line-height:1.6;color:var(--muted)}
  .empty .btn{margin-top:4px}

  .skeleton-rows{border:1px solid var(--line);border-radius:var(--radius-lg);overflow:hidden;background:var(--canvas-soft)}
  .skeleton-row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 16px;
    border-bottom:1px solid var(--line-soft)}
  .skeleton-row:last-child{border-bottom:0}
  .sk{border-radius:var(--radius);background:linear-gradient(90deg,var(--elevated) 0%,var(--surface-glaze) 50%,var(--elevated) 100%);
    background-size:200% 100%;animation:shimmer 1.4s var(--ease) infinite}
  .sk-leading{width:34px;height:34px;display:grid;place-items:center}
  .sk-avatar{width:34px;height:34px;border-radius:var(--radius-md)}
  .sk-line{height:12px}
  .sk-line--title{width:42%;margin-bottom:8px}
  .sk-line--meta{width:68%;height:10px}
  .sk-trail{display:flex;align-items:center;gap:10px}
  .sk-pill{width:58px;height:19px;border-radius:var(--radius-xs)}
  .sk-icon{width:26px;height:26px;border-radius:var(--radius)}
  .sk-card-grid{display:grid;grid-template-columns:1fr;gap:10px}
  @media (min-width:720px){.sk-card-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (min-width:1100px){.sk-card-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .sk-card{display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:var(--radius-lg);background:var(--canvas-soft)}
  .sk-card__head{display:flex;align-items:flex-start;gap:10px}
  .sk-card__icon{width:24px;height:24px;border-radius:var(--radius);flex:none}
  .sk-card__foot{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--line-soft)}
  @keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-delay:.001ms!important;transition-duration:.001ms!important}
  }

  @media(max-width:920px){
    .listing-row{grid-template-columns:34px minmax(0,1fr);gap:12px;row-gap:8px}
    .listing-row__trail{grid-column:2;justify-content:flex-start;gap:8px}
    .page{padding:22px 18px 64px}
    .search{min-width:140px;width:160px}
  }
  @media(max-width:560px){
    .head__title{font-size:1.25rem}
    .listing-toolbar{gap:8px}
    .search{width:100%;min-width:0;flex:1 1 100%}
  }
</style>
</head>
<body>
<div class="shell">
  <div class="main">
    <header class="topbar" data-od-id="agents-topbar" data-slot="topbar">
      <div class="topbar__title" data-slot="topbar-title">
        <span class="topbar__icon" data-slot="topbar-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </span>
        <h1 class="topbar__h1" data-testid="topbar-title-text">Agents</h1>
        <span class="topbar__count" data-slot="topbar-count" id="topbar-count">0</span>
      </div>
      <div class="topbar__trailing" data-slot="topbar-trailing" id="topbar-actions">
        <button type="button" class="btn btn--primary btn--sm" id="btn-new-agent" data-od-id="agents-new">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New agent
        </button>
      </div>
    </header>

    <div class="scroll">
      <div class="page">
        <div class="head" data-od-id="agents-head">
          <div class="head__main">
            <div class="head__titlerow">
              <h1 class="head__title">Agents</h1>
              <span class="count-chip" id="head-count">0</span>
            </div>
            <div class="head__meta">
              <span>Provider, model, and instructions a session runs with.</span>
              <span class="dotsep"></span>
              <span>Operate</span>
            </div>
          </div>
        </div>

        <div class="listing-toolbar" data-od-id="agents-toolbar" id="listing-toolbar">
          <div class="listing-toolbar__leading">
            <label class="search" data-od-id="agents-search" data-slot="search-input">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
              <input id="search-input" type="search" placeholder="Search agents" autocomplete="off" spellcheck="false" />
              <span class="kbd">/</span>
            </label>
            <div class="filters" id="filters-root" data-od-id="agents-filters"></div>

  function agentStatus(agent) {
    if (!state.sessionsOk) return null;
    return agent.active > 0 ? "active" : "idle";
  }


  function middleTruncate(path, maxCh) {
    var s = path || "";
    if (s.length <= maxCh) return s;
    var parts = s.split(" / ");
    if (parts.length < 2) return s.slice(0, maxCh - 1) + "…";
    var first = parts[0];
    var last = parts[parts.length - 1];
    var joined = first + " / … / " + last;
    if (joined.length <= maxCh) return joined;
    return first.slice(0, Math.max(4, maxCh - last.length - 8)) + "… / " + last;
  }

  function metaSegments(agent) {
    var segs = [];
    var cat = categoryKey(agent);
    if (cat) segs.push(middleTruncate(cat, 40));
    if (agent.provider) segs.push(agent.provider);
    if (agent.model) segs.push(agent.model);
    return segs;
  }

  function matchFilter(agent, chip) {
    var val = (chip.values && chip.values[0]) || "";
    if (chip.field === "category") {
      return categoryKey(agent) === val;
    }
    if (chip.field === "status") {
      var st = agentStatus(agent);
      if (!st) return true;
      return st === val;
    }
    return true;
  }

  function matchSearch(agent) {
    var q = state.query.trim().toLowerCase();
    if (!q) return true;
    /* Design-spec §3.4: match name + category path only. */
    var hay = [agent.name, categoryKey(agent)].join(" ").toLowerCase();
    return hay.indexOf(q) !== -1;
  }

  function fleet() {
    if (state.pageState === "empty") return [];
    if (state.pageState === "error" || state.pageState === "loading") return [];
    return AGENTS.slice();
  }

  function filtered() {
    return fleet().filter(function (agent) {
      if (!matchSearch(agent)) return false;
      return state.filters.every(function (chip) { return matchFilter(agent, chip); });
    }).slice().sort(function (a, b) {
      return a.name.localeCompare(b.name);
    });
  }

  function syncUrl() {
    /* Preview iframes / file:// often reject history writes — never block paint. */
    try {
      var params = new URLSearchParams();
      if (state.pageState !== "ready") params.set("state", state.pageState);
      if (state.view !== "rows") params.set("view", state.view);
      if (state.query.trim()) params.set("q", state.query.trim());
      state.filters.forEach(function (chip) {
        var val = (chip.values && chip.values[0]) || "";
        if (chip.field === "category" && val) params.set("category", val);
        if (chip.field === "status" && val) params.set("status", val);
      });
      var qs = params.toString();
      var next = qs ? (window.location.pathname + "?" + qs) : window.location.pathname;
      var cur = window.location.pathname + window.location.search;
      if (next === cur) return;
      if (window.history && typeof window.history.replaceState === "function") {
        window.history.replaceState(null, "", next);
      }
    } catch (err) {
      /* ignore SecurityError / NotSupportedError in embedded previews */
    }
  }

  function syncViewToggle() {
    document.querySelectorAll("#view-toggle .pill-group__item").forEach(function (btn) {
      btn.setAttribute("aria-pressed", btn.getAttribute("data-view") === state.view ? "true" : "false");
    });
    var wrap = document.getElementById("view-toggle-wrap");
    if (wrap) {
      var hide = state.pageState === "loading" || state.pageState === "error" || state.pageState === "empty";
      wrap.classList.toggle("hide", hide);
    }
  }

  function statusPill(status) {
    if (status === "active") {
      return '<span class="pill pill--success"><span class="dot"></span>Active</span>';
    }
    if (status === "idle") {
      return '<span class="pill pill--neutral"><span class="dot"></span>Idle</span>';
    }
    return "";
  }

  function commentButton(agent) {
    return '<button type="button" class="btn btn--icon" data-new-session="' + esc(agent.name) +
      '" aria-label="New session with ' + esc(agent.name) + '" title="New session">' + COMMENT_ICON + "</button>";
  }

  function openNewSession(agentName) {
    window.alert("Opens a new session with " + agentName + ".");
  }

  function closeMenus() {
    state.menuOpen = false;
    state.menuQuery = "";
    state.submenuField = null;
    state.editingChipId = null;
    state.opMenuId = null;
  }

  function setCounts(n) {
    document.getElementById("topbar-count").textContent = String(n);
    document.getElementById("head-count").textContent = String(n);
  }

  function setTopbarCtaVisible(visible) {
    var el = document.getElementById("topbar-actions");
    el.classList.toggle("hide", !visible);
  }

  function renderFilters() {
    var root = document.getElementById("filters-root");
    if (state.pageState === "loading" || state.pageState === "error" || state.pageState === "empty") {
      root.innerHTML = "";
      return;
    }
    var used = usedFields();
    var html = "";

    html += '<div class="filter-add">';
    html += '<button type="button" class="btn btn--ghost btn--sm" id="filter-add-btn" aria-label="Add filter" data-od-id="agents-filter-add">';
    html += FILTER_ICON + " Filter</button>";

    if (state.menuOpen) {
      var q = state.menuQuery.toLowerCase();
      html += '<div class="filter-menu" id="filter-menu" role="menu">';
      html += '<input class="filter-menu__search" id="filter-menu-search" type="text" placeholder="Filter..." value="' + esc(state.menuQuery) + '" autocomplete="off" spellcheck="false" />';
      html += '<div class="filter-menu__sep"></div>';
      var shown = 0;
      FILTER_FIELDS.forEach(function (field) {
        if (used.indexOf(field.key) !== -1) return;
        if (q && field.label.toLowerCase().indexOf(q) === -1) return;
        shown++;
        html += '<button type="button" class="filter-menu__item" data-add-field="' + field.key + '" role="menuitem">';
        html += SELECT_ICON + esc(field.label) + "</button>";
      });
      if (!shown) html += '<div class="filter-menu__empty">No filters found.</div>';
      html += "</div>";

      if (state.submenuField) {
        var sub = fieldByKey(state.submenuField);
        if (sub && sub.type === "select") {
          html += '<div class="filter-submenu" id="filter-submenu">';
          sub.options.forEach(function (opt) {
            html += '<button type="button" class="filter-menu__item" data-pick-value="' + esc(opt.value) + '">' + esc(opt.label) + "</button>";
          });
          html += "</div>";
        }
      }
    }
    html += "</div>";

    state.filters.forEach(function (chip) {
      var field = fieldByKey(chip.field);
      if (!field) return;
      var val = (chip.values && chip.values[0]) || "";
      var display = optionLabel(field, val);
      html += '<div class="filter-chip" data-chip-id="' + chip.id + '" role="group">';
      html += '<span class="filter-chip__label">' + esc(field.label) + "</span>";
      html += '<button type="button" class="filter-chip__op" data-op-toggle="' + chip.id + '">' + esc(opLabel(field, chip.operator)) + "</button>";
      html += '<button type="button" class="filter-chip__val" data-chip-value="' + chip.id + '">' + esc(display || "Select...") + "</button>";
      html += '<button type="button" class="filter-chip__x" data-chip-remove="' + chip.id + '" aria-label="Remove filter">' + X_ICON + "</button>";
      html += "</div>";
    });

    if (state.opMenuId) {
      var opChip = state.filters.find(function (c) { return c.id === state.opMenuId; });
      var opField = opChip ? fieldByKey(opChip.field) : null;
      if (opField) {
        html += '<div class="filter-op-menu" id="filter-op-menu" data-for="' + state.opMenuId + '">';
        opField.operators.forEach(function (op) {
          html += '<button type="button" class="filter-menu__item" data-set-op="' + op.value + '">' + esc(op.label) + "</button>";
        });
        html += "</div>";
      }
    }

    root.innerHTML = html;

    if (state.menuOpen) {
      var search = document.getElementById("filter-menu-search");
      if (search) {
        search.focus();
        search.setSelectionRange(state.menuQuery.length, state.menuQuery.length);
        search.addEventListener("input", function () {
          state.menuQuery = search.value;
          renderFilters();
        });
      }
    }

    bindFilterEvents();
  }

  function bindFilterEvents() {
    var addBtn = document.getElementById("filter-add-btn");
    if (addBtn) {
      addBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        state.menuOpen = !state.menuOpen;
        state.submenuField = null;
        state.opMenuId = null;
        renderFilters();
      });
    }

    document.querySelectorAll("[data-add-field]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var key = btn.getAttribute("data-add-field");
        var field = fieldByKey(key);
        if (!field) return;
        if (field.type === "select") {
          state.submenuField = key;
          renderFilters();
          return;
        }
      });
    });

    document.querySelectorAll("[data-pick-value]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var val = btn.getAttribute("data-pick-value");
        var fieldKey = state.submenuField || (state.editingChipId && (state.filters.find(function (c) { return c.id === state.editingChipId; }) || {}).field);
        if (state.editingChipId) {
          var chip = state.filters.find(function (c) { return c.id === state.editingChipId; });
          if (chip) chip.values = [val];
          state.editingChipId = null;
        } else if (fieldKey) {
          state.filters.push({ id: uid(), field: fieldKey, operator: "is", values: [val] });
        }
        closeMenus();
        renderAll();
      });
    });

    document.querySelectorAll("[data-chip-remove]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var id = btn.getAttribute("data-chip-remove");
        state.filters = state.filters.filter(function (c) { return c.id !== id; });
        closeMenus();
        renderAll();
      });
    });

    document.querySelectorAll("[data-chip-value]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var id = btn.getAttribute("data-chip-value");
        var chip = state.filters.find(function (c) { return c.id === id; });
        if (!chip) return;
        state.editingChipId = id;
        state.submenuField = chip.field;
        state.menuOpen = true;
        state.opMenuId = null;
        renderFilters();
      });
    });

    document.querySelectorAll("[data-op-toggle]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var id = btn.getAttribute("data-op-toggle");
        state.opMenuId = state.opMenuId === id ? null : id;
        state.menuOpen = false;
        renderFilters();
      });
    });

    document.querySelectorAll("[data-set-op]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var op = btn.getAttribute("data-set-op");
        var chip = state.filters.find(function (c) { return c.id === state.opMenuId; });
        if (chip) chip.operator = op;
        state.opMenuId = null;
        renderAll();
      });
    });
  }

  function renderSkeleton() {
    if (state.view === "cards") {
      var cards = '<div class="sk-card-grid" data-od-id="agents-loading" aria-busy="true" aria-label="Loading agents">';
      for (var c = 0; c < 6; c++) {
        cards += '<div class="sk-card">';
        cards += '<div class="sk-card__head"><div class="sk sk-card__icon"></div><div style="flex:1;min-width:0">';
        cards += '<div class="sk sk-line sk-line--title" style="width:55%"></div>';
        cards += '<div class="sk sk-line sk-line--meta" style="width:40%;margin-top:8px"></div></div></div>';
        cards += '<div class="sk-card__foot"><div class="sk sk-pill"></div><div class="sk sk-icon"></div></div>';
        cards += "</div>";
      }
      cards += "</div>";
      return cards;
    }
    var html = '<div class="skeleton-rows" data-od-id="agents-loading" aria-busy="true" aria-label="Loading agents">';
    for (var i = 0; i < 8; i++) {
      html += '<div class="skeleton-row">';
      html += '<div class="sk-leading"><div class="sk sk-avatar"></div></div>';
      html += '<div><div class="sk sk-line sk-line--title"></div><div class="sk sk-line sk-line--meta"></div></div>';
      html += '<div class="sk-trail"><div class="sk sk-pill"></div><div class="sk sk-icon"></div></div>';
      html += "</div>";
    }
    html += "</div>";
    return html;
  }

  function renderRow(agent, index) {
    var status = agentStatus(agent);
    var segs = metaSegments(agent);
    var ariaStatus = status === "active" ? "Active" : status === "idle" ? "Idle" : "status unavailable";
    var aria = agent.name + ", " + providerKey(agent.provider) + ", " + ariaStatus;

    var html = '<a class="listing-row" href="agent-detail.html?tab=overview" data-od-id="agent-row-' + (index + 1) + '" aria-label="' + esc(aria) + '">';
    html += '<span class="listing-row__leading">' + providerLogo(agent.provider) + "</span>";
    html += '<div class="listing-row__main">';
    html += '<div class="listing-row__name"><b>' + esc(agent.name) + "</b></div>";
    html += '<div class="listing-row__meta">';
    segs.forEach(function (seg, i) {
      if (i) html += '<span class="sep" aria-hidden="true">·</span>';
      html += '<span class="k">' + esc(seg) + "</span>";
    });
    html += "</div></div>";

    html += '<div class="listing-row__trail">';
    if (state.sessionsOk) {
      html += statusPill(status);
    }
    if (agent.diagnostics && agent.diagnostics.length) {
      html += '<span class="pill pill--warning">Invalid</span>';
    }
    html += '<div class="row-actions">' + commentButton(agent) + "</div>";
    html += "</div></a>";
    return html;
  }

  function renderCard(agent, index) {
    var status = agentStatus(agent);
    var cat = categoryKey(agent);
    var eyebrowParts = [];
    if (cat) eyebrowParts.push(middleTruncate(cat, 36));
    else if (agent.provider) eyebrowParts.push(providerKey(agent.provider));
    if (agent.model) eyebrowParts.push(agent.model);

    var html = '<a class="listing-card" href="agent-detail.html?tab=overview" data-od-id="agent-card-' + (index + 1) + '">';
    html += '<div class="listing-card__head">';
    html += providerLogo(agent.provider, "sm");
    html += '<div class="listing-card__title">';
    html += "<b>" + esc(agent.name) + "</b>";
    if (eyebrowParts.length) {
      html += '<div class="listing-card__eyebrow">' + esc(eyebrowParts.join(" · ")) + "</div>";
    }
    html += "</div></div>";
    html += '<div class="listing-card__foot">';
    html += '<div class="listing-card__foot-meta">';
    if (state.sessionsOk) html += statusPill(status);
    if (agent.diagnostics && agent.diagnostics.length) {
      html += '<span class="pill pill--warning">Invalid</span>';
    }
    html += "</div>";
    html += '<div class="row-actions">' + commentButton(agent) + "</div>";
    html += "</div></a>";
    return html;
  }

  function bindListActions(root) {
    root.querySelectorAll("[data-new-session]").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        openNewSession(btn.getAttribute("data-new-session"));
      });
    });
  }

  function renderList() {
    var root = document.getElementById("list-root");
    var fleetTotal = fleet().length;
    syncViewToggle();
    setCounts(state.pageState === "loading" || state.pageState === "error" ? 0 : (state.pageState === "empty" ? 0 : AGENTS.length));

    if (state.pageState === "loading") {
      setTopbarCtaVisible(true);
      setCounts(0);
      root.innerHTML = renderSkeleton();
      return;
    }

    if (state.pageState === "error") {
      /* Accent stays on topbar New agent; Retry is neutral recovery (§2.1). */
      setTopbarCtaVisible(true);
      setCounts(0);
      root.innerHTML =
        '<div class="empty" data-od-id="agents-error">' + ALERT_ICON +
        "<b>Couldn't load agents</b>" +
        "<p>The agents request failed. Check the daemon connection and try again.</p>" +
        '<button type="button" class="btn" id="btn-retry" data-od-id="agents-retry">Retry</button></div>';
      var retry = document.getElementById("btn-retry");
      if (retry) {
        retry.addEventListener("click", function () {
          state.pageState = "ready";
          state.sessionsOk = true;
          renderAll();
        });
      }
      return;
    }

    if (state.pageState === "empty" || (fleetTotal === 0 && state.pageState === "ready")) {
      setTopbarCtaVisible(false);
      setCounts(0);
      root.innerHTML =
        '<div class="empty" data-od-id="agents-empty">' + USERS_ICON +
        "<b>No agents yet</b>" +
        "<p>Agents define the provider, model, and instructions a session runs with.</p>" +
        '<button type="button" class="btn btn--primary" id="btn-empty-new" data-od-id="agents-empty-new">New agent</button></div>';
      var emptyNew = document.getElementById("btn-empty-new");
      if (emptyNew) emptyNew.addEventListener("click", openCreate);
      return;
    }

    setTopbarCtaVisible(true);
    setCounts(AGENTS.length);

    var rows = filtered();
    var html = "";

    if (!state.sessionsOk) {
      html += '<div class="notice" data-od-id="agents-partial-notice">' + WARN_ICON +
        "<span>Session status unavailable</span></div>";
    }

    if (!rows.length) {
      html +=
        '<div class="empty" data-od-id="agents-filtered-empty">' + USERS_ICON +
        "<b>No agents match</b>" +
        "<p>Try a different search or clear the active filters.</p>" +
        '<button type="button" class="btn btn--ghost" id="btn-clear-filters" data-od-id="agents-clear-filters">Clear filters</button></div>';
      root.innerHTML = html;
      var clear = document.getElementById("btn-clear-filters");
      if (clear) {
        clear.addEventListener("click", function () {
          state.query = "";
          state.filters = [];
          document.getElementById("search-input").value = "";
          closeMenus();
          renderAll();
        });
      }
      return;
    }

    if (state.view === "cards") {
      html += '<div class="listing-card-grid" data-od-id="agents-cards">';
      rows.forEach(function (agent, i) {
        html += renderCard(agent, i);
      });
      html += "</div>";
    } else {
      html += '<div class="list" role="list">';
      rows.forEach(function (agent, i) {
        html += renderRow(agent, i);
      });
      html += "</div>";
    }
    root.innerHTML = html;
    bindListActions(root);
  }

  function openCreate() {
    /* Prototype: create wizard lives in product shell; keep CTA wired. */
    window.alert("Opens the existing New agent wizard.");
  }

  function renderAll() {
    renderFilters();
    renderList();
    syncUrl();
  }

  function bindGlobal() {
    var input = document.getElementById("search-input");
    input.value = state.query;
    var debounce;
    input.addEventListener("input", function () {
      clearTimeout(debounce);
      debounce = setTimeout(function () {
        state.query = input.value;
        renderAll();
      }, 200);
    });

    document.getElementById("btn-new-agent").addEventListener("click", openCreate);

    document.getElementById("view-toggle").addEventListener("click", function (e) {
      var btn = e.target.closest("[data-view]");
      if (!btn) return;
      var next = btn.getAttribute("data-view");
      if (next !== "rows" && next !== "cards") return;
      if (state.view === next) return;
      state.view = next;
      renderAll();
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "/" && !e.metaKey && !e.ctrlKey && !e.altKey) {
        var tag = (document.activeElement && document.activeElement.tagName) || "";
        if (tag === "INPUT" || tag === "TEXTAREA") return;
        e.preventDefault();
        input.focus();
      }
      if (e.key === "Escape") {
        closeMenus();
        renderFilters();
      }
    });

    document.addEventListener("click", function () {
      if (state.menuOpen || state.opMenuId) {
        closeMenus();
        renderFilters();
      }
    });
  }

  rebuildCategoryOptions();
  parsePageState();
  bindGlobal();
  renderAll();
})();
</script>
</body>
</html>
