name = "calcom"
version = "1.0.0"
description = "Manage Cal.com scheduling through Cal.com's hosted MCP server."
min_compozy_version = "0.5.0"

[resources.mcp_servers.calcom]
transport = "http"
url = "https://mcp.cal.com/mcp"
default_scope = "workspace"

[resources.mcp_servers.calcom.auth]
method = "oauth"
registration = "dynamic"
