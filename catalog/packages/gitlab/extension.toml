name = "gitlab"
version = "1.0.0"
description = "Work with GitLab projects, issues, merge requests, and pipelines through GitLab's hosted MCP server."
min_compozy_version = "0.5.0"

[resources.mcp_servers.gitlab]
transport = "http"
url = "https://gitlab.com/api/v4/mcp"
default_scope = "workspace"

[resources.mcp_servers.gitlab.auth]
method = "oauth"
registration = "dynamic"
