name = "playwright"
version = "0.0.78"
description = "Automate browser workflows with Microsoft's Playwright MCP server in headless mode."
min_compozy_version = "0.5.0"

[resources.mcp_servers.playwright]
transport = "stdio"
command = "npx"
args = ["-y", "@playwright/mcp@0.0.78", "--headless"]
default_scope = "workspace"
