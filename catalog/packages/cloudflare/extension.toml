name = "cloudflare"
version = "1.0.0"
description = "Use Cloudflare's Code Mode MCP server to progressively discover and call Cloudflare APIs."
min_compozy_version = "0.5.0"

[resources.mcp_servers.cloudflare]
transport = "http"
url = "https://mcp.cloudflare.com/mcp"
default_scope = "workspace"

[resources.mcp_servers.cloudflare.auth]
method = "oauth"
registration = "dynamic"
