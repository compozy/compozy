name = "github"
version = "1.8.0"
description = "Inspect GitHub repositories, issues, pull requests, and releases with GitHub's official MCP server."
min_compozy_version = "0.3.0-beta.25"

[[inputs]]
id = "github_personal_access_token"
prompt = "GitHub personal access token"
type = "secret"
required = true
binding = { type = "env", name = "GITHUB_PERSONAL_ACCESS_TOKEN" }

[resources.mcp_servers.github]
transport = "stdio"
command = "docker"
args = [
  "run",
  "-i",
  "--rm",
  "--env",
  "GITHUB_PERSONAL_ACCESS_TOKEN",
  "ghcr.io/github/github-mcp-server@sha256:d5a18c04b92714c309eb46a2305087e91a4dbd80420f6e462656699f95093520",
  "--read-only",
]
secret_env = { GITHUB_PERSONAL_ACCESS_TOKEN = "github_personal_access_token" }
default_scope = "workspace"
