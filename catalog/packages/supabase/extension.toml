name = "supabase"
version = "1.0.0"
description = "Work with a selected Supabase project through Supabase's hosted MCP server in read-only mode."
min_compozy_version = "0.3.0-beta.25"

[[inputs]]
id = "project_ref"
prompt = "Supabase project reference"
type = "identifier"
required = true
binding = { type = "url_query", name = "project_ref" }

[resources.mcp_servers.supabase]
transport = "http"
url = "https://mcp.supabase.com/mcp?read_only=true&project_ref="
default_scope = "workspace"

[resources.mcp_servers.supabase.auth]
method = "oauth"
registration = "dynamic"
