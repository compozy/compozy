name = "posthog"
version = "1.0.0"
description = "Analyze product data, feature flags, and observability signals through PostHog's hosted MCP server."
min_compozy_version = "0.3.0-beta.25"

[resources.mcp_servers.posthog]
transport = "http"
url = "https://mcp.posthog.com/mcp"
default_scope = "workspace"

[resources.mcp_servers.posthog.auth]
method = "oauth"
registration = "dynamic"
