[extension]
name = "discord"
version = "0.1.0"
description = "Production Discord bridge provider built on internal/bridgesdk"
min_compozy_version = "0.3.0-beta.1"

[capabilities]
provides = ["bridge.adapter"]

[bridge]
platform = "discord"
display_name = "Discord"

[[bridge.secret_slots]]
name = "bot_token"
description = "Discord bot OAuth token"
required = true

[[bridge.secret_slots]]
name = "public_key"
description = "Discord Ed25519 public key for webhook verification"
required = true

[bridge.config_schema]
schema = "compozy.bridge.discord"
version = "1"

[permissions]
requires = [
  "bridges/instances/list",
  "bridges/messages/ingest",
  "bridges/instances/get",
  "bridges/instances/report_state",
]

[subprocess]
command = "./bin/discord"
args = ["serve"]

[subprocess.env]
COMPOZY_BRIDGE_ADAPTER_HANDSHAKE_PATH = "{{env:COMPOZY_BRIDGE_ADAPTER_HANDSHAKE_PATH}}"
COMPOZY_BRIDGE_ADAPTER_OWNERSHIP_PATH = "{{env:COMPOZY_BRIDGE_ADAPTER_OWNERSHIP_PATH}}"
COMPOZY_BRIDGE_ADAPTER_STATE_PATH = "{{env:COMPOZY_BRIDGE_ADAPTER_STATE_PATH}}"
COMPOZY_BRIDGE_ADAPTER_DELIVERY_PATH = "{{env:COMPOZY_BRIDGE_ADAPTER_DELIVERY_PATH}}"
COMPOZY_BRIDGE_ADAPTER_INGEST_PATH = "{{env:COMPOZY_BRIDGE_ADAPTER_INGEST_PATH}}"
COMPOZY_BRIDGE_ADAPTER_STARTS_PATH = "{{env:COMPOZY_BRIDGE_ADAPTER_STARTS_PATH}}"
COMPOZY_BRIDGE_ADAPTER_SHUTDOWN_PATH = "{{env:COMPOZY_BRIDGE_ADAPTER_SHUTDOWN_PATH}}"
COMPOZY_BRIDGE_ADAPTER_CRASH_ONCE_PATH = "{{env:COMPOZY_BRIDGE_ADAPTER_CRASH_ONCE_PATH}}"
COMPOZY_BRIDGE_DISCORD_LISTEN_ADDR = "{{env:COMPOZY_BRIDGE_DISCORD_LISTEN_ADDR}}"
COMPOZY_BRIDGE_DISCORD_API_BASE_URL = "{{env:COMPOZY_BRIDGE_DISCORD_API_BASE_URL}}"
