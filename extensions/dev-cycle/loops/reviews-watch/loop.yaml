apiVersion: agh.loop/v1
kind: Loop
meta:
  name: reviews-watch
  description: Watch CodeRabbit PR reviews, apply fixes, resolve threads, and optionally push the branch.
  catalog:
    use_when: "You want CodeRabbit review comments remediated until the current PR is clean."
    keywords: [reviews, coderabbit, watch, remediate]
    category: Engineering

concurrency: forbid

inputs:
  pr:
    type: number
    required: true
  fixer:
    type: agent
    default: review_fixer
  include_nitpicks:
    type: boolean
    default: false
  auto_commit:
    type: boolean
    default: false
  auto_push:
    type: boolean
    default: false
  push_remote:
    type: string
    default: origin
  poll_interval:
    type: string
    default: "30s"
  quiet_period:
    type: string
    default: "20s"

contract:
  goal: "Zero unresolved CodeRabbit threads on PR #{{ .inputs.pr }} for a review of the current HEAD."
  definition_of_done: >
    A fresh CodeRabbit review of the pushed HEAD reports no unresolved actionable threads.
  stop_when: "nodes.fetch_issues.status == 'succeeded' && size(nodes.fetch_issues.output.issues) == 0"
  iteration_cap: 0
  no_progress:
    window: 2
    hash_fields: [gate_verdict]
  budget:
    tokens: 0
    wall_clock_sec: 0
    on_exceeded: escalate
  terminal_states: [done, no-op, blocked, failed, exhausted, stalled]

graph:
  nodes:
    - id: new_review
      class: source
      kind: watch-source
      watch:
        kind: coderabbit_pr_review
        pr: "{{ .inputs.pr }}"
        poll_interval: "{{ .inputs.poll_interval }}"
        quiet_period: "{{ .inputs.quiet_period }}"
      produces:
        review:
          type: object
          properties:
            head_sha:
              type: string
            review_id:
              type: string
            submitted_at:
              type: string

    - id: fetch_issues
      class: action
      kind: ext__dev_cycle__coderabbit_fetch_unresolved
      params:
        pr: "{{ .inputs.pr }}"
        include_nitpicks: "{{ .inputs.include_nitpicks }}"
      produces:
        pr: string
        unresolved_count: integer
        issues: array

    - id: fix_batches
      class: control
      kind: fan-out
      collection: "{{ .nodes.fetch_issues.output.issues }}"
      batch_size: 10
      max_parallel: 1
      max_fan_out: 64

    - id: fix_batch
      class: action
      kind: run-agent
      params:
        agent: "{{ .inputs.fixer }}"
        prompt: |
          Kickoff directive:
          Remediate this batch of {{ len .item }} CodeRabbit review issues now. This prompt is
          the operator's authorization to make scoped code changes for PR #{{ .inputs.pr }} —
          do NOT ask for confirmation and do NOT reply with a greeting before starting.

          Required skills:
          - systematic-debugging: root-cause triage before any fix.
          - no-workarounds: complete fixes only, never symptom patches.
          - cy-fix-reviews: the remediation workflow for review issue batches.
          - cy-final-verify: required before any completion claim or commit; use it to identify
            and run the repository's real verification commands.

          Scope and tracking:
          - Treat the issues below as the entire batch scope — touch nothing else.
          - Do not resolve provider threads, push, call `gh` mutations, or mutate provider state.
          - Preserve unrelated worktree changes.
          - Keep the batch all-or-nothing: every issue below must receive one structured result;
            a batch with unhandled issues fails as a whole.

          Execution mode:
          - auto_commit: {{ .inputs.auto_commit }}
          - auto_push: {{ .inputs.auto_push }}
          {{ if .inputs.auto_push -}}
          - Because auto_push is true, create exactly one local fix commit after verification;
            the loop's push node owns the actual push.
          {{ else if .inputs.auto_commit -}}
          - Because auto_commit is true, create exactly one local fix commit after verification
            and leave the branch unpushed.
          {{ else -}}
          - Because auto_commit and auto_push are false, leave verified changes uncommitted for
            manual review.
          {{ end }}

          {{ range .item }}
          Issue {{ .id }} - {{ .title }}
          File: {{ .file }}:{{ .line }} (severity: {{ .severity }})
          Provider ref: {{ .provider_ref }}

          {{ .body }}
          {{ end }}

          Contract:
          1. Read every issue in this batch completely before editing code.
          2. Per issue, triage first with local evidence.
          3. If valid, implement a complete root-cause fix with focused tests or explain why the
             existing canonical suite already covers it.
          4. If invalid, use `resolution: documented` and document the evidence in `summary`;
             do not mark it fixed.
          5. Use `cy-final-verify` to identify and run the repository's real verification
             commands for the touched surfaces, and record exact commands and outcomes.

          Closing directive:
          Return `results` with one entry per issue id. Every result must use `resolution: fixed`
          or `resolution: documented` and a concise `summary`; invalid issues use
          `resolution: documented`.
          Follow the execution mode above exactly for commit/push handling.
        output_schema:
          type: object
          required: [results]
          properties:
            results:
              type: array
              items:
                type: object
                required: [id, triage, resolution, summary]
                properties:
                  id:
                    type: string
                  triage:
                    enum: [valid, invalid]
                  resolution:
                    enum: [fixed, documented]
                  summary:
                    type: string
      session:
        isolated: true
      timeout: 45m
      retry:
        max_attempts: 2

    - id: collect_fixes
      class: control
      kind: collect

    - id: verify
      class: control
      kind: gate
      criteria:
        - id: all_issues_handled
          type: agent-judge
          agent: reviewer
          rubric: >
            Every fetched issue across all batches has a triage decision and every valid issue has
            a complete, tested fix in the diff. Emit each unhandled issue id as a blocking issue —
            a batch with unhandled issues is a failed batch.
      verdict_policy: revise_until_clean
      on_result:
        pass: resolve_threads
        fail: next_generation
      max_revisions: 3

    - id: resolve_threads
      class: action
      kind: ext__dev_cycle__coderabbit_resolve_threads
      params:
        pr: "{{ .inputs.pr }}"
        issues: "{{ .nodes.fetch_issues.output.issues }}"
        results: "{{ .nodes.collect_fixes.output.results }}"
      produces:
        pr: string
        resolved_count: integer
        resolved_threads: array

    - id: should_push
      class: control
      kind: branch
      condition: "inputs.auto_push == true"

    - id: push_changes
      class: action
      kind: ext__dev_cycle__git_push
      params:
        remote: "{{ .inputs.push_remote }}"
        require_head_advanced: true
        expected_head: "{{ .nodes.new_review.output.review.head_sha }}"
      produces:
        remote: string
        branch: string
        head: string
        pushed: boolean

  edges:
    - from: new_review
      to: fetch_issues
    - from: fetch_issues
      to: fix_batches
    - from: fix_batches
      to: fix_batch
    - from: fix_batch
      to: collect_fixes
    - from: collect_fixes
      to: verify
    - from: verify
      to: resolve_threads
    - from: resolve_threads
      to: should_push
    - from: should_push
      to: push_changes

start:
  - kind: manual
  - kind: cli
  - kind: http
  - kind: uds
  - kind: native_tool
  - kind: trigger
  - kind: webhook
