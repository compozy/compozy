# yaml-language-server: $schema=https://goreleaser.com/static/schema-pro.json
# vim: set ts=2 sw=2 tw=0 fo=jcroql
version: 2
pro: true

project_name: compozy

metadata:
  mod_timestamp: "{{ .CommitTimestamp }}"
  license: "MIT"
  homepage: "https://compozy.com"
  description: "One complete environment to create, automate, and supervise agent work."
  maintainers:
    - "CompozyOS Team"

env:
  - GO111MODULE=on
  - CGO_ENABLED=0

git:
  tag_sort: -version:refname
  ignore_tag_prefixes:
    - sdk/go/

before:
  hooks:
    - go run github.com/magefile/mage@v1.17.2 daytonaSidecarsCheck
    - go run github.com/magefile/mage@v1.17.2 webBuild
    - go run github.com/magefile/mage@v1.17.2 webAssetsCheck
    - bash scripts/render-install-script.sh {{ .Tag }} .artifacts/install.sh

builds:
  - id: compozy
    main: .
    binary: compozy
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X github.com/compozy/compozy/internal/version.Version={{ .Version }}
      - -X github.com/compozy/compozy/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/compozy/compozy/internal/version.BuildDate={{ .CommitDate }}
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: compozy-archive
    ids:
      - compozy
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- with .Arm }}v{{ . }}{{ end }}
    format_overrides:
      - goos: windows
        formats:
          - zip
    builds_info:
      owner: root
      group: root
      mode: 0755
      mtime: "{{ .CommitDate }}"
    files:
      - src: CHANGELOG.md
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: LICENSE
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"
      - src: README.md
        info:
          owner: root
          group: root
          mode: 0644
          mtime: "{{ .CommitDate }}"

nfpms:
  - id: compozy-linux-packages
    package_name: compozy
    file_name_template: "{{ .ConventionalFileName }}"
    ids:
      - compozy
    if: '{{ eq .Os "linux" }}'
    vendor: CompozyOS
    homepage: "https://compozy.com"
    maintainer: "CompozyOS Team"
    description: "One complete environment to create, automate, and supervise agent work."
    license: "MIT"
    bindir: /usr/bin
    section: utils
    priority: optional
    formats:
      - deb
      - rpm

npms:
  - name: "@compozy/cli"
    disable: '{{ eq (index .Env "GORELEASER_PUBLISH_NPM") "false" }}'
    ids:
      - compozy-archive
    description: "One complete environment to create, automate, and supervise agent work."
    repository: "git+https://github.com/compozy/compozy.git"
    bugs: "https://github.com/compozy/compozy/issues"
    access: public
    tag: "{{ .Env.NPM_TAG }}"
    format: tar.gz
    license: "MIT"
    homepage: "https://compozy.com"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256
  extra_files:
    - glob: ./.artifacts/desktop/CompozyOS-*-mac-arm64.dmg
    - glob: ./.artifacts/desktop/CompozyOS-*-mac-arm64.zip
    - glob: ./.artifacts/desktop/CompozyOS-*-mac-x64.dmg
    - glob: ./.artifacts/desktop/CompozyOS-*-mac-x64.zip
    - glob: ./.artifacts/desktop/CompozyOS-*-linux-x64.AppImage
    - glob: ./.artifacts/desktop/CompozyOS-*-linux-x64.deb
    - glob: ./.artifacts/desktop/compat.json

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

before_publish:
  - ids:
      - compozy-archive
    artifacts:
      - archive
    cmd: go run github.com/magefile/mage@v1.17.2 updateArchiveCheck "{{ .ArtifactPath }}"
    output: true

snapshot:
  version_template: "0.0.0-{{ .Timestamp }}"

source:
  enabled: true

changelog:
  use: git
  sort: asc
  abbrev: 7
  groups:
    - title: "🎉 Features"
      regexp: "^.*feat[\\(\\w)]*:+.*$"
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: "^.*fix[\\(\\w)]*:+.*$"
      order: 1
    - title: "⚡ Performance Improvements"
      regexp: "^.*perf[\\(\\w)]*:+.*$"
      order: 2
    - title: "🔒 Security"
      regexp: "^.*security[\\(\\w)]*:+.*$"
      order: 3
    - title: "📚 Documentation"
      regexp: "^.*docs[\\(\\w)]*:+.*$"
      order: 4
    - title: "♻️ Refactoring"
      regexp: "^.*refactor[\\(\\w)]*:+.*$"
      order: 5
    - title: "📦 Dependencies"
      regexp: "^.*deps[\\(\\w)]*:+.*$"
      order: 6
    - title: "🧪 Testing"
      regexp: "^.*test[\\(\\w)]*:+.*$"
      order: 7
    - title: "Other Changes"
      order: 999
  filters:
    exclude:
      - "^(build|ci): "
      - "^ci\\(release\\): "
      - "^release: "
      - "^chore\\(release\\): "
      - "^chore: auto-update generated files$"
      - "^chore: docs$"
      - "^chore: schema update$"
      - "^chore: typo$"
      - "^chore\\(legal\\): "
      - "^chore\\(deps\\): "
      - "^docs: update$"
      - "^test:"
      - "^test\\("
      - "merge conflict"
      - Merge branch
      - Merge pull request
      - Merge remote-tracking branch
      - go mod tidy
      - "^wip "
      - "^wip:"

release:
  github:
    owner: compozy
    name: compozy
  target_commitish: "{{ .Commit }}"
  name_template: "CompozyOS {{ .Version }} — {{ .Env.RELEASE_CHANNEL }}"
  mode: replace
  draft: true
  # This field does not support templates. The release planner enforces that
  # beta versions carry prerelease data while stable and legacy versions do not.
  prerelease: auto
  make_latest: "{{ .Env.GITHUB_MAKE_LATEST }}"
  extra_files:
    - glob: ./.artifacts/install.sh
      name_template: install.sh
    - glob: ./.artifacts/desktop/CompozyOS-*-mac-arm64.dmg
    - glob: ./.artifacts/desktop/CompozyOS-*-mac-arm64.zip
    - glob: ./.artifacts/desktop/CompozyOS-*-mac-x64.dmg
    - glob: ./.artifacts/desktop/CompozyOS-*-mac-x64.zip
    - glob: ./.artifacts/desktop/CompozyOS-*-linux-x64.AppImage
    - glob: ./.artifacts/desktop/CompozyOS-*-linux-x64.deb
    - glob: ./.artifacts/desktop/compat.json

sboms:
  - id: archive
    artifacts: archive
  - id: package
    artifacts: package
  - id: source
    artifacts: source
